// Enhances every <select> within `container` into a custom in-app dropdown
// (an inline-expanding list styled like the rest of the app) instead of the
// browser's own native dropdown popup. The real <select> stays in the DOM
// (visually hidden) so every existing .value read/write and 'change'
// listener throughout the app keeps working completely unchanged — this
// is purely a visual layer on top of it.
// Enhances every <input list="..."> within `container` into a custom
// in-app searchable autocomplete (an inline-filtering list styled like the
// rest of the app) instead of the browser's own native datalist suggestion
// popup. The input keeps working exactly as before (free typing still
// allowed, for cases like entering a brand-new party name) — this only
// replaces the SUGGESTION UI on top of it.
function enhanceAutocomplete(container){
  (container || document).querySelectorAll('input[list]:not([data-idac-enhanced])').forEach(input=>{
    const datalistId = input.getAttribute('list');
    const datalist = document.getElementById(datalistId);
    if(!datalist) return;
    input.dataset.idacEnhanced = '1';
    input.removeAttribute('list'); // stop the native browser suggestion popup — we render our own below instead
    const options = [...datalist.options].map(o=>o.value);

    const wrap = document.createElement('div');
    wrap.className = 'idd-wrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    const list = document.createElement('div');
    list.className = 'idd-list';
    wrap.appendChild(list);

    const closeList = ()=>{ list.classList.remove('idd-list-open'); };
    const buildList = (filterText)=>{
      if(input.disabled){ closeList(); return; }
      const norm = (filterText||'').trim().toLowerCase();
      const filtered = (norm ? options.filter(o=>o.toLowerCase().includes(norm)) : options).slice(0,50); // cap for perf on long catalogs
      list.innerHTML = '';
      if(filtered.length===0){ closeList(); return; }
      filtered.forEach(opt=>{
        const item = document.createElement('div');
        item.className = 'idd-item';
        item.textContent = opt;
        // mousedown (not click) fires before the input's blur, so the
        // selection registers before blur's delayed close removes the list
        item.addEventListener('mousedown', (e)=>{
          e.preventDefault();
          input.value = opt;
          input.dispatchEvent(new Event('input', {bubbles:true}));
          input.dispatchEvent(new Event('change', {bubbles:true}));
          closeList();
        });
        list.appendChild(item);
      });
      list.classList.add('idd-list-open');
    };
    input.addEventListener('input', ()=>buildList(input.value));
    input.addEventListener('focus', ()=>buildList(input.value));
    input.addEventListener('blur', ()=>{ setTimeout(closeList, 150); });
  });
}
function enhanceFormControls(container){
  enhanceDropdowns(container);
  enhanceAutocomplete(container);
}
function enhanceDropdowns(container){
  (container || document).querySelectorAll('select:not([data-idd-enhanced])').forEach(sel=>{
    sel.dataset.iddEnhanced = '1';
    const wrap = document.createElement('div');
    wrap.className = 'idd-wrap';
    sel.parentNode.insertBefore(wrap, sel);
    sel.style.display = 'none';
    wrap.appendChild(sel);
    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'idd-trigger';
    trigger.innerHTML = `<span class="idd-trigger-text"></span><span class="idd-chevron">▾</span>`;
    const list = document.createElement('div');
    list.className = 'idd-list';
    wrap.appendChild(trigger);
    wrap.appendChild(list);

    const textSpan = trigger.querySelector('.idd-trigger-text');
    const refreshTrigger = ()=>{
      const opt = sel.options[sel.selectedIndex];
      const isPlaceholder = !opt || !opt.value;
      textSpan.textContent = opt ? opt.textContent : '';
      trigger.classList.toggle('idd-placeholder', isPlaceholder);
      trigger.classList.toggle('idd-disabled-trigger', sel.disabled);
    };
    const closeList = ()=>{ list.classList.remove('idd-list-open'); trigger.classList.remove('idd-open'); };
    const buildList = ()=>{
      list.innerHTML = '';
      [...sel.options].forEach((opt, idx)=>{
        const item = document.createElement('div');
        item.className = 'idd-item' + (opt.selected?' idd-selected':'') + (opt.disabled?' idd-disabled':'');
        item.textContent = opt.textContent;
        if(!opt.disabled){
          item.addEventListener('click', ()=>{
            sel.selectedIndex = idx;
            sel.dispatchEvent(new Event('change', {bubbles:true}));
            refreshTrigger();
            closeList();
          });
        }
        list.appendChild(item);
      });
    };
    trigger.addEventListener('click', ()=>{
      if(sel.disabled) return;
      const isOpen = list.classList.contains('idd-list-open');
      document.querySelectorAll('.idd-list.idd-list-open').forEach(l=>{ l.classList.remove('idd-list-open'); if(l.previousElementSibling) l.previousElementSibling.classList.remove('idd-open'); });
      if(!isOpen){ buildList(); list.classList.add('idd-list-open'); trigger.classList.add('idd-open'); }
    });
    // Most code elsewhere that sets sel.value directly also dispatches a
    // 'change' event right after (the established pattern throughout this
    // app), which is what keeps the visible trigger text in sync with it.
    sel.addEventListener('change', refreshTrigger);
    refreshTrigger();
  });
}

function sendStockTask(kind, itemId, label, qtyText){
  const targetRole = kind==='filled' ? 'filling' : kind==='ready' ? 'packaging' : null;
  if(!targetRole){ showToast('Owner purchases raw material — nothing to send.', true); return; }
  const already = S.stockTasks.some(t=>t.status==='open' && t.kind===kind && t.itemId===itemId);
  if(already){ showToast('Already sent — still open'); return; }
  S.stockTasks.push({id:uid(), kind, itemId, label, qtyText:qtyText||'', targetRole, createdBy:S.currentUser.name, createdAt:Date.now(), status:'open'});
  safeSet('app:stockTasks', S.stockTasks);
  showToast('Sent to '+(targetRole==='filling'?'filling team':'packaging team'));
}
// Filling team fills more -> clears any open "filled stock low" task for that item.
function completeStockTasksForItem(kind, key){
  let changed=false;
  S.stockTasks.forEach(t=>{ if(t.status==='open' && t.kind===kind && t.itemId===key){ t.status='done'; changed=true; } });
  if(changed) safeSet('app:stockTasks', S.stockTasks);
}
// Auto-closes any open stock task whose underlying shortage/low-stock alert
// no longer exists — e.g. an order was deleted or edited and the item is no
// longer short, so the task the team was working on is removed automatically.
function reconcileStockTasks(){
  const alerts = getStockAlerts();
  const stillAlerting = (t)=>{
    const list = t.tier==='recommended'
      ? (t.kind==='filled' ? alerts.recommended.filled : alerts.recommended.ready)
      : (t.kind==='filled' ? alerts.filled : alerts.ready);
    return list.some(a=>a.id===t.itemId);
  };
  let changed = false;
  S.stockTasks.forEach(t=>{
    if(t.status==='open' && !stillAlerting(t)){ t.status='done'; changed=true; }
  });
  if(changed) safeSet('app:stockTasks', S.stockTasks);
  return changed;
}
// Automatically pushes every active filled/ready shortage into the relevant
// team's task list — no manual "send" needed. Idempotent (skips ones already open).
// Once every non-cancelled item on a processing order genuinely no longer
// needs filling (or, after that, packing) — per the same cascade-aware
// stock check the demand table uses — the order's status advances on its
// own. This replaces the old manual "mark done" buttons: completion is now
// a fact about the stock, not a claim someone has to remember to make.
function autoAdvanceFillingPackaging(alerts){
  let changed = false;
  const touchedDays = new Set();
  S.orders.forEach(o=>{
    if(o.status!=='processing') return;
    if(o.fillingStatus!=='done' && !orderNeedsRoleWork(o,'filling',alerts)){
      o.fillingStatus='done'; changed=true; touchedDays.add(localDateKey(o.createdAt));
    }
    if(o.fillingStatus==='done' && o.packagingStatus!=='done' && !orderNeedsRoleWork(o,'packaging',alerts)){
      o.packagingStatus='done'; changed=true; touchedDays.add(localDateKey(o.createdAt));
    }
  });
  touchedDays.forEach(d=>savePartitionDay('orders', d));
  return changed;
}
function syncStockTasksFromAlerts(){
  let changed = false;
  // Anyone's action can resolve a shortage, so reconciliation (closing tasks
  // that no longer apply) always runs. Only admin/manager *create* new tasks,
  // to avoid every role's routine actions spawning tasks on a technicality.
  if(S.currentUser && ['admin','manager'].includes(S.currentUser.role)){
    const alerts = getStockAlerts();
    const ensure = (kind, list, tier)=>{
      list.forEach(a=>{
        const already = S.stockTasks.some(t=>t.status==='open' && t.kind===kind && t.itemId===a.id && (t.tier||null)===(tier||null));
        if(!already){
          S.stockTasks.push({id:uid(), kind, itemId:a.id, label:a.label, qtyText:a.text||'', targetRole: kind==='filled'?'filling':'packaging', createdBy:'Auto', createdAt:Date.now(), status:'open', ...(tier?{tier}:{})});
          changed = true;
        }
      });
    };
    ensure('filled', alerts.filled);
    ensure('ready', alerts.ready);
    // Recommended (preemptive) tasks are always created too — they're just
    // kept out of the bell when there's more pressing work (see renderNotifPanel).
    ensure('filled', alerts.recommended.filled, 'recommended');
    ensure('ready', alerts.recommended.ready, 'recommended');
  }
  if(autoAdvanceFillingPackaging(getStockAlerts())) changed = true;
  if(reconcileStockTasks()) changed = true;
  if(changed) safeSet('app:stockTasks', S.stockTasks);
  return changed;
}
function assignAllStockTasks(kind){
  const alerts = getStockAlerts();
  const list = kind==='filled' ? alerts.filled : alerts.ready;
  let count = 0;
  list.forEach(a=>{
    const already = S.stockTasks.some(t=>t.status==='open' && t.kind===kind && t.itemId===a.id);
    if(!already){
      S.stockTasks.push({id:uid(), kind, itemId:a.id, label:a.label, qtyText:a.text||'', targetRole: kind==='filled'?'filling':'packaging', createdBy:S.currentUser.name, createdAt:Date.now(), status:'open'});

  if(count) safeSet('app:stockTasks', S.stockTasks);
  showToast(count ? `${count} task(s) assigned to the ${kind==='filled'?'filling':'packaging'} team` : 'Already all assigned');
  render();
}

function activityLabel(e){

  if(e.kind==='filling') return `Filling — ${e.itemLabel}`;

// Records a single stock movement for the per-item audit trail (admin-only,
// 7-day retention). kind: 'purchase'|'filling'|'packaging'|'order'|'retail'|'adjust'.
// delta is signed (+added, -deducted) so the log reads naturally either way.
function logStockMovement(key, itemLabel, kind, delta, note, poolOverride){
  // Unit/pool isn't always obvious from `kind` alone (e.g. 'adjust' could be
  // raw/filled/ready; packaging's filled-side line also uses kind='packaging'
  // just like its ready-side line) — poolOverride disambiguates those.
  // Raw material categories are auto-detected by key, since they're never
  // ambiguous with a catalog item key.
  const isRaw = poolOverride==='raw' || (!poolOverride && RAW_CATEGORIES.includes(key));
  const isFilledPool = poolOverride==='filled' || (!poolOverride && !isRaw && kind==='filling');
  const pool = isRaw ? 'raw' : isFilledPool ? 'filled' : 'ready';
  const unit = isRaw ? 'mL' : 'pc';
  const totalAfter = isRaw ? (S.rawMaterial[key]||0) : isFilledPool ? (S.filledStock[key]||0) : (S.readyStock[key]||0);
  const entry = { id:uid(), key, itemLabel, kind, delta, note: note||'', unit, pool, totalAfter, by:S.currentUser.name, byUsername:S.currentUser.username, at:Date.now() };
  S.stockMovementLog.push(entry);
  savePartitionForItem('stockMovementLog', entry);
}
function applyActivityForward(e){
  if(e.kind==='purchase'){ S.rawMaterial[e.cat] = (S.rawMaterial[e.cat]||0) + e.ml; logStockMovement(e.cat, e.cat, 'purchase', e.ml, `${activityLabel(e)} — entry edited`); }
  if(e.kind==='filling'){
    const mlUsed = e.actualMl!=null ? e.actualMl : (e.qty*e.mlPer);
    S.rawMaterial[e.rawCat] = (S.rawMaterial[e.rawCat]||0) - mlUsed;
    S.filledStock[e.key] = (S.filledStock[e.key]||0) + e.qty;
    logStockMovement(e.rawCat, e.rawCat, 'filling', -mlUsed, `${activityLabel(e)} — entry edited`);
    logStockMovement(e.key, e.itemLabel, 'filling', e.qty, `${activityLabel(e)} — entry edited`);
  }
  if(e.kind==='packaging'){
    S.filledStock[e.key] = (S.filledStock[e.key]||0) - e.qty;
    S.readyStock[e.key] = (S.readyStock[e.key]||0) + e.qty;
    // Keep the "Updated Qty" shown on the Daily Work packing row accurate
    // after an edit re-applies this entry's stock effect.
    e.totalAfter = S.readyStock[e.key];
    logStockMovement(e.key, e.itemLabel, 'packaging', -e.qty, `${activityLabel(e)} — entry edited (from filled)`, 'filled');
    logStockMovement(e.key, e.itemLabel, 'packaging', e.qty, `${activityLabel(e)} — entry edited`);
  }
}
function revertActivity(e, reason){
  const tag = reason==='delete' ? 'entry deleted' : 'reverted';
  if(e.kind==='purchase'){ S.rawMaterial[e.cat] = (S.rawMaterial[e.cat]||0) - e.ml; logStockMovement(e.cat, e.cat, 'purchase', -e.ml, `${activityLabel(e)} — ${tag}`); }
  if(e.kind==='filling'){
    const mlUsed = e.actualMl!=null ? e.actualMl : (e.qty*e.mlPer);
    S.rawMaterial[e.rawCat] = (S.rawMaterial[e.rawCat]||0) + mlUsed;
    S.filledStock[e.key] = (S.filledStock[e.key]||0) - e.qty;
    logStockMovement(e.rawCat, e.rawCat, 'filling', mlUsed, `${activityLabel(e)} — ${tag}`);
    logStockMovement(e.key, e.itemLabel, 'filling', -e.qty, `${activityLabel(e)} — ${tag}`);
  }
  if(e.kind==='packaging'){
    S.filledStock[e.key] = (S.filledStock[e.key]||0) + e.qty;
    S.readyStock[e.key] = (S.readyStock[e.key]||0) - e.qty;
    logStockMovement(e.key, e.itemLabel, 'packaging', e.qty, `${activityLabel(e)} — ${tag} (to filled)`, 'filled');
    logStockMovement(e.key, e.itemLabel, 'packaging', -e.qty, `${activityLabel(e)} — ${tag}`);
  }
}

    // MEDIUM FIX (2026-08-21 audit, finding #20): this Save button is
    // type="button" with its own click handler, not a real <form> submit
    // -- so the input's min="0" HTML attribute is never actually enforced
    // by the browser's constraint validation (that only runs on a real
    // form submission). Without this explicit check, typing a negative
    // quantity here silently corrupts stock totals via
    // applyActivityForward/revertActivity below.
    if(val<0){ showAlert('Quantity cannot be negative.'); return; }
    const cap = isPurchase ? MAX_PURCHASE_L : MAX_PC_ENTRY;
    if(val>cap){ showAlert(`Max allowed is ${cap} ${isPurchase?'L':'pc'} per entry.`); return; }
    revertActivity(e);
    if(isPurchase){ e.ml = val*1000; }
    else {
      e.qty = Math.round(val);
      if(isFilling){
        const actualLInput = document.getElementById('editLogActualL');
        const actualL = actualLInput ? parseFloat(actualLInput.value) : NaN;
        e.actualMl = !isNaN(actualL) && actualL>=0 ? actualL*1000 : null; // null = fall back to standard qty*mlPer
      }
    }
    applyActivityForward(e); // already logs "entry edited" internally (see applyActivityForward)
    saveAfterActivityChange(e);
    closeModal(); render(); showToast('Entry updated');
  });
}
function alertBanner(list){
  if(!list.length) return '';
  const crit = list.filter(a=>a.level!=='low');
  const low = list.filter(a=>a.level==='low');
  const entryHtml = (a, isCrit)=>`

      <div style="font-size:14px;font-weight:800;margin-bottom:2px;">${esc(a.label)}</div>
      <div style="font-size:12.5px;">${isCrit?`<span class="stockneg">${esc(a.text)}</span>`:esc(a.text)}</div>
      <div style="font-size:11px;opacity:0.75;margin-top:1px;">${esc(a.team)}</div>

  let out = '';
  if(crit.length) out += `<div class="alert-banner"><b>⚠ ${crit.length} item(s) short</b>${crit.map(a=>entryHtml(a,true)).join('')}</div>`;

function render(){
  const root = document.getElementById('root');
  if(!S.loaded){
    root.innerHTML = renderBrandedLoadingScreen();
    return;
  }
  if(S.loadFailed && !S.currentUser){
    root.innerHTML = renderConnectionFailedScreen();
    bindConnectionFailedScreen();
    return;
  }
  if(!S.currentUser){
    if(S.postLoginPhase){
      root.innerHTML = renderPostLoginSequence();
      bindPostLoginSequence();
      return;
    }
    root.innerHTML = renderLogin();
    bindLogin();
    lastRenderedView = null;
    return;
  }
  // Rebuilding innerHTML resets scroll to 0 by default — capture and restore
  // the scrollable .content area's position so clicking anything doesn't
  // yank the page back to the top. Only do this when staying on the same
  // screen; switching tabs should still start fresh at the top.
  const sameView = lastRenderedView === S.view;
  navJustSwitched = !sameView; // read by the nav-item template to pop only the tab that's genuinely becoming active
  const prevContent = root.querySelector('.content');
  const savedScrollTop = sameView && prevContent ? prevContent.scrollTop : 0;
  const newHtml = renderShell();
  // Most background sync updates don't actually change anything THIS user
  // can currently see (someone else marked attendance while you're viewing
  // Orders, say) — skip the DOM replacement entirely when the screen would
  // come out byte-for-byte identical. This is what was causing the visible
  // "jump to top and back" on every sync tick: a full shell rebuild for a
  // screen that hadn't actually changed at all.
  if(sameView && newHtml === lastRenderedHtml) return;
  lastRenderedHtml = newHtml;
  root.innerHTML = newHtml;
  bindShell();
  enhanceFormControls(root);
  const newContent = root.querySelector('.content');
  if(newContent){
    newContent.style.scrollBehavior = 'auto'; // land instantly — don't let the smooth-scroll CSS animate this correction
    newContent.scrollTop = savedScrollTop;
  }
  lastRenderedView = S.view;
}

let loginSubmitting = false;
// ---- Failed-login lockout (security feature, 2026-08-21): 5 wrong
// attempts in a row locks that USERNAME (not just this browser) out for
// 120 seconds, synced via S.loginLockouts/app:loginLockouts so it's a real
// cross-device limit. As of this same date's server-side auth fix (findings
// #3/#4), the actual failCount/lockedUntil bookkeeping moved to the server
// (recordFailedLoginServer_/clearFailedLoginsServer_ in
// order-ops-backend.gs, run as part of action:"login" itself) since login
// verification moved there too — a client-only write here would now just
// be rejected (session_required) anyway, since it happens before any
// session exists. S.loginLockouts is still read here (see bindLogin below)
// purely as a fast local pre-check to skip an unnecessary round-trip when
// we already know from normal sync that this username is locked; the
// server's own check in the login action is what's actually authoritative.
function bindLogin(){
  loginSubmitting = false; // reset every time the login form is (re)shown — e.g. after logout — so a stuck flag from a prior successful login never blocks the next one
  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    // Guards against a double-submit (e.g. impatient double-click / double
    // Enter) firing this handler twice while still awaiting loadAllPromise —
    // that used to race two loading sequences against each other and made
    // the delay look like it got skipped or cut short.
    if(loginSubmitting) return;
    loginSubmitting = true;
    const u = document.getElementById('loginUser').value;
    const p = document.getElementById('loginPass').value;
    if(loadAllPromise) await loadAllPromise; // data may still be loading in the background — wait for it before checking credentials
    const uKey = u.trim().toLowerCase();
    const lock = S.loginLockouts[uKey];
    if(lock && lock.lockedUntil && lock.lockedUntil > Date.now()){
      loginSubmitting = false;
      const waitSec = Math.max(1, Math.ceil((lock.lockedUntil - Date.now())/1000));
      loginError = `Too many failed attempts — try again in ${waitSec}s.`;
      render();
      return;
    }
    // SECURITY FIX (2026-08-21 audit, findings #3/#4): the password check
    // now happens on the SERVER first (real verification against the
    // stored hash, real lockout tracking, a real session token minted on
    // success) — the app no longer decides "this login is valid" purely by
    // comparing against a locally-held password hash and then trusting
    // itself. clearFailedLogins/recordFailedLogin (client-only writes) are
    // dropped in favor of the server's own recordFailedLoginServer_/
    // clearFailedLoginsServer_, which run as part of the same login call.
    let result;
    try{
      result = await apiLogin(u, p);
    }catch(netErr){
      // Server unreachable (not a wrong password) — fall back to the old
      // local-only check so someone who already has the app loaded can
      // still get in and see their synced data offline. No session token
      // is issued in this path, so every WRITE will correctly come back
      // session_required (handleAuthError) until they're back online and
      // get a real session — this only ever restores read access.
      console.error('Server login unreachable, falling back to local check', netErr);
      const matched = await findMatchingUser(u, p);
      if(matched){
        loginError=''; S.authToken = null; persistAuthToken(null);
        startPostLoginSequence(matched);
      } else {
        loginSubmitting = false; startWrongLoginSequence();
      }
      return;
    }
    if(result && result.ok && result.user){
      loginError = '';
      S.authToken = result.sessionToken;
      persistAuthToken(result.sessionToken);
      // Prefer the already-loaded local user record (same object identity
      // as everything else in S.users) when we have it; the server's
      // sanitized copy (no password fields anyway) is only a fallback for
      // the rare case the local list hasn't synced this account yet.
      const matched = S.users.find(x=>x.username.toLowerCase()===result.user.username.toLowerCase()) || result.user;
      startPostLoginSequence(matched);
    } else if(result && result.error === 'locked'){
      loginSubmitting = false;
      const waitSec = Math.max(1, Math.ceil(((result.lockedUntil||Date.now())-Date.now())/1000));
      loginError = `Too many failed attempts — try again in ${waitSec}s.`;
      render();
    } else {
      loginSubmitting = false;
      startWrongLoginSequence();
    }
  });
}

/* ============================= POST-LOGIN SEQUENCE (loading -> welcome) ============================= */
const POST_LOGIN_LOADING_MSGS = ['Loading Orders…','Loading Stock…','Updating other features…'];
function startPostLoginSequence(user){
  if(S.postLoginPhase) return; // a sequence is already running — never start a second one on top of it
  S.pendingUser = user;
  S.postLoginPhase = 'loading';
  S.postLoginLoadingStep = 0;
  render();
  const stepMs = 750; // 3 steps ≈ 2.25s total, comfortably over the requested 2s
  const tick = ()=>{
    S.postLoginLoadingStep++;
    if(S.postLoginLoadingStep < POST_LOGIN_LOADING_MSGS.length){
      render();
      setTimeout(tick, stepMs);
    } else {
      S.postLoginPhase = 'welcome';
      render();
    }
  };
  setTimeout(tick, stepMs);
}
const WRONG_LOGIN_MSGS = ['Searching for employee ID…','Fake login found','Report sent to company'];
function startWrongLoginSequence(){
  if(S.postLoginPhase) return; // don't overlap with an already-running sequence
  S.postLoginPhase = 'wrongLogin';
  S.postLoginLoadingStep = 0;
  render();
  const stepMs = 1330; // 3 steps ≈ 4s total
  const tick = ()=>{
    S.postLoginLoadingStep++;
    if(S.postLoginLoadingStep < WRONG_LOGIN_MSGS.length){
      render();
      setTimeout(tick, stepMs);
    } else {
      S.postLoginPhase = null;
      loginError = 'Invalid Login ID & Password';
      render();
    }
  };
  setTimeout(tick, stepMs);
}

function myRoleAlerts(stockAlerts){
  // Each role only sees alerts relevant to their own job. Sales doesn't
  // handle stock at all, so they get none — no "Alerts for you" card, no
  // alert bells (see myRoleAlertKinds below, which drives those bells).
  const role = S.currentUser.role;
  if(role==='admin' || role==='manager') return [...stockAlerts.raw, ...stockAlerts.filled, ...stockAlerts.ready];
  if(role==='filling') return stockAlerts.filled;   // filled stock short -> filling team fills more
  if(role==='packaging') return stockAlerts.ready;  // ready stock short -> packaging team packs more
  return [];
}
// Splits this role's relevant stock alerts into the 3 severity tiers,
// grouped by kind (raw/filled/ready) for rendering. Recommended is only
// meaningful to surface when there's nothing more pressing for this role.
function myAlertTiers(stockAlerts){
  const role = S.currentUser.role;
  const kinds = myRoleAlertKinds(role);
  const urgentByKind = {}, lowByKind = {}, recByKind = {};
  kinds.forEach(k=>{
    urgentByKind[k] = stockAlerts[k].filter(a=>a.level==='critical');
    lowByKind[k] = stockAlerts[k].filter(a=>a.level==='low');
    recByKind[k] = stockAlerts.recommended[k] || [];
  });
  const urgentCount = kinds.reduce((s,k)=>s+urgentByKind[k].length,0);
  const lowCount = kinds.reduce((s,k)=>s+lowByKind[k].length,0);
  const recCount = kinds.reduce((s,k)=>s+recByKind[k].length,0);
  return { kinds, urgentByKind, lowByKind, recByKind, urgentCount, lowCount, recCount, showRecommended: recCount>0 && (urgentCount+lowCount)===0 };
}
function myNotifCount(stockAlerts){
  const role = S.currentUser.role;
  const pendingOrders = S.orders.filter(o=>o.status==='pending').length;
  const reviewTasks = S.orders.filter(o => o.fillingStatus==='review' || o.packagingStatus==='review').length;
  if(role==='admin') return pendingOrders+reviewTasks;
  if(role==='manager') return S.orders.filter(o=>o.status==='processing' && (o.fillingStatus!=='done'||o.packagingStatus!=='done')).length;
  if(role==='filling') return S.orders.filter(o=>o.status==='processing' && o.fillingStatus!=='done' && orderNeedsRoleWork(o,'filling',stockAlerts)).length;
  if(role==='packaging') return S.orders.filter(o=>o.status==='processing' && o.fillingStatus==='done' && o.packagingStatus!=='done' && orderNeedsRoleWork(o,'packaging',stockAlerts)).length;
  return 0;
}

function renderNotifPanel(stockAlerts){
  const role = S.currentUser.role;
  const isAdmin = role==='admin';
  const pendingOrders = isAdmin ? S.orders.filter(o=>o.status==='pending') : [];
  const packedOrders = isAdmin ? S.orders.filter(o=>o.status==='packed') : [];
  const reviewTasks = isAdmin ? S.orders.filter(o => o.fillingStatus==='review' || o.packagingStatus==='review') : [];
  let myWork = [];
  if(role==='filling') myWork = S.orders.filter(o=>o.status==='processing' && o.fillingStatus!=='done' && orderNeedsRoleWork(o,'filling',stockAlerts));
  if(role==='packaging') myWork = S.orders.filter(o=>o.status==='processing' && o.fillingStatus==='done' && o.packagingStatus!=='done' && orderNeedsRoleWork(o,'packaging',stockAlerts));
  if(role==='manager') myWork = S.orders.filter(o=>o.status==='processing' && (o.fillingStatus!=='done'||o.packagingStatus!=='done'));
  return `<h3>${isAdmin?'Pending your approval':'Your alerts'}</h3>
    <p class="desc" style="margin-top:-8px;">${isAdmin?'Waiting on you.':'Your alerts.'}</p>
    ${pendingOrders.length===0 && packedOrders.length===0 && reviewTasks.length===0 && myWork.length===0 ? `<div class="empty">Nothing waiting on you right now.</div>` : ''}
    ${pendingOrders.map(o=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;">
        <div style="font-size:13px;"><b>${esc(o.customerName)}</b> — ${o.items.map(i=>`${esc(i.name)} ${esc(i.size)} ×${i.qty}`).join(', ')} <span class="mono">(by ${esc(o.createdBy)})</span></div>
        <div class="row-actions">
          <button class="btn btn-sm btn-success" data-approve-order="${o.id}">Accept</button>
          <button class="btn btn-sm btn-danger" data-reject-order="${o.id}">Reject</button>
        </div>
      </div>`).join('')}
    ${packedOrders.map(o=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;">
        <div style="font-size:13px;"><b>${esc(o.customerName)}</b> — packed, ready to dispatch</div>
        <div class="row-actions"><button class="btn btn-sm btn-success" data-notif-dispatch="${o.id}">Dispatch</button></div>
      </div>`).join('')}
    ${reviewTasks.map(o=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;">
        <div style="font-size:13px;"><b>${esc(o.customerName)}</b> — ${o.fillingStatus==='review'?'Filling':'Packaging'} marked done, needs sign-off</div>
        <div class="row-actions">
          <button class="btn btn-sm btn-success" data-ack-task="${o.id}|${o.fillingStatus==='review'?'filling':'packaging'}">Confirm done</button>
        </div>
      </div>`).join('')}
    ${!isAdmin && myWork.length ? `<div style="font-size:12.5px;margin:6px 0;"><b>${myWork.length}</b> order(s) waiting on your work — check Tasks.</div>` : ''}`;
}

function bindShell(){
  const avatarBtn = document.getElementById('avatarBtn');
  if(avatarBtn) avatarBtn.addEventListener('click', ()=>{ S.profileOpen=true; S.notifOpen=false; S.moreOpen=false; S.alertPanelOpen=null; render(); });
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.addEventListener('click', doLogout);

  const bell = document.getElementById('bellBtn');
  if(bell) bell.addEventListener('click', ()=>{ S.notifOpen = !S.notifOpen; S.moreOpen=false; S.profileOpen=false; S.alertPanelOpen=null; render(); });
  const urgentBell = document.getElementById('urgentBellBtn');
  if(urgentBell) urgentBell.addEventListener('click', ()=>{ S.alertPanelOpen = S.alertPanelOpen==='urgent'?null:'urgent'; S.notifOpen=false; S.moreOpen=false; S.profileOpen=false; render(); });
  const lowBell = document.getElementById('lowBellBtn');
  if(lowBell) lowBell.addEventListener('click', ()=>{ S.alertPanelOpen = S.alertPanelOpen==='low'?null:'low'; S.notifOpen=false; S.moreOpen=false; S.profileOpen=false; render(); });
  const recBell = document.getElementById('recBellBtn');
  if(recBell) recBell.addEventListener('click', ()=>{ S.alertPanelOpen = S.alertPanelOpen==='recommended'?null:'recommended'; S.notifOpen=false; S.moreOpen=false; S.profileOpen=false; render(); });

  const moreBtn = document.getElementById('moreNavBtn');
  if(moreBtn) moreBtn.addEventListener('click', ()=>{ S.moreOpen = !S.moreOpen; S.notifOpen=false; S.profileOpen=false; S.alertPanelOpen=null; render(); });

  document.querySelectorAll('[data-sheet-overlay]').forEach(ov=>{
    ov.addEventListener('click', (e)=>{
      if(e.target !== ov) return;
      S.notifOpen=false; S.moreOpen=false; S.profileOpen=false; S.alertPanelOpen=null; render();
    });
  });

  document.querySelectorAll('.navitem[data-tab]').forEach(t=>{
    t.addEventListener('click', ()=>{ S.view = t.dataset.tab; S.notifOpen=false; S.moreOpen=false; S.alertPanelOpen=null; render(); });
  });
  document.querySelectorAll('[data-more-tab]').forEach(t=>{
    t.addEventListener('click', ()=>{ S.view = t.dataset.moreTab; S.moreOpen=false; render(); });
  });

  document.querySelectorAll('[data-approve-order]').forEach(b=>b.addEventListener('click', ()=>{ setOrderStatus(b.dataset.approveOrder, 'processing'); render(); }));
  document.querySelectorAll('[data-reject-order]').forEach(b=>b.addEventListener('click', ()=>{ setOrderStatus(b.dataset.rejectOrder, 'rejected'); render(); }));
  // Notif-panel "Dispatch" quick action — opens the same dispatch/LR modal
  // as the Orders tab. Deliberately a separate data-attribute (not
  // data-dispatch-order) so this querySelectorAll — which runs against the
  // WHOLE page, not just the notif sheet — can never double-bind against
  // the dispatch buttons bindOrderRowActions already wires up elsewhere.
  document.querySelectorAll('[data-notif-dispatch]').forEach(b=>b.addEventListener('click', ()=>{ openDispatchModal(b.dataset.notifDispatch); }));
  document.querySelectorAll('[data-ack-task]').forEach(b=>b.addEventListener('click', ()=>{
    const [id, kind] = b.dataset.ackTask.split('|');
    ackTask(id, kind); render();
  }));

  const syncDot = document.getElementById('syncDot');
  if(syncDot && syncing) syncDot.classList.add('syncing');
  if(syncDot && pendingSaveCount()>0) syncDot.classList.add('pending');

  if(S.notifOpen || S.alertPanelOpen) bindAlertTiles();
  bindView();
}

function orderIsFullyStocked(o){
  return o.items.every(d => (S.readyStock[d.key]||0) >= 0);
}
// Orders move Processing -> Ready automatically the moment every item on
// them is actually covered by current stock — driven purely by the normal
// Record Packaging flow, no separate manual step needed.
function autoAdvanceOrders(){
  let changed = false;
  const touchedDays = new Set();
  S.orders.forEach(o=>{
    if(o.status==='processing' && orderIsFullyStocked(o)){
      o.status='ready'; changed=true; touchedDays.add(localDateKey(o.createdAt));
    }
  });
  touchedDays.forEach(d=>savePartitionDay('orders', d));
  return changed;
}
// Admin can jump straight to Ready before stock naturally catches up on
// every item — whatever's still short right now gets marked Cancelled.
// Undoable: reverses only the items THIS action cancelled, and puts the
// order back to Processing.
function markOrderReadyNow(orderId){
  if(S.currentUser.role!=='admin') return; // admin-only
  const o = S.orders.find(x=>x.id===orderId); if(!o) return;
  showConfirm('Mark this order Ready now? Any item still short in stock will be marked Cancelled.', ()=>{
    let stockChanged = false;
    o.items.forEach(it=>{
      if(it.cancelled) return;
      const stockNow = S.readyStock[it.key]||0;
      if(stockNow < 0){
        it.cancelled = true; it.autoCancelledByReady = true;
        // This item's need no longer exists — credit back the qty that was
        // deducted for it at accept time, same as deleting an order does.
        // Otherwise the shortage number (and the filling/packing task it
        // drives) stays inflated for a need that's no longer real.
        S.readyStock[it.key] = stockNow + it.qty;
        logStockMovement(it.key, `${it.name} ${it.size}`, 'order', it.qty, `Mark Ready — item cancelled (short), credited back — ${orderDisplayLabel(o)}`);
        stockChanged = true;
      }
    });
    o.status = 'ready';
    savePartitionForItem('orders', o);
    if(stockChanged){ safeSet('app:readyStock', S.readyStock); syncStockTasksFromAlerts(); }
    render();
    showToast('Order marked Ready — short items cancelled (undoable)');
  }, {danger:false, confirmLabel:'Mark Ready'});
}
function undoMarkOrderReady(orderId){
  const o = S.orders.find(x=>x.id===orderId); if(!o) return;
  let stockChanged = false;
  o.items.forEach(it=>{
    if(it.autoCancelledByReady){
      it.cancelled = false; delete it.autoCancelledByReady;
      // Re-deduct the qty that was credited back, since this item is
      // needed again now that the order is back in Processing.
      S.readyStock[it.key] = (S.readyStock[it.key]||0) - it.qty;
      logStockMovement(it.key, `${it.name} ${it.size}`, 'order', -it.qty, `Undo Mark Ready — item needed again, re-deducted — ${orderDisplayLabel(o)}`);
      stockChanged = true;
    }
  });
  o.status = 'processing';
  savePartitionForItem('orders', o);
  if(stockChanged){ safeSet('app:readyStock', S.readyStock); syncStockTasksFromAlerts(); }
  render();
  showToast('Undone — back to Processing');
}
// Ready -> Packed is a manual physical-packing checkpoint (admin/manager
// only) that sits between the order being fully stocked (Ready) and the
// actual dispatch booking (Processed & Dispatched, which opens the LR/
// transport modal). No stock side-effects — purely a status + audit trail.
function markOrderPacked(orderId){
  if(S.currentUser.role!=='admin' && S.currentUser.role!=='manager') return;
  const o = S.orders.find(x=>x.id===orderId); if(!o) return;
  if(o.status!=='ready') return;
  o.status = 'packed';
  o.packedAt = Date.now();
  o.packedBy = S.currentUser.name;
  savePartitionForItem('orders', o);
  render();
  showToast('Order marked Packed — ready to dispatch');
}
function undoMarkOrderPacked(orderId){
  if(S.currentUser.role!=='admin' && S.currentUser.role!=='manager') return;
  const o = S.orders.find(x=>x.id===orderId); if(!o) return;
  if(o.status!=='packed') return;
  o.status = 'ready';
  delete o.packedAt; delete o.packedBy;
  savePartitionForItem('orders', o);
  render();
  showToast('Undone — back to Ready');
}

function openDispatchModal(orderId){
  const o = S.orders.find(x=>x.id===orderId); if(!o) return;
  const cust = liveCustomerFor(o);
  const prefillTransport = (cust && cust.transport) || '';
  showModal(`
    <h3>Processed & Dispatched</h3>
    <p class="desc" style="margin-top:-6px;">Confirm transport details to complete this order.</p>
    <div class="field"><label>Transport Name</label>
      <input id="dispatchTransport" list="dispatchTransportList" value="${esc(prefillTransport)}" placeholder="e.g. XYZ Roadways" required />
      <datalist id="dispatchTransportList">${S.transports.map(t=>`<option value="${esc(t)}"></option>`).join('')}</datalist>
    </div>
    <div class="field"><label>Total No. of Cases</label><input id="dispatchCases" type="number" min="0" placeholder="e.g. 12" /></div>
    <div class="field"><label>LR Photo (optional)</label><input id="dispatchLRFile" type="file" accept="image/*" capture="environment" /></div>
    <div class="field"><label>LR Number (optional)</label><input id="dispatchLRNumber" placeholder="e.g. LR-4821" /></div>
    <div id="dispatchLRStatus" style="font-size:12px;color:var(--ink-soft);margin:-6px 0 4px;"></div>
    <div class="modal-actions" style="flex-wrap:wrap;">
      <button type="button" class="btn btn-outline" id="cancelModal">Cancel</button>
      <button type="button" class="btn" id="dispatchSubmitBtn" style="background:var(--warning);color:#fff;">Submit Without LR</button>
    </div>
  `);
  const lrFileInputEl = document.getElementById('dispatchLRFile');
  const submitBtnEl = document.getElementById('dispatchSubmitBtn');
  const refreshDispatchSubmitBtn = ()=>{
    const hasLR = lrFileInputEl.files && lrFileInputEl.files[0];
    submitBtnEl.textContent = hasLR ? 'Submit with LR' : 'Submit Without LR';
    submitBtnEl.style.background = hasLR ? 'var(--success)' : 'var(--warning)';
  };
  lrFileInputEl.addEventListener('change', refreshDispatchSubmitBtn);
  const finalizeDispatch = async (includeLR)=>{
    const transportName = document.getElementById('dispatchTransport').value.trim();
    if(!transportName){ showAlert('Enter a transport name.'); return; }
    const casesVal = document.getElementById('dispatchCases').value.trim();
    const lrFile = includeLR ? document.getElementById('dispatchLRFile').files[0] : null;
    const lrNumber = includeLR ? document.getElementById('dispatchLRNumber').value.trim() : '';
    const statusEl = document.getElementById('dispatchLRStatus');
    const bookedBtn = document.getElementById('dispatchSubmitBtn');
    if(lrFile){
      bookedBtn.disabled = true;
      statusEl.textContent = 'Uploading LR photo…';
      try{
        const dataUrl = await resizeImageFile(lrFile, 1600, 0.8);
        const base64Data = dataUrl.split(',')[1];
        const result = await apiUploadLR(base64Data, 'image/jpeg', `LR-${o.id}.jpg`);
        if(result && result.ok){
          o.lrPhotoUrl = result.url; o.lrFileId = result.fileId;
          o.lrUploadedAt = Date.now(); o.lrUploadedBy = S.currentUser.name;
        } else {
          statusEl.textContent = 'LR photo upload failed — dispatching without it.';
          await new Promise(r=>setTimeout(r, 900));
        }
      }catch(err){
        statusEl.textContent = 'LR photo upload failed — dispatching without it.';
        await new Promise(r=>setTimeout(r, 900));
      }
    }
    if(lrNumber) o.lrNumber = lrNumber;
    rememberTransport(transportName);
    o.transportName = transportName;
    o.totalCases = casesVal ? parseInt(casesVal) : null;
    o.dispatchedAt = Date.now();
    o.status = 'processed';
    o.processedAt = Date.now(); // tracking link expires 7 days after this
    savePartitionForItem('orders', o);
    closeModal(); render();
    showToast('Order Processed & Dispatched ✅');
  };
  document.getElementById('dispatchSubmitBtn').addEventListener('click', ()=>{
    const hasLR = lrFileInputEl.files && lrFileInputEl.files[0];
    finalizeDispatch(!!hasLR);
  });
}

function setOrderStatus(id, status){
  if((status==='processing' || status==='rejected') && S.currentUser.role!=='admin') return; // Accept/Reject are admin-only
  const o = S.orders.find(x=>x.id===id); if(!o) return;
  let shortItems = [];
  if(status==='processing' && !o.stockDeducted){
    // Stock is only reserved once the owner actually accepts the order —
    // until then it was just a live preview, nothing was touched.
    o.items.forEach(d=>{
      S.readyStock[d.key] = (S.readyStock[d.key]||0) - d.qty;
      if(S.readyStock[d.key] < 0) shortItems.push(`${d.name} ${d.size}`);
      logStockMovement(d.key, `${d.name} ${d.size}`, 'order', -d.qty, `Order accepted — ${orderDisplayLabel(o)}`);
    });
    o.stockDeducted = true;
    safeSet('app:readyStock', S.readyStock);
  }
  if(status==='rejected' && o.stockDeducted){
    o.items.forEach(d=>{
      if(!d.cancelled){
        S.readyStock[d.key] = (S.readyStock[d.key]||0) + d.qty;
        logStockMovement(d.key, `${d.name} ${d.size}`, 'order', d.qty, `Order rejected — ${orderDisplayLabel(o)}`);
      }
    });
    o.stockDeducted = false;
    safeSet('app:readyStock', S.readyStock);
  }
  o.status = status;
  if(status==='processed') o.processedAt = Date.now(); // tracking link expires 7 days after this
  if(status==='processing') autoAdvanceOrders(); // may instantly become 'ready' if stock already covers it
  savePartitionForItem('orders', o);
  syncStockTasksFromAlerts(); // accepting reserves stock and can create shortages — always resync after
  showToast(status==='processing'
    ? (shortItems.length ? `Order accepted — ⚠ short on ${shortItems.join(', ')}` : 'Order accepted — fully stocked')
    : status==='processed' ? 'Order marked processed' : `Order ${status}`);
}
function ackTask(id, kind){
  const o = S.orders.find(x=>x.id===id); if(!o) return;
  if(kind==='filling') o.fillingStatus='done'; else o.packagingStatus='done';
  savePartitionForItem('orders', o);
  autoAdvanceOrders();
  showToast('Task confirmed');
}

/* ============================= DAILY WORK (admin — for updating external accounting) ============================= */
function renderDailyWork(){
  const role = S.currentUser.role;
  const isAdmin = role==='admin';
  const isManager = role==='manager';
  // Anyone else who reaches this page (today that's the Packaging team)
  // only ever sees Filling + Packing -- the two categories that are their
  // shop floor's business -- never Purchase/Expenses/Retail/New Orders,
  // which stay admin/manager-only. They see EVERY filling/packing entry
  // for the day regardless of who logged it ("by anyone"), not just their own.
  const restrictedToProduction = !isAdmin && !isManager;
  const myUsername = S.currentUser.username;
  const date = S.dailyWorkDate || localDateKey(Date.now());
  const purchaseEntries = S.activityLog.filter(e=>e.kind==='purchase' && localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const fillingEntries = S.activityLog.filter(e=>e.kind==='filling' && localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const packagingEntries = S.activityLog.filter(e=>e.kind==='packaging' && localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const expenseEntries = S.expenses.filter(e=>localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const totalExpense = expenseEntries.filter(e=>e.type!=='settlement').reduce((s,e)=>s+(e.amount||0),0);
  const retailEntries = S.retailSales.filter(e=>localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const totalRetail = retailEntries.filter(e=>e.type==='sale').reduce((s,e)=>s+(e.totalAmount||0),0);
  const newOrderEntries = S.orders.filter(o=>localDateKey(o.createdAt)===date).sort((a,b)=>a.createdAt-b.createdAt);
  const totalOrderValue = newOrderEntries.reduce((s,o)=>s+orderMrpValue(o),0);

  const allEntries = restrictedToProduction
    ? [...fillingEntries, ...packagingEntries]
    : [...purchaseEntries, ...fillingEntries, ...packagingEntries, ...expenseEntries, ...retailEntries, ...newOrderEntries];
  const bookedCount = allEntries.filter(e=>e.booked).length;
  const totalCount = allEntries.length;

  // Backlog check: does any day BEFORE the one currently shown here still
  // have unbooked entries sitting around? Surfaced as a warning banner up
  // top so old, un-booked-into-accounting entries piling up get noticed
  // instead of only ever seeing whatever single day happens to be
  // selected. orders key their date off createdAt; everything else off at.
  // Scoped the same way as allEntries above -- Packaging shouldn't see (or
  // be alerted about) backlog in categories they can't view at all.
  const entryDateKey = e => localDateKey(e.createdAt!=null ? e.createdAt : e.at);
  const backlogSource = restrictedToProduction
    ? S.activityLog.filter(e=>e.kind==='filling'||e.kind==='packaging')
    : [...S.activityLog, ...S.expenses, ...S.retailSales, ...S.orders];
  const prevUnbookedDates = [...new Set(
    backlogSource.filter(e => !e.booked && entryDateKey(e) < date).map(entryDateKey)
  )].sort();

  // Action cell, role-aware:
  //  - Manager: view only -- no buttons at all, on anything.
  //  - Admin: unchanged -- Edit/Delete/Book any entry until booked, Undo
  //    once booked (booking is how "reflected in accounting software" gets
  //    tracked, so it's kept an admin-only action).
  //  - Everyone else (e.g. Packaging team): only THEIR OWN, still-unbooked
  //    entry gets Edit/Delete -- no Book/Undo. Someone else's entry, or
  //    their own once it's been booked, shows no action buttons at all.
  const actionCell = (e, source, canDelete) => {
    if(isManager) return '';
    if(isAdmin){
      return e.booked
        ? `<button type="button" class="btn btn-sm btn-outline" data-book="${source}|${e.id}">↩ Undo</button>`
        : `<div class="row-actions" style="flex-wrap:wrap;gap:4px;">
            <button type="button" class="btn btn-sm btn-outline" data-edit-entry="${source}|${e.id}">Edit</button>
            ${canDelete?`<button type="button" class="btn btn-sm btn-danger" data-del-entry="${source}|${e.id}">Delete</button>`:''}
            <button type="button" class="btn btn-sm btn-accent" data-book="${source}|${e.id}">✅ Book</button>
          </div>`;
    }
    if(e.byUsername===myUsername && !e.booked){
      return `<div class="row-actions" style="flex-wrap:wrap;gap:4px;">
          <button type="button" class="btn btn-sm btn-outline" data-edit-entry="${source}|${e.id}">Edit</button>
          ${canDelete?`<button type="button" class="btn btn-sm btn-danger" data-del-entry="${source}|${e.id}">Delete</button>`:''}
        </div>`;
    }
    return e.booked ? `<span class="mono" style="font-size:11px;opacity:0.7;">✅ Booked</span>` : '';
  };

  const purchaseHtml = `<div class="card">
    <h2>🛢️ Purchase — ${purchaseEntries.length} entr${purchaseEntries.length===1?'y':'ies'}</h2>
    ${purchaseEntries.length===0?`<div class="empty">No purchases recorded this day.</div>`:`
    <table><thead><tr><th>Category</th><th>Qty</th><th>By</th><th>Time</th><th></th></tr></thead><tbody>
    ${purchaseEntries.map(e=>`<tr${e.booked?' style="opacity:0.55;"':''}><td>${esc(e.cat)}</td><td class="mono">${fmtMl(e.ml)}</td><td>${esc(e.by)}</td><td class="mono">${fmtTime(e.at)}</td><td>${actionCell(e,'activityLog',true)}</td></tr>`).join('')}
    </tbody></table>`}
  </div>`;

  const fillingHtml = `<div class="card">
    <h2>🧴 Filling — ${fillingEntries.length} entr${fillingEntries.length===1?'y':'ies'}</h2>
    ${fillingEntries.length===0?`<div class="empty">No filling recorded this day.</div>`:`
    <table><thead><tr><th>Item</th><th>Qty</th><th>By</th><th>Time</th><th></th></tr></thead><tbody>
    ${fillingEntries.map(e=>{
      const it = findItem(e.key);
      const qtyDisplay = it && it.caseSize ? fmtCase(e.qty, it.caseSize) : `${e.qty} pc`;
      return `<tr${e.booked?' style="opacity:0.55;"':''}><td>${esc(e.itemLabel)}</td><td class="mono">${qtyDisplay}</td><td>${esc(e.by)}</td><td class="mono">${fmtTime(e.at)}</td><td>${actionCell(e,'activityLog',true)}</td></tr>`;
    }).join('')}
    </tbody></table>`}
  </div>`;

  const packagingHtml = `<div class="card">
    <h2>📦 Packing — ${packagingEntries.length} entr${packagingEntries.length===1?'y':'ies'}</h2>
    ${packagingEntries.length===0?`<div class="empty">No packing recorded this day.</div>`:`
    <table><thead><tr><th>Item</th><th>Qty</th><th>By</th><th>Time</th><th></th></tr></thead><tbody>
    ${packagingEntries.map(e=>{
      const it = findItem(e.key);
      const qtyDisplay = it && it.caseSize ? fmtCase(e.qty, it.caseSize) : `${e.qty} pc`;
      // "Updated Qty" = Ready stock total for this item right after this
      // packing entry was recorded (captured on e.totalAfter at write-time
      // -- see the packaging-record submit handler and applyActivityForward
      // -- so it stays historically accurate even if today's live Ready
      // stock has since moved). Older entries recorded before this field
      // existed simply won't have it, so nothing extra renders for them.
      const totalDisplay = e.totalAfter!=null ? (it && it.caseSize ? fmtCase(e.totalAfter, it.caseSize) : `${e.totalAfter} pc`) : null;
      return `<tr${e.booked?' style="opacity:0.55;"':''}><td>${esc(e.itemLabel)}${e.note?` <span class="mono">(Batch no- ${esc(e.note)})</span>`:''}${totalDisplay?`<div class="mono" style="margin-top:2px;">Updated Qty: ${totalDisplay}</div>`:''}</td><td class="mono">${qtyDisplay}</td><td>${esc(e.by)}</td><td class="mono">${fmtTime(e.at)}</td><td>${actionCell(e,'activityLog',true)}</td></tr>`;
    }).join('')}
    </tbody></table>`}
  </div>`;

  const expensesHtml = `<div class="card">
    <h2>💰 Expenses — ${expenseEntries.length} entr${expenseEntries.length===1?'y':'ies'}${totalExpense?` · ₹${totalExpense.toLocaleString('en-IN')}`:''}</h2>
    ${expenseEntries.length===0?`<div class="empty">No expenses recorded this day.</div>`:`
    <table><thead><tr><th>To</th><th>Description</th><th>Amount</th><th>Entered by</th><th>Time</th><th></th></tr></thead><tbody>
    ${expenseEntries.map(e=>`<tr${e.booked?' style="opacity:0.55;"':''}><td><b>${esc(e.byName)}</b></td><td>${esc(e.description||e.category||'—')}</td><td class="mono">${e.type==='settlement'?'− ':''}₹${(e.amount||0).toLocaleString('en-IN')}</td><td>${esc(e.enteredByName||e.byName)}</td><td class="mono">${fmtTime(e.at)}</td><td>${actionCell(e,'expenses',true)}</td></tr>`).join('')}
    </tbody></table>`}
  </div>`;

  const retailHtml = `<div class="card">
    <h2>💵 Retail Sale &amp; Samples — ${retailEntries.length} entr${retailEntries.length===1?'y':'ies'}${totalRetail?` · ₹${totalRetail.toLocaleString('en-IN')}`:''}</h2>
    ${retailEntries.length===0?`<div class="empty">No retail sales or samples this day.</div>`:`
    <table><thead><tr><th>Items</th><th>Type</th><th>Total</th><th>By</th><th>Time</th><th></th></tr></thead><tbody>
    ${retailEntries.map(e=>`<tr${e.booked?' style="opacity:0.55;"':''}><td>${(e.items||[]).map(i=>`${esc(i.itemLabel)} <span class="mono">×${i.qty}</span>`).join('<br/>')}</td><td>${e.type==='sale'?'<span class="badge badge-approved">Sale</span>':'<span class="badge badge-pending">Sample</span>'}</td><td class="mono">${e.type==='sale'?'₹'+(e.totalAmount||0).toLocaleString('en-IN'):'—'}</td><td>${esc(e.by)}</td><td class="mono">${fmtTime(e.at)}</td><td>${actionCell(e,'retailSales',true)}</td></tr>`).join('')}
    </tbody></table>`}
  </div>`;

  const newOrdersHtml = `<div class="card">
    <h2>🛍️ New Orders — ${newOrderEntries.length} entr${newOrderEntries.length===1?'y':'ies'}${totalOrderValue?` · ₹${totalOrderValue.toLocaleString('en-IN')}`:''}</h2>
    <p class="desc" style="margin-top:-6px;">Delete an order from Home/Orders' Accept · Reject · Delete flow, not from here.</p>
    ${newOrderEntries.length===0?`<div class="empty">No orders created this day.</div>`:`
    <table><thead><tr><th>Party</th><th>Items</th><th>MRP Value</th><th>By</th><th>Time</th><th></th></tr></thead><tbody>
    ${newOrderEntries.map(o=>{ const liveCust = liveCustomerFor(o); const disc = liveCust ? (liveCust.discountPercent||0) : 0; return `<tr${o.booked?' style="opacity:0.55;"':''}><td>${esc(orderDisplayLabel(o))}</td><td>${o.items.filter(i=>!i.cancelled).map(i=>`${esc(i.name)} ${esc(i.size)} <span class="mono">×${i.qty}</span>`).join('<br/>')}</td><td class="mono">₹${orderMrpValue(o).toLocaleString('en-IN')}${disc>0?` (${disc}% off)`:''}</td><td>${esc(o.createdBy)}</td><td class="mono">${fmtTime(o.createdAt)}</td><td>${actionCell(o,'orders',false)}</td></tr>`; }).join('')}
    </tbody></table>`}
  </div>`;

  // Sections with entries surface first; empty (0-entry) sections sink to
  // the bottom, so the day's actual activity isn't buried below a wall of
  // "No X recorded this day" placeholders. Packaging team only ever gets
  // the Filling + Packing cards -- see restrictedToProduction above.
  const sections = restrictedToProduction
    ? [
        { count: fillingEntries.length, html: fillingHtml },
        { count: packagingEntries.length, html: packagingHtml },
      ]
    : [
        { count: purchaseEntries.length, html: purchaseHtml },
        { count: fillingEntries.length, html: fillingHtml },
        { count: packagingEntries.length, html: packagingHtml },
        { count: expenseEntries.length, html: expensesHtml },
        { count: retailEntries.length, html: retailHtml },
        { count: newOrderEntries.length, html: newOrdersHtml },
      ];
  sections.sort((a,b)=> (b.count>0?1:0) - (a.count>0?1:0));

  return `
  <div class="card">
    <h2>📆 Daily Work</h2>
    <p class="desc">${restrictedToProduction
      ? 'Filling &amp; Packing entries for the day, from everyone on the team. You can edit or delete your own entry until it\'s booked — once booked, it\'s locked.'
      : 'Every entry for the day, in one place — book each as you update your accounting software.'+(isManager?' View only.':' Editing or deleting stays available until it\'s booked.')}</p>
    <div class="field"><label>Date</label><input type="date" id="dwDateSel" value="${date}" max="${localDateKey(Date.now())}" /></div>
    ${prevUnbookedDates.length ? `<div style="background:#FCE2DF;border:1.5px solid #E8938B;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:12.5px;">
      <div style="font-weight:800;color:#D8483B;margin-bottom:6px;">⚠️ Previous Entry Not Booked${prevUnbookedDates.length>1?` (${prevUnbookedDates.length} days)`:''}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${prevUnbookedDates.map(d=>`<button type="button" class="btn btn-sm btn-outline" style="border-color:#E8938B;color:#D8483B;" data-goto-dw-date="${d}">${fmtDateOnly(dateKeyToTs(d))}</button>`).join('')}
      </div>
    </div>` : ''}
    <button type="button" class="btn btn-outline" id="dwPrintBtn" style="width:100%;margin-bottom:6px;">🖨️ Print this day</button>
    ${totalCount>0 ? `<div style="background:${bookedCount===totalCount?'var(--success-bg)':'var(--bg)'};border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:12.5px;font-weight:700;">${bookedCount===totalCount?'✅':'📋'} ${bookedCount} of ${totalCount} entries booked</div>` : ''}
    ${(isAdmin && totalCount>0 && bookedCount<totalCount) ? `<button type="button" class="btn btn-outline" id="dwBookAllBtn" style="width:100%;">✅ Book all remaining (${totalCount-bookedCount})</button>` : ''}
  </div>
  ${sections.map(s=>s.html).join('')}`;
}
// Shared "can THIS user touch THIS Daily Work entry" check, re-verified
// here (not just at button-render time) so a stale button or a direct call
// can never bypass it. Booked always locks an entry, even for admin (an
// admin must Undo it first, same as what the action buttons already show);
// everyone else may only touch their OWN, still-unbooked entry.
function canEditDailyEntry(e){
  if(!e || e.booked) return false;
  if(S.currentUser.role==='admin') return true;
  return e.byUsername===S.currentUser.username;
}
function editDailyEntry(source, id){
  let e;
  if(source==='activityLog') e = S.activityLog.find(x=>x.id===id);
  else if(source==='expenses') e = S.expenses.find(x=>x.id===id);
  else if(source==='retailSales') e = S.retailSales.find(x=>x.id===id);
  else if(source==='orders') e = S.orders.find(x=>x.id===id);
  if(!canEditDailyEntry(e)){ showAlert('This entry can no longer be edited.'); render(); return; }
  if(source==='activityLog') openEditLogModal(e, {allowUntilBooked:true});
  else if(source==='expenses') openExpenseModal(e, e.type||'expense', e.byUsername);
  else if(source==='retailSales') editRetailEntry(id);
  else if(source==='orders') openOrderModal(e);
}
function deleteDailyEntry(source, id){
  let e;
  if(source==='activityLog') e = S.activityLog.find(x=>x.id===id);
  else if(source==='expenses') e = S.expenses.find(x=>x.id===id);
  else if(source==='retailSales') e = S.retailSales.find(x=>x.id===id);
  if(!canEditDailyEntry(e)){ showAlert('This entry can no longer be edited.'); render(); return; }
  if(source==='activityLog'){
    showConfirm('Delete this entry? Its stock effect will be reversed.', ()=>{
      revertActivity(e, 'delete');
      S.activityLog = S.activityLog.filter(x=>x.id!==id);
      saveAfterActivityChange(e);
      render(); showToast('Entry deleted & stock reverted');
    });
  } else if(source==='expenses'){
    showConfirm('Delete this entry?', ()=>{
      S.expenses = S.expenses.filter(x=>x.id!==id);
      savePartitionForItem('expenses', e);
      applyExpenseBalanceDelta(e, -1);
      render();
    });
  } else if(source==='retailSales'){
    deleteRetailEntry(id);
  }
  // orders are intentionally NOT deletable from here -- see actionCell's canDelete=false above
}
function toggleEntryBooked(source, id){
  // Booking/unbooking marks an entry as reflected in the external
  // accounting software -- that's an admin-only accounting action, not
  // something any team member recording their own work should do.
  if(S.currentUser.role!=='admin') return;
  const list = source==='expenses' ? S.expenses : source==='retailSales' ? S.retailSales : source==='orders' ? S.orders : S.activityLog;
  const e = list.find(x=>x.id===id); if(!e) return;
  e.booked = !e.booked;
  savePartitionForItem(source, e);
  render();
  showToast(e.booked ? 'Booked ✅' : 'Unbooked');
}
function printDailyWork(){
  // Mirrors renderDailyWork's own visibility rule -- Packaging team only
  // ever prints Filling + Packing, never Purchase/Expenses/Retail/Orders.
  const restrictedToProduction = S.currentUser.role!=='admin' && S.currentUser.role!=='manager';
  const date = S.dailyWorkDate || localDateKey(Date.now());
  const purchaseEntries = S.activityLog.filter(e=>e.kind==='purchase' && localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const fillingEntries = S.activityLog.filter(e=>e.kind==='filling' && localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const packagingEntries = S.activityLog.filter(e=>e.kind==='packaging' && localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const expenseEntries = S.expenses.filter(e=>localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const totalExpense = expenseEntries.filter(e=>e.type!=='settlement').reduce((s,e)=>s+(e.amount||0),0);
  const retailEntries = S.retailSales.filter(e=>localDateKey(e.at)===date).sort((a,b)=>a.at-b.at);
  const totalRetail = retailEntries.filter(e=>e.type==='sale').reduce((s,e)=>s+(e.totalAmount||0),0);
  const newOrderEntries = S.orders.filter(o=>localDateKey(o.createdAt)===date).sort((a,b)=>a.createdAt-b.createdAt);
  const totalOrderValue = newOrderEntries.reduce((s,o)=>s+orderMrpValue(o),0);

  const table = (headers, rows) => rows.length===0 ? `<p style="font-size:11px;color:#777;">None</p>` :
    `<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;

  let html = `<h1>${esc(COMPANY_NAME)}</h1><div style="font-size:11px;color:#555;margin-bottom:10px;">Daily Work — ${esc(fmtDateOnly(dateKeyToTs(date)))}</div>`;

  if(!restrictedToProduction){
    html += `<h2>🛢️ Purchase</h2>` + table(['Category','Qty','By','Time'],
      purchaseEntries.map(e=>`<tr><td>${esc(e.cat)}</td><td>${fmtMl(e.ml)}</td><td>${esc(e.by)}</td><td>${fmtTime(e.at)}</td></tr>`).join(''));
  }

  html += `<h2>🧴 Filling</h2>` + table(['Item','Qty','By','Time'],
    fillingEntries.map(e=>`<tr><td>${esc(e.itemLabel)}</td><td>${e.qty} pc</td><td>${esc(e.by)}</td><td>${fmtTime(e.at)}</td></tr>`).join(''));

  html += `<h2>📦 Packing</h2>` + table(['Item','Qty','By','Time'],
    packagingEntries.map(e=>`<tr><td>${esc(e.itemLabel)}${e.note?` (Batch no- ${esc(e.note)})`:''}</td><td>${e.qty} pc</td><td>${esc(e.by)}</td><td>${fmtTime(e.at)}</td></tr>`).join(''));

  if(!restrictedToProduction){
    html += `<h2>💰 Expenses ${totalExpense?`— Total ₹${totalExpense.toLocaleString('en-IN')}`:''}</h2>` + table(['To','Description','Amount','Time'],
      expenseEntries.map(e=>`<tr><td>${esc(e.byName)}</td><td>${esc(e.description||e.category||'—')}</td><td>${e.type==='settlement'?'− ':''}₹${(e.amount||0).toLocaleString('en-IN')}</td><td>${fmtTime(e.at)}</td></tr>`).join(''));

    html += `<h2>💵 Retail Sale &amp; Samples ${totalRetail?`— Total ₹${totalRetail.toLocaleString('en-IN')}`:''}</h2>` + table(['Items','Type','Total','Time'],
      retailEntries.map(e=>`<tr><td>${(e.items||[]).map(i=>`${esc(i.itemLabel)} ×${i.qty}`).join(', ')}</td><td>${e.type==='sale'?'Sale':'Sample'}</td><td>${e.type==='sale'?'₹'+(e.totalAmount||0).toLocaleString('en-IN'):'—'}</td><td>${fmtTime(e.at)}</td></tr>`).join(''));

    html += `<h2>🛍️ New Orders ${totalOrderValue?`— Total ₹${totalOrderValue.toLocaleString('en-IN')}`:''}</h2>` + table(['Party','Items','MRP Value','By','Time'],
      newOrderEntries.map(o=>`<tr><td>${esc(orderDisplayLabel(o))}</td><td>${o.items.filter(i=>!i.cancelled).map(i=>`${esc(i.name)} ${esc(i.size)} ×${i.qty}`).join(', ')}</td><td>₹${orderMrpValue(o).toLocaleString('en-IN')}</td><td>${esc(o.createdBy)}</td><td>${fmtTime(o.createdAt)}</td></tr>`).join(''));
  }

  const printArea = document.getElementById('printArea');
  printArea.innerHTML = html;
  window.print();
}
function bindDailyWork(){
  const printBtn = document.getElementById('dwPrintBtn');
  if(printBtn) printBtn.addEventListener('click', printDailyWork);
  const dateSel = document.getElementById('dwDateSel');
  if(dateSel) dateSel.addEventListener('change', ()=>{ S.dailyWorkDate = dateSel.value; render(); });
  document.querySelectorAll('[data-goto-dw-date]').forEach(b=>b.addEventListener('click', ()=>{
    S.dailyWorkDate = b.dataset.gotoDwDate; render();
  }));
  document.querySelectorAll('[data-book]').forEach(b=>b.addEventListener('click', ()=>{
    const [source, id] = b.dataset.book.split('|');
    toggleEntryBooked(source, id);
  }));
  document.querySelectorAll('[data-edit-entry]').forEach(b=>b.addEventListener('click', ()=>{
    const [source, id] = b.dataset.editEntry.split('|');
    editDailyEntry(source, id);
  }));
  document.querySelectorAll('[data-del-entry]').forEach(b=>b.addEventListener('click', ()=>{
    const [source, id] = b.dataset.delEntry.split('|');
    deleteDailyEntry(source, id);
  }));
  const bookAllBtn = document.getElementById('dwBookAllBtn');
  if(bookAllBtn) bookAllBtn.addEventListener('click', ()=>{
    if(S.currentUser.role!=='admin') return; // booking is an admin-only accounting action -- see toggleEntryBooked
    const date = S.dailyWorkDate || localDateKey(Date.now());
    S.activityLog.filter(e=>(e.kind==='purchase'||e.kind==='filling'||e.kind==='packaging') && localDateKey(e.at)===date && !e.booked).forEach(e=>{ e.booked = true; savePartitionForItem('activityLog', e); });
    S.expenses.filter(e=>localDateKey(e.at)===date && !e.booked).forEach(e=>{ e.booked = true; savePartitionForItem('expenses', e); });
    S.retailSales.filter(e=>localDateKey(e.at)===date && !e.booked).forEach(e=>{ e.booked = true; savePartitionForItem('retailSales', e); });
    S.orders.filter(o=>localDateKey(o.createdAt)===date && !o.booked).forEach(o=>{ o.booked = true; savePartitionForItem('orders', o); });
    render();
    showToast('All entries booked ✅');
  });
}

/* ============================= DOMINO PRINTING (impressions log) ============================= */
function parseHHMM(s){
  const m = String(s||'').match(/^(\d{1,3}):([0-5]?\d)$/);
  if(!m) return 0;
  return parseInt(m[1])*60 + parseInt(m[2]);
}
function fmtHHMM(mins){
  mins = Math.max(0, Math.round(mins));
  const h = Math.floor(mins/60), m = mins%60;
  return `${h}:${String(m).padStart(2,'0')}`;
}
function renderDomino(){
  const isAdmin = S.currentUser.role==='admin';
  const total = S.dominoPrints.reduce((s,x)=>s+x.impressions,0);
  const totalMin = S.dominoPrints.reduce((s,x)=>s+(x.durationMin||0),0);
  const list = S.dominoPrints.slice().sort((a,b)=>b.at-a.at);
  const sections = groupByDate(list, x=>x.at);
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <div><h2>Domino Printing</h2><p class="desc">Impressions log.</p></div>
      <button class="btn btn-primary btn-sm" id="newDominoBtn">+ Record impressions</button>
    </div>
    <div class="grid-stats" style="margin-bottom:12px;">
      <div class="stat"><div class="n">${total.toLocaleString('en-IN')}</div><div class="l">Total impressions</div></div>
      <div class="stat"><div class="n">${fmtHHMM(totalMin)}</div><div class="l">Total duration (HH:MM)</div></div>
    </div>
    ${list.length===0?`<div class="empty"><div class="big">🖨️</div>No entries yet.</div>`:
      sections.map(s=>dateGroupHeaderHtml(s.heading)+`<table><thead><tr><th>Impressions</th><th>Duration</th><th>Note</th><th>By</th><th>Time</th>${isAdmin?'<th></th>':''}</tr></thead><tbody>
      ${s.items.map(x=>`<tr><td class="mono"><b>${x.impressions.toLocaleString('en-IN')}</b></td><td class="mono">${fmtHHMM(x.durationMin||0)}</td><td>${esc(x.note||'—')}</td><td class="mono">${esc(x.by)}</td><td class="mono">${fmtTime(x.at)}</td>${isAdmin?`<td><button class="btn btn-sm btn-danger" data-del-domino="${x.id}">Delete</button></td>`:''}</tr>`).join('')}
      </tbody></table>`).join('')}
  </div>`;
}
function bindDomino(){
  const btn = document.getElementById('newDominoBtn');
  if(btn) btn.addEventListener('click', openDominoModal);
  document.querySelectorAll('[data-del-domino]').forEach(b=>b.addEventListener('click', ()=>{
    showConfirm('Delete this entry?', ()=>{
      const item = S.dominoPrints.find(x=>x.id===b.dataset.delDomino);
      S.dominoPrints = S.dominoPrints.filter(x=>x.id!==b.dataset.delDomino);
      if(item) savePartitionForItem('dominoPrints', item);
      render();
    });
  }));
}
function openDominoModal(){
  showModal(`
    <h3>Record Domino Printing</h3>
    <form id="dominoForm">
      <div class="field"><label>No. of impressions</label><input id="domImpr" type="number" min="1" required /></div>
      <div class="field"><label>Duration</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="domDurH" type="number" min="0" max="999" placeholder="0" style="flex:1;" /> <span class="mono">hr</span>
          <input id="domDurM" type="number" min="0" max="59" placeholder="0" style="flex:1;" /> <span class="mono">min</span>
        </div>
      </div>
      <div class="field"><label>Note (optional)</label><input id="domNote" placeholder="Batch / item this was for" /></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelModal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  `);
  document.getElementById('dominoForm').addEventListener('submit', withSubmitGuard((e)=>{
    e.preventDefault();
    const impressions = parseInt(document.getElementById('domImpr').value)||0;
    if(impressions<=0){ showAlert('Enter a valid number.'); return; }
    let hrs = parseInt(document.getElementById('domDurH').value)||0;
    let mins = parseInt(document.getElementById('domDurM').value)||0;
    if(mins>59){ showAlert('Minutes must be 0–59.'); return; }
    const durationMin = hrs*60 + mins;
    const entry = {id:uid(), impressions, durationMin, note:document.getElementById('domNote').value.trim(), by:S.currentUser.name, byUsername:S.currentUser.username, at:Date.now()};
    S.dominoPrints.push(entry);
    savePartitionForItem('dominoPrints', entry);
    closeModal(); render(); showToast('Recorded');
  }));
}

/* ============================= UNIFIED STOCK (dropdown: raw / filled / ready) ============================= */
function renderStock(){
  const isAdmin = S.currentUser.role==='admin';
  const role = S.currentUser.role;
  const allowedSubs = ['raw','filled','ready'].filter(s=>canViewStockSub(role,s));
  if(allowedSubs.length===0){
    return `<div class="card"><div class="empty">You don't have access to any stock view. Ask the admin to grant it in Permission Manager.</div></div>`;
  }
  if(!allowedSubs.includes(S.stockView)) S.stockView = allowedSubs[0];
  const sub = S.stockView;
  const inner = sub==='raw' ? renderRawMaterial() : sub==='filled' ? renderFilled() : renderReady();
  const subOptionHtml = {
    raw: `<option value="raw" ${sub==='raw'?'selected':''}>🛢️ Raw material (bulk oil)</option>`,
    filled: `<option value="filled" ${sub==='filled'?'selected':''}>🧴 Filled stock (bottled)</option>`,
    ready: `<option value="ready" ${sub==='ready'?'selected':''}>📦 Ready stock (packed)</option>`,
  };
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;">
      <label style="display:block;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;">View stock</label>
      ${isAdmin?`<button class="btn btn-outline btn-sm" id="manageCatalogBtn" style="flex:0 0 auto;">🗂️ Manage catalog</button>`:''}
    </div>
    <select id="stockViewSel" style="width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:11px;font-size:14px;background:#FBFBFD;" ${allowedSubs.length===1?'disabled':''}>
      ${allowedSubs.map(s=>subOptionHtml[s]).join('')}
    </select>

  showModal(`

      <div class="field"><label>MRP (₹)</label><input id="ciMrp" type="number" min="0" step="0.01" required value="${existingItem?existingItem.mrp:''}" /></div>
      <div class="field"><label>Display category</label>

      ${existingItem?`<p class="desc">Changing name or size moves this item's current filled/ready stock and low-stock alerts across automatically — nothing is lost.</p>`:''}
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelModal">Cancel</button>
        <button type="submit" class="btn btn-primary">${existingItem?'Save changes':'Add item'}</button>
      </div>
    </form>
  `);
  document.getElementById('addItemForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const name = document.getElementById('ciName').value.trim();
    const size = document.getElementById('ciSize').value.trim();
    const mrp = parseFloat(document.getElementById('ciMrp').value)||0;
    const cat = document.getElementById('ciCat').value.trim();
    const rawCat = document.getElementById('ciRawCat').value.trim();
    const caseVal = document.getElementById('ciCase').value.trim();
    if(!name || !size || !cat || !rawCat){ showAlert('Fill in all required fields.'); return; }
    const newKey = itemKey(name, size);
    // Always persist a RESOLVED case size (falling back to the standard
    // table here if left blank) — so the backend is the single source of
    // truth and order-form.html never has to independently guess/compute
    // this itself. That's what keeps the two apps byte-for-byte in sync.
    const resolvedCaseSize = caseVal ? parseInt(caseVal) : getCaseSize(name, size);

    if(existingItem){
      const oldKey = existingItem.key;
      if(newKey!==oldKey && S.catalogItems.some(it=>it.key===newKey)){ showAlert('Another item already has this exact name + size.'); return; }
      const entry = S.catalogItems.find(it=>it.key===oldKey);
      entry.name = name; entry.size = size; entry.mrp = mrp; entry.cat = cat; entry.rawCat = rawCat;
      entry.caseSize = resolvedCaseSize;
      entry.key = newKey;
      if(newKey!==oldKey){
        // Move any current filled/ready stock, low-stock alerts, and open
        // stock-tasks across to the new key so nothing is orphaned.
        S.filledStock[newKey] = (S.filledStock[newKey]||0) + (S.filledStock[oldKey]||0);
        delete S.filledStock[oldKey];
        S.readyStock[newKey] = (S.readyStock[newKey]||0) + (S.readyStock[oldKey]||0);
        delete S.readyStock[oldKey];
        if(S.lowStock.filled[oldKey]!=null && S.lowStock.filled[newKey]==null){ S.lowStock.filled[newKey]=S.lowStock.filled[oldKey]; }
        delete S.lowStock.filled[oldKey];
        if(S.lowStock.ready[oldKey]!=null && S.lowStock.ready[newKey]==null){ S.lowStock.ready[newKey]=S.lowStock.ready[oldKey]; }
        delete S.lowStock.ready[oldKey];
        S.stockTasks.forEach(t=>{ if(t.itemId===oldKey && (t.kind==='filled'||t.kind==='ready')) t.itemId = newKey; });
        safeSet('app:filledStock', S.filledStock);
        safeSet('app:readyStock', S.readyStock);
        safeSet('app:lowStock', S.lowStock);
        safeSet('app:stockTasks', S.stockTasks);
      }
      rebuildCatalogFlat();
      safeSet('app:catalogItems', S.catalogItems);
      closeModal(); render(); showToast('Item updated');
    } else {
      if(S.catalogItems.some(it=>it.key===newKey)){ showAlert('An item with this exact name + size already exists.'); return; }
      S.catalogItems.push({ key:newKey, name, size, mrp, cat, rawCat, caseSize: resolvedCaseSize });
      rebuildCatalogFlat();
      safeSet('app:catalogItems', S.catalogItems);
      closeModal(); render(); showToast('Item added — visible everywhere now');
    }
  });
}

/* ============================= EXPENSES (manager pocket expenses; admin settles & can add/edit) ============================= */
// BUGFIX (2026-08-21, explicit user request): this used to recompute the
// balance live by summing S.expenses every time -- which meant the balance
// would silently drift once the 1-year retention cleanup deleted an old
// unsettled expense/settlement row, even though nothing was actually paid.
// Now it's a durable running total (S.expenseBalances[username]), kept in
// sync incrementally on every create/edit/delete via
// applyExpenseBalanceDelta, exactly like rawMaterial/filledStock/readyStock
// already are for stock. The live-sum path below only ever runs ONCE per
// user, the very first time this code sees them with no durable balance
// recorded yet -- it seeds S.expenseBalances from whatever expense history
// currently exists (self-healing migration), then every call after that
// reads the durable number straight away.
function expenseBalanceFor(username){
  if(Object.prototype.hasOwnProperty.call(S.expenseBalances, username)){
    return S.expenseBalances[username];
  }
  const mine = S.expenses.filter(x=>x.byUsername===username);
  const spent = mine.filter(x=>x.type!=='settlement').reduce((s,x)=>s+x.amount,0);
  const settled = mine.filter(x=>x.type==='settlement').reduce((s,x)=>s+x.amount,0);
  const seed = spent - settled; // positive = still owed to the manager
  S.expenseBalances[username] = seed;
  safeSet('app:expenseBalances', S.expenseBalances);
  return seed;
}
// Applies (sign=+1) or reverses (sign=-1) one expense/settlement entry's
// effect on its owner's durable balance. An expense INCREASES what's owed
// to them; a settlement (cash paid back) DECREASES it. Call with sign=-1
// on an entry's OLD state before an edit changes it, then sign=+1 with the
// NEW state -- this correctly handles an admin re-assigning an entry to a
// different manager or changing its amount mid-edit.
function applyExpenseBalanceDelta(entry, sign){
  if(!entry || !entry.byUsername) return;
  const delta = (entry.type==='settlement' ? -entry.amount : entry.amount) || 0;
  const finalDelta = sign*delta;
  // Optimistic local update — the UI (e.g. the balance shown at the top of
  // My Expenses) reflects the change instantly, same local-first pattern
  // as everywhere else in this app.
  S.expenseBalances[entry.byUsername] = (S.expenseBalances[entry.byUsername]||0) + finalDelta;
  // SECURITY FIX (2026-08-21 audit, finding #12): the value actually
  // PERSISTED is now applied atomically server-side against whatever is
  // currently stored there, not this whole local S.expenseBalances object
  // pushed via safeSet/"save" — see apiApplyExpenseBalanceDelta's own
  // comment. Reconciles the local value with the server's authoritative
  // post-delta total afterward, in case a concurrent delta from another
  // device landed in between.
  apiApplyExpenseBalanceDelta(entry.byUsername, finalDelta).then(res=>{
    if(res && res.ok && typeof res.balance==='number'){
      S.expenseBalances[entry.byUsername] = res.balance;
    }
  }).catch(()=>{ /* best-effort reconcile -- the optimistic local value stands until the next successful call corrects it */ });
}
