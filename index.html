<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3F1B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OMS">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>OMS - M A PRODUCTS INDIA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F1F7F3;
    --surface:#FFFFFF;
    --ink:#122019;
    --ink-soft:#546358;
    --primary:#1E6B44;
    --primary-dark:#124A2E;
    --accent:#F2A93B;
    --accent-ink:#5A3B06;
    --gold:#C9A227;
    --gold-dark:#9C7C17;
    --success:#2E9E6B;
    --success-bg:#E6F5EE;
    --danger:#D8483B;
    --danger-bg:#FBEAE8;
    --warning:#9A6B0B;
    --warning-bg:#FEF2DC;
    --info:#2E5FA3;
    --info-bg:#E6EEFA;
    --border:#DCE8DF;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --frame-w:412px;
    --frame-h:732px;
    --topbar-h:56px;
    --navbar-h:64px;
    --sat:env(safe-area-inset-top,0px);
    --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
  body{
    background:#DADEE8;
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Phone frame (desktop preview) ---------- */
  .device-wrap{
    min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 20% 10%, rgba(242,169,59,0.10), transparent 45%),
      linear-gradient(160deg,#151b2e,#232b45 60%,#151b2e);
    padding:28px;
  }
  .device{
    position:relative;width:var(--frame-w);height:var(--frame-h);
    background:#000;border-radius:44px;padding:12px;
    box-shadow:0 30px 80px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,255,255,0.06) inset;
  }
  .device::before{
    content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:120px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:50;
  }
  .device-screen{
    position:relative;width:100%;height:100%;
    background:linear-gradient(180deg, #DCEFE1 0%, var(--bg) 32%, var(--bg) 100%);
    border-radius:32px;overflow:hidden;
    display:flex;flex-direction:column;
  }
  #root{height:100%;display:flex;flex-direction:column;position:relative;}
  @media (max-width:520px), (max-height:760px){
    .device-wrap{padding:0;background:var(--bg);}
    .device{width:100vw;width:100dvw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;}
    .device::before{display:none;}
    .device-screen{border-radius:0;}
  }


  /* ---------- Rich home page: icon badges, overview strip, stat cards v2, quick actions, promo banner ---------- */
  .icon-badge{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;}
  .icon-badge.round{border-radius:50%;}
  .icon-badge.green{background:#DDF0E4;}
  .icon-badge.orange{background:#FDEACB;}
  .icon-badge.blue{background:#DCEAFB;}
  .icon-badge.purple{background:#EBE1FA;}
  .icon-badge.red{background:#FBE0DD;}

  /* Tinted mint-gradient panel — used for Today Overview & Quick Actions cards */
  .card-tinted{background:linear-gradient(160deg, #EAF7EE 0%, #CFEAD9 100%);border-color:transparent;}

  .overview-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .overview-head h2{margin:0;}
  .overview-head .odate{font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);}
  .overview-strip{display:flex;justify-content:space-between;gap:4px;}
  .overview-col{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;}
  .overview-col .icon-badge{
    width:42px;height:42px;font-size:18px;
    background:linear-gradient(145deg, var(--primary), var(--primary-dark));
    border:2px solid var(--gold);box-shadow:0 3px 8px -3px rgba(18,74,46,0.5);
  }
  .overview-col .n{font-family:var(--font-mono);font-size:18px;font-weight:800;color:var(--primary-dark);}
  .overview-col .l{font-size:11.5px;color:var(--ink-soft);text-align:center;line-height:1.25;}

  .stat-grid-v2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .stat-card-v2{border:none;border-radius:16px;padding:14px;cursor:pointer;box-shadow:0 3px 10px -6px rgba(14,36,71,0.18);transition:transform .08s ease;}
  .stat-card-v2:active{transform:scale(0.96);}
  .stat-card-v2:nth-child(4n+1){background:linear-gradient(150deg, #F1FBF5, #C9EBD9);}
  .stat-card-v2:nth-child(4n+2){background:linear-gradient(150deg, #E6E2A8, #B9C77E);}
  .stat-card-v2:nth-child(4n+3){background:linear-gradient(150deg, #CDEFEA, #86D2C6);}
  .stat-card-v2:nth-child(4n+4){background:linear-gradient(150deg, #E7D796, #C6AD5E);}
  .stat-card-v2:active{transform:scale(0.96);}
  .stat-card-v2 .row-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .stat-card-v2 .icon-badge{background:rgba(255,255,255,0.55);}
  .stat-card-v2 .chev{color:var(--gold-dark);background:rgba(255,255,255,0.55);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:8px;}
  .stat-card-v2 .n{font-family:var(--font-mono);font-size:22px;font-weight:800;color:var(--primary-dark);margin-top:10px;}
  .stat-card-v2 .title{font-size:12.5px;font-weight:700;margin-top:3px;color:var(--ink);}
  .stat-card-v2 .sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}

  .qa-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .qa-head h2{margin:0;padding-left:10px;border-left:3px solid var(--gold);}
  .qa-head span{font-size:11px;color:var(--ink-soft);}
  .qa-grid{display:flex;flex-wrap:nowrap;justify-content:space-evenly;align-items:flex-start;gap:8px;}
  .qa-grid+.qa-grid{margin-top:10px;}
  .qa-tile{flex:0 1 auto;min-width:60px;max-width:78px;background:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.7);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;transition:transform .08s ease;}
  .qa-tile:active{transform:scale(0.94);}
  .qa-tile .icon-badge{margin:0 auto 6px;background:rgba(255,255,255,0.85);width:38px;height:38px;font-size:18px;}
  .qa-tile .title{font-size:12px;font-weight:800;color:var(--ink);}
  .qa-tile .sub{display:none;}

  .promo-banner{background:linear-gradient(120deg, #0E1F14, var(--primary-dark));border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:12px;box-shadow:0 8px 20px -10px rgba(18,74,46,0.5);}
  .promo-banner .pico{font-size:30px;flex:0 0 auto;}
  .promo-banner .txt{flex:1;min-width:0;}
  .promo-banner .txt b{font-size:14px;display:block;margin-bottom:2px;}
  .promo-banner .txt span{font-size:11px;opacity:0.85;line-height:1.4;display:block;}
  .promo-banner button{background:#fff;color:var(--primary-dark);border:none;border-radius:10px;padding:9px 12px;font-weight:800;font-size:11.5px;white-space:nowrap;cursor:pointer;flex:0 0 auto;}

  /* ---------- Login ---------- */
  .login-wrap{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-y:auto;
    background:
      radial-gradient(circle at 15% 15%, rgba(201,162,39,0.22), transparent 42%),
      radial-gradient(circle at 85% 85%, rgba(255,255,255,0.08), transparent 40%),
      linear-gradient(160deg, #0E1F14, var(--primary-dark) 45%, var(--primary) 100%);
    padding:24px 20px;
  }
  .login-card{
    background:var(--surface); width:100%; max-width:340px; border-radius:20px;
    padding:30px 24px; box-shadow:0 20px 60px rgba(14,36,71,0.35);
    animation:loginCardIn .35s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes loginCardIn{from{transform:translateY(14px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .login-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .login-brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(242,169,59,0.25);}
  .login-brand span{font-weight:800;letter-spacing:0.02em;font-size:15px;color:var(--primary-dark);text-transform:uppercase;}
  .login-brand-lg{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .login-logo{width:52px;height:52px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -6px rgba(18,74,46,0.35);flex:0 0 auto;padding:4px;border:2px solid var(--gold);}
  .login-brand-name{font-weight:800;font-size:17px;color:var(--primary-dark);letter-spacing:-0.01em;}
  .login-brand-sub{font-size:11px;color:var(--gold-dark);text-transform:uppercase;letter-spacing:0.04em;margin-top:1px;font-weight:700;}
  .login-card h1{font-size:23px;margin:4px 0 2px;letter-spacing:-0.01em;}
  .login-card p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 20px;}

  /* ---------- Post-login sequence: loading -> welcome ---------- */
  .welcome-screen{text-align:center;color:#fff;max-width:320px;}
  .welcome-logo{width:76px;height:76px;border-radius:20px;background:#fff;padding:8px;object-fit:contain;box-shadow:0 12px 28px -8px rgba(0,0,0,0.5);border:2px solid var(--gold);}
  .welcome-brand{font-size:26px;font-weight:800;letter-spacing:-0.01em;margin:6px 0 22px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.25);}
  .postlogin-spinner{
    width:46px;height:46px;border-radius:50%;margin:0 auto;
    border:4px solid rgba(255,255,255,0.22);border-top-color:var(--gold);
    animation:postloginSpin 0.85s linear infinite;
  }
  .postlogin-spinner.spinner-alert{border-top-color:var(--danger);}
  @keyframes postloginSpin{ to{ transform:rotate(360deg); } }
  .loading-msg-fade{animation:loadingMsgFade .35s ease;}
  @keyframes loadingMsgFade{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  /* ---------- Skeleton loading (initial load only — the app loads all
     data upfront, then renders every other view instantly from memory,
     so this is the one place a shimmer placeholder actually adds value) ---------- */
  .skel-block{
    background:linear-gradient(90deg, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.14) 37%, rgba(255,255,255,0.06) 63%);
    background-size:400% 100%; animation:skelShimmer 1.4s ease infinite; border-radius:10px;
  }
  @keyframes skelShimmer{ 0%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
  .skel-nav{display:flex;gap:8px;justify-content:center;margin:26px 0 18px;}
  .skel-nav .skel-block{width:42px;height:42px;border-radius:50%;}
  .skel-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:280px;margin:0 auto;}
  .skel-cards .skel-block{height:64px;}
  .welcome-fade{opacity:0;animation:welcomeFadeIn .6s ease forwards;}
  .welcome-fade.d1{animation-delay:.05s;font-size:16px;font-weight:600;}
  .welcome-fade.d2{animation-delay:.22s;}
  .welcome-fade.d3{animation-delay:.4s;}
  .welcome-fade.d4{animation-delay:.58s;}
  @keyframes welcomeFadeIn{ from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.03em;}
  .field input, .field select, .field textarea{
    width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:11px;
    font-size:16.5px;font-family:var(--font-body);background:#FBFBFD;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--primary);background:#fff;}
  /* Custom in-app dropdown: replaces the native browser <select> popup with
     an inline-expanding list styled like the rest of the app, instead of
     the OS's own disconnected-looking dropdown UI. */
  .idd-wrap{width:100%;}
  .idd-trigger{
    width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:11px;
    font-size:16.5px;font-family:var(--font-body);background:#FBFBFD;text-align:left;
    display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;color:var(--ink);
  }
  .idd-trigger.idd-placeholder{color:var(--ink-soft);}
  .idd-trigger.idd-open{border-color:var(--primary);background:#fff;border-radius:11px 11px 0 0;}
  .idd-trigger .idd-chevron{flex:0 0 auto;transition:transform .15s ease;color:var(--ink-soft);}
  .idd-trigger.idd-open .idd-chevron{transform:rotate(180deg);}
  .idd-list{
    display:none;border:1.5px solid var(--primary);border-top:none;border-radius:0 0 11px 11px;
    max-height:240px;overflow-y:auto;background:#fff;box-shadow:0 8px 18px -8px rgba(10,16,32,0.18);
  }
  .idd-list.idd-list-open{display:block;}
  .idd-item{padding:11px 13px;font-size:15px;cursor:pointer;border-top:1px solid var(--border);}
  .idd-item:first-child{border-top:none;}
  .idd-item:active{background:var(--bg);}
  .idd-item.idd-selected{background:var(--success-bg);font-weight:700;color:var(--primary-dark);}
  .idd-item.idd-disabled{color:var(--ink-soft);pointer-events:none;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:var(--font-body);letter-spacing:0.01em;transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
    min-height:44px;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:linear-gradient(135deg, var(--primary), var(--primary-dark));color:#fff;width:100%;box-shadow:0 4px 12px -4px rgba(18,74,46,0.45);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-accent{background:var(--accent);color:var(--accent-ink);}
  .btn-outline{background:var(--surface);border:1.5px solid var(--border);color:var(--ink);}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-success{background:var(--success-bg);color:var(--success);}
  .btn-sm{padding:8px 12px;font-size:12.5px;border-radius:9px;width:auto;min-height:36px;}
  .err{background:var(--danger-bg);color:var(--danger);padding:9px 12px;border-radius:9px;font-size:13px;margin-bottom:14px;}
  .login-hint{margin-top:16px;font-size:11.5px;color:var(--ink-soft);text-align:center;line-height:1.5;}

  /* ---------- App bar ---------- */
  .topbar{
    background:linear-gradient(115deg, #4C9A6E 0%, var(--primary) 45%, var(--primary-dark) 100%);
    color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    flex:0 0 auto;overflow:visible;box-shadow:0 2px 10px -4px rgba(18,74,46,0.4);position:relative;z-index:20;
  }
  /* Only add the notch/status-bar safe-area padding when running installed
     as a standalone app (no browser chrome) — in a normal browser tab the
     browser's own address bar already occupies that space, so adding this
     too was creating a visibly oversized gap above the header on phones. */
  @media (display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui){
    .topbar{ padding-top:calc(12px + var(--sat)); }
  }
  .topbar-left{display:flex;align-items:center;gap:9px;min-width:0;overflow:visible;}
  .topbar-left .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .topbar-left .titles{min-width:0;}
  .topbar-left b{letter-spacing:0.01em;font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar-left .screen-label{font-size:12px;opacity:0.8;text-transform:uppercase;letter-spacing:0.04em;}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:#7CDDB0;display:inline-block;margin-right:5px;}
  .sync-dot.syncing{background:var(--accent);animation:syncPulse 0.9s ease-in-out infinite;}
  .sync-dot.pending{background:#FF8A73;animation:syncPulse 1.4s ease-in-out infinite;}
  @keyframes syncPulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .topbar-right{display:flex;align-items:center;gap:10px;flex:0 0 auto;overflow:visible;}
  .role-pill{
    font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;
    padding:3px 8px;border-radius:20px;display:inline-block;
  }
  .bell, .avatar-btn{
    position:relative;background:rgba(255,255,255,0.16);border:1.5px solid rgba(201,162,39,0.6);color:#fff;
    width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;font-weight:800;
    padding:0;flex:0 0 auto;transition:background .15s ease;
  }
  .bell:active, .avatar-btn:active{background:rgba(255,255,255,0.28);}
  .avatar-btn{overflow:hidden;}
  .bell .badge{
    position:absolute;top:-3px;right:-3px;background:var(--accent);color:var(--accent-ink);
    font-size:10px;font-weight:800;border-radius:20px;padding:1.5px 5.5px;min-width:16px;text-align:center;
    z-index:30;box-shadow:0 0 0 2px var(--primary-dark);line-height:1.5;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  .bell .badge-pulse-new{animation:bellBadgePulse .4s cubic-bezier(.3,1.5,.5,1);}
  @keyframes bellBadgePulse{0%{transform:scale(0);}60%{transform:scale(1.25);}100%{transform:scale(1);}}
  /* Red notification-dot badge — for use on any tile/icon (not just the
     bell), clearly distinct from the general gray/status .badge class. */
  .notif-dot{
    position:absolute;top:-3px;right:-3px;background:#D8483B!important;color:#fff!important;
    font-size:10px;font-weight:800;border-radius:20px;padding:1.5px 5.5px;min-width:16px;text-align:center;
    z-index:30;box-shadow:0 0 0 2px #fff;line-height:1.5;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  /* BUGFIX (2026-08-21): was ".notif-dot.pulse" -- but a totally unrelated
     ".pulse" class (the mono-font ticker bar below) also matches any
     element carrying class="pulse", and since it's declared LATER with
     the same specificity it silently won the cascade, inflating every
     notification badge in the app (padding:7px 16px + display:flex
     instead of the tiny padding:1.5px 5.5px it was supposed to have).
     Renamed to ".notif-pulse" so it can never collide with ".pulse"
     again -- see the class="notif-dot pulse" -> "notif-dot notif-pulse"
     updates at every badge call site below. */
  .notif-dot.notif-pulse{animation:bellBadgePulse .4s cubic-bezier(.3,1.5,.5,1);}
  .bell-sm{width:30px;height:30px;font-size:13px;}
  .bell-urgent{border-color:rgba(255,255,255,0.5);}
  .bell-urgent .badge{background:var(--danger);color:#fff;}

  .pulse{
    background:var(--ink);color:#D8DEEC;font-family:var(--font-mono);font-size:11px;
    padding:7px 16px;display:flex;gap:16px;overflow-x:auto;white-space:nowrap;flex:0 0 auto;
  }
  .pulse b{color:var(--accent);}
  .pulse b.warn{color:#FF8A73;}

  .content{flex:1;padding:14px 14px calc(18px + var(--navbar-h) + var(--sab));width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;}
  .card, .order-tile, .alert-tile, .stat{transition:box-shadow .15s ease, transform .1s ease;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(14,36,71,0.04), 0 6px 16px -12px rgba(14,36,71,0.15);}
  .card h2{font-size:16px;margin:0 0 4px;letter-spacing:-0.01em;color:var(--ink);}
  .card .desc{font-size:13px;color:var(--ink-soft);margin:0 0 12px;line-height:1.45;}

  .grid-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;}
  .stat .n{font-family:var(--font-mono);font-size:23px;font-weight:800;color:var(--primary-dark);}
  .stat .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin-top:3px;line-height:1.3;}

  /* Tables: no forced min-width -> no right-swipe needed. Everything fits the screen. */
  table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13.5px;}

  .bubble-text{white-space:pre-wrap;}

  .chat-search{

  /* ---------- Desktop / laptop layout (installable PC app) ----------
     Same idea as the phone override above: on a real laptop/desktop
     window, drop the decorative phone-frame mockup entirely and go
     full-bleed, then turn the bottom tab bar into a left sidebar via
     CSS Grid (topbar spans the full top row; sidebar + content share
     the row below). No DOM changes -- same markup as mobile. */
  @media (min-width:900px){
    .device-wrap{padding:0;background:var(--bg);align-items:stretch;}
    .device{width:100vw;height:100vh;border-radius:0;padding:0;box-shadow:none;}
    .device::before{display:none;}
    .device-screen{border-radius:0;}
    /* :has(> .topbar) scopes the grid to the logged-in app shell only --
       #root is also reused as-is (no wrapper class) for the login screen,
       branded loading screen, connection-failed screen, and the post-login
       welcome sequence, none of which have a .topbar child. Without this
       scoping, an unconditional "#root{display:grid}" was swallowing the
       login screen into the 232px sidebar-width first grid cell, leaving
       it squeezed in a corner instead of filling/centering on the screen. */
    #root:has(> .topbar){
      display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr;

       is correctly scoped away from it -- just give the card a touch more
       breathing room on a big screen, same centered-card-on-full-bleed-
       background look as the Android app. */
    .login-card{max-width:400px;}
    /* Any plain 2-column grid becomes 4-column with the extra desktop
       width: home stats, stock alert tiles, and every checkbox-label
       checklist grid (Permission Manager, Notification recipients). */
    .stat-grid-v2{grid-template-columns:repeat(4,1fr);}
    .alert-tile-grid{grid-template-columns:repeat(4,1fr);}
    .checkbox-grid{grid-template-columns:repeat(4,1fr);}
    /* Order tiles (Orders tab + Home's Recent Orders) and people/team
       cards (Customers, Users) used to just stack full-width, one per
       row -- on a wide desktop window that read as a single giant tile
       stretched edge-to-edge. Both become a proper 3-up grid on desktop;
       mobile is untouched (these wrapper classes are plain block
       containers there, so tiles keep stacking exactly as before). */
    .order-tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start;}
    .order-tile-grid .order-tile{margin-bottom:0;}
    .tile-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
    /* Bottom sheets read as a mobile pattern once the window is desktop-
       wide -- a sheet stretched edge-to-edge across a laptop screen looks
       broken. Keep the exact same markup/animation, just center it as a
       normal dialog with a sane max width instead of pinning it to the

    .modal-overlay{align-items:center;}

    .modal.modal-chat{max-width:640px;height:78vh;max-height:78vh;}
    .modal.modal-wide{max-width:760px;}
  }

const DEFAULT_CASE_SIZE = {
  '100ml':72, '200ml':48, '440ml':20, '50ml':168, '25ml':216, '3ml':750, '500ml':24, '1l':12,
};
const CASE_SIZE_EXCEPTIONS = [
  { name:'Oliva', size:'200ml', caseSize:25 },
];
// Small-bottle "pkt" packs — every product EXCEPT Olife (both), Zeytin (both) & Olio Classico (both).
const PKT_SIZE_BY_ML = { '3ml':25, '25ml':12, '50ml':12, '100ml':6 };
const PKT_EXCLUDED_NAMES = ['Olife Gold','Olife EV','Zeytin Green','Zeytin EV','Olio Classico Pure','Olio Classico EV'];
function getPktSize(name, size){
  if(PKT_EXCLUDED_NAMES.includes(name)) return null;
  return PKT_SIZE_BY_ML[normSize(size)] || null;
}

function normSize(s){ return String(s).toLowerCase().replace(/\s+/g,''); }
function sizeToMl(s){
  const norm = normSize(s);
  const m = norm.match(/^([\d.]+)(ml|l)$/);
  if(!m) return 0;
  const num = parseFloat(m[1]);
  return m[2]==='l' ? num*1000 : num;
}
function getCaseSize(name, size){
  const norm = normSize(size);
  const ex = CASE_SIZE_EXCEPTIONS.find(e => e.name===name && normSize(e.size)===norm);
  if(ex) return ex.caseSize;
  return DEFAULT_CASE_SIZE[norm] || null;
}
function itemKey(name,size){ return name+'__'+size; }
// One-time cleanup: any catalog item saved before case-size resolution was
// persisted (or added by hand) might still have caseSize:null in the
// backend, forcing order-form.html to independently guess a fallback value.
// Resolving and saving it here keeps the backend the single source of
// truth, so both apps always show the exact same number.
function backfillCatalogCaseSizes(){
  if(!S.currentUser || S.currentUser.role!=='admin') return;
  const needsFix = S.catalogItems.filter(it=>it.caseSize==null);
  if(!needsFix.length) return;
  needsFix.forEach(it=>{ it.caseSize = getCaseSize(it.name, it.size); });
  rebuildCatalogFlat();
  safeSet('app:catalogItems', S.catalogItems);
}
// Transport names typed anywhere get remembered so the dropdown grows on its own.
function rememberTransport(name){
  name = (name||'').trim();
  if(!name) return;
  if(!S.transports.some(t=>t.toLowerCase()===name.toLowerCase())){
    S.transports = [...S.transports, name];
    safeSet('app:transports', S.transports);
  }
}
// Party details are looked up LIVE from the customer record (not a frozen
// snapshot on the order) — editing a customer's city/transport/etc. in Team
// & Customers instantly reflects on every one of their orders, past and
// future, and on the public tracking link too.
function liveCustomerFor(order){
  if(!order.customerId) return null;
  return S.customers.find(c=>c.id===order.customerId) || null;
}
// Friendly, human-readable order number for display/receipts only — NOT
// used for access control. The actual tracking link is secured by the
// order's real (unguessable) id; this is just a nicer label to show people.
function generateOrderNumber(ts){
  const d = new Date(ts);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const yyyy = d.getFullYear();
  const dayKey = localDateKey(ts);
  const countToday = S.orders.filter(o => localDateKey(o.createdAt) === dayKey).length + 1;
  return `${mm}${dd}${yyyy}-${String(countToday).padStart(3,'0')}`;
}
// Public tracking link a party can open (no login) to see their order's
// status — points at track-order.html hosted alongside this app. The day
// key is included so the tracker knows exactly which partition to read.
// order-form.html is hosted on its own subdomain, separate from this app —
// point tracking links there explicitly rather than assuming same-domain.
// order-form.html is hosted on its own subdomain, served at the domain root
// (e.g. Netlify serves it as the site's index) — not at an /order-form.html path.
const ORDER_FORM_BASE_URL = "https://order.maproductsindia.com/";
function trackingLinkFor(order){
  const dayKey = localDateKey(order.createdAt);
  return `${ORDER_FORM_BASE_URL}?id=${encodeURIComponent(order.id)}&d=${dayKey}`;
}

// The product catalog is shared, backend-synced data (S.catalogItems) — both
// this app and the customer-facing order form read the same list, and admin
// can add new items/categories here without touching any code. DEFAULT_CATALOG
// above is only the one-time seed used the very first time the app runs.
function flattenDefaultCatalog(){
  const flat = [];
  DEFAULT_CATALOG.forEach(group=>{
    group.items.forEach(it=>{
      flat.push({ key: itemKey(it.name, it.size), cat: group.cat, rawCat: group.rawCat, name: it.name, size: it.size, mrp: it.mrp, caseSize: getCaseSize(it.name, it.size) });
    });
  });
  return flat;
}
let CATALOG_FLAT = [];
let RAW_CATEGORIES = [];
function rebuildCatalogFlat(){
  CATALOG_FLAT = S.catalogItems.map(it => ({
    ...it,
    ml: sizeToMl(it.size),
    caseSize: (it.caseSize!=null && it.caseSize!=='') ? it.caseSize : getCaseSize(it.name, it.size),
    pktSize: getPktSize(it.name, it.size),
  })).sort((a,b)=> a.name.localeCompare(b.name) || (sizeToMl(a.size)-sizeToMl(b.size)));
  RAW_CATEGORIES = [...new Set(CATALOG_FLAT.map(it=>it.rawCat))].sort((a,b)=>a.localeCompare(b));
}
function findItem(key){ return CATALOG_FLAT.find(i=>i.key===key); }
function fmtMl(ml){
  ml = Math.round(ml*100)/100;
  if(Math.abs(ml) >= 1000) return (ml/1000).toFixed(2)+' L';
  return ml+' mL';
}
// Total pc on its own line, then (*case+pc) and (#pkt+pc) as secondary lines.
function fmtCase(qty, caseSize){
  if(!caseSize) return `${qty} pc`;
  const cases = Math.floor(Math.abs(qty)/caseSize);
  const rem = Math.abs(qty)%caseSize;
  const sign = qty<0 ? '-' : '';
  return `${sign}${cases}c ${rem}pc <span class="mono" style="opacity:.7">(${qty} pc)</span>`;
}
// Wherever an item's quantity is shown, prefer "X cases" when it divides
// evenly by the case size; otherwise fall back to plain pieces. Used on
// order tiles, short-item indicators, and the Ready stock primary number.
function fmtQtyPreferCase(qty, caseSize){
  if(caseSize && qty!==0 && qty % caseSize === 0){
    const cases = qty / caseSize;
    return `${cases} case${Math.abs(cases)===1?'':'s'}`;
  }
  return `${qty} pc`;
}
function fmtReadyDisplay(qty, caseSize, pktSize){
  const sign = qty<0 ? '-' : '';
  const av = Math.abs(qty);
  const wholeCase = caseSize && qty!==0 && av % caseSize === 0;
  let html;
  if(wholeCase){
    const cases = av / caseSize;
    html = `<b>${sign}${cases} case${cases===1?'':'s'}</b><br/><span class="mono" style="opacity:.75">(${qty} pc)</span>`;
  } else {
    html = `<b>${qty} pc</b>`;
    if(caseSize){
      const c = Math.floor(av/caseSize), r = av%caseSize;
      html += `<br/><span class="mono" style="opacity:.75">(*${sign}${c}c ${r}pc)</span>`;
    }
  }
  if(pktSize){
    const p = Math.floor(av/pktSize), r2 = av%pktSize;
    html += `<br/><span class="mono" style="opacity:.75">(#${sign}${p}pkt ${r2}pc)</span>`;
  }
  return html;
}
// Searchable item picker: a text input with a native datalist so the person
// can type to filter instead of scrolling a long dropdown.
function itemPickerHtml(inputId, prefillKey){
  const preLabel = prefillKey ? (()=>{ const it=findItem(prefillKey); return it?`${it.name} ${it.size}`:''; })() : '';
  return `<input id="${inputId}" list="${inputId}List" value="${esc(preLabel)}" placeholder="Type to search item…" autocomplete="off" ${prefillKey?'disabled':''} />
    <datalist id="${inputId}List">${CATALOG_FLAT.map(it=>`<option value="${esc(it.name)} ${esc(it.size)}"></option>`).join('')}</datalist>`;
}
function resolveItemFromText(text){
  const norm = String(text||'').trim().toLowerCase();
  if(!norm) return null;
  let hit = CATALOG_FLAT.find(it=>`${it.name} ${it.size}`.toLowerCase()===norm);
  if(hit) return hit;
  // fall back to a loose contains-match if no exact match
  return CATALOG_FLAT.find(it=>norm.includes(it.name.toLowerCase()) && norm.includes(normSize(it.size))) || null;
}

// whenever admin hasn't customized a post's checklist yet, and as the
// canonical module order when rendering the checklist itself.
const DEFAULT_ROLE_TABS = Object.fromEntries(Object.keys(ROLES).map(r=>[r, ROLES[r].tabs.slice()]));
const MODULE_ORDER = ['home','orders','customers','stock','domino','tasks','expenses','dailywork','checkin','log','attendance','users'];
// Applies the admin-configured access checklist (S.rolePermissions) onto the
// live ROLES object, so every existing `ROLES[role].tabs` reference in the
// app automatically reflects the latest permissions without needing to be
// individually rewired.
function applyRolePermissionsToROLES(){
  Object.keys(ROLES).forEach(role=>{
    const perm = S.rolePermissions[role];
    if(perm){
      // "stock" tab visibility is derived from the 3 granular sub-views —
      // any one of Raw/Filled/Ready being viewable is enough to show the tab.
      const effective = Object.assign({}, perm, { stock: !!(perm.stock_raw || perm.stock_filled || perm.stock_ready) });
      const allowed = MODULE_ORDER.filter(t => t==='home' || effective[t]);
      ROLES[role].tabs = allowed.length ? allowed : ['home'];
    } else {
      ROLES[role].tabs = DEFAULT_ROLE_TABS[role].slice();
    }
    // Daily Work isn't in CHECKLIST_MODULES (the admin-customizable
    // Permission Manager checklist), so it can never come back from the
    // `perm` branch above -- Manager (full, view-only) and Packaging
    // (Filling + Packing only) always get it regardless of whether this
    // role's permissions were customized before this feature existed.
    if((role==='manager' || role==='packaging') && !ROLES[role].tabs.includes('dailywork')){
      ROLES[role].tabs.push('dailywork');
    }
  });
  if(S.currentUser && !ROLES[S.currentUser.role].tabs.includes(S.view)){
    S.view = ROLES[S.currentUser.role].tabs[0];
  }
}

function rebuildRolesRegistry(){

// Non-admin staff may only record a NEW entry (purchase / filling /
// packaging / expense / retail sale) on a working day, between 10:30 AM
// and 8:00 PM -- outside that window, or on a Sunday/admin-marked holiday
// (isWorkingDay, defined further down near Attendance), the shop floor
// shouldn't be logging new work at all. Admins are exempt (they may need
// to backfill/correct data anytime, e.g. entering a purchase recorded on
// paper the previous night). This only gates CREATING something new --
// editing/deleting an already-recorded entry is governed separately by
// canEditDailyEntry (own entry, not yet booked).
function withinEntryWindow(){
  if(S.currentUser.role==='admin') return true;
  const now = new Date();
  if(!isWorkingDay(localDateKey(now.getTime()))) return false;
  const mins = now.getHours()*60 + now.getMinutes();
  return mins >= (10*60+30) && mins <= (20*60);
}

  showAlert('Entries can only be recorded on working days, between 10:30 AM and 8:00 PM.');

// summary: first check-in, last check-out, and total time worked that day.
// Handles multiple check-in/out cycles in one day by summing each pair.
function computeDailySummaries(records){
  const byDateUser = {};
  records.forEach(r=>{
    const dateKey = localDateKey(r.timestamp);
    byDateUser[dateKey] = byDateUser[dateKey] || {};
    byDateUser[dateKey][r.username] = byDateUser[dateKey][r.username] || { name:r.name, events:[] };
    byDateUser[dateKey][r.username].events.push(r);
  });
  const summaries = [];
  Object.keys(byDateUser).forEach(dateKey=>{
    Object.keys(byDateUser[dateKey]).forEach(username=>{
      const entry = byDateUser[dateKey][username];
      const events = entry.events.slice().sort((a,b)=>a.timestamp-b.timestamp);
      let firstIn=null, lastOut=null, totalMs=0, openIn=null;
      events.forEach(e=>{
        if(e.type==='checkin'){ if(!firstIn) firstIn=e.timestamp; openIn=e.timestamp; }
        else if(e.type==='checkout'){ lastOut=e.timestamp; if(openIn){ totalMs += e.timestamp-openIn; openIn=null; } }
      });
      summaries.push({
        dateKey, dateTs: events[0].timestamp, username, name: entry.name,
        checkin: firstIn, checkout: openIn?null:lastOut,
        minutes: Math.round(totalMs/60000), ongoing: !!openIn
      });
    });
  });
  return summaries.sort((a,b)=> b.dateKey.localeCompare(a.dateKey) || a.name.localeCompare(b.name));
}

    .finally(()=>clearTimeout(timer));

async function flushOfflineQueue(){

  setSyncLabel(items.length===1 ? `Saving ${friendlySyncLabel(items[0].key)}…` : `Saving ${items.length} changes…`);

    snapshot.forEach(({key, entry})=>{

// giant cell. This keeps every row comfortably under Sheets' ~50,000
// character per-cell limit no matter how much history accumulates.

// day that exists server-side, so this produces exactly the same result a
// plain rebuild-from-scratch always did. On a DELTA sync (rawData only has
// the days that changed since last sync), this is what makes it safe — a
// delta that only touches today's orders can never cause yesterday's
// (unchanged) orders to silently vanish from the view. Returns `existing`
// itself (same reference, unchanged) when this entity has nothing at all

function mergePartitionedEntity(rawData, entity, existing){

  const merged = mergePartitionedEntity(rawData, entity, existing);
  if(merged === existing) return existing; // nothing for this entity in this payload — already correctly processed from last time
  let result = mapFn ? merged.map(mapFn) : merged;
  if(filterFn) result = result.filter(filterFn);
  return result.sort(sortFn);
}
// Which day-partition keys currently exist on the backend for each entity —
// tracked so "Reset all data" knows exactly what to delete (including days
// that might otherwise be left orphaned once S[entity] is cleared locally).
// Full-replace: only correct to call after a FULL sync, since it treats
// "day not present in rawData" as "day doesn't exist" — exactly right when
// rawData is everything, wrong when it's only a delta (see
// trackPartitionKeysDelta for that case).
function trackPartitionKeys(rawData){
  PARTITIONED_ENTITIES.forEach(entity=>{
    const days = new Set();
    Object.keys(rawData).forEach(k=>{
      if(k.indexOf(entity+'_')===0) days.add(k.substring(entity.length+1));
    });
    S._partitionKeysSeen[entity] = days;
  });
}
// Additive version for a DELTA sync — a day NOT present in this delta might
// just be unchanged (not deleted), so unlike trackPartitionKeys this must
// never DROP an already-known day, only ever add newly-seen ones. A day
// that server-side cleanup actually deleted will naturally drop off the
// next FULL resync (see FULL_RESYNC_INTERVAL_MS in startSyncPolling) —
// harmless in the meantime since the app's own display filters already
// hide anything past its normal retention age regardless of what
// _partitionKeysSeen still remembers.
function trackPartitionKeysDelta(rawData){
  PARTITIONED_ENTITIES.forEach(entity=>{
    Object.keys(rawData).forEach(k=>{
      if(k.indexOf(entity+'_')===0){
        (S._partitionKeysSeen[entity] = S._partitionKeysSeen[entity] || new Set()).add(k.substring(entity.length+1));
      }
    });
  });
}
function savePartitionDay(entity, dateKey){
  const tsField = PARTITIONED_TS_FIELD[entity];
  const dayItems = S[entity].filter(item => localDateKey(item[tsField]) === dateKey);
  (S._partitionKeysSeen[entity] = S._partitionKeysSeen[entity] || new Set()).add(dateKey);
  return safeSet('app:'+entity+'_'+dateKey, dayItems);
}
function savePartitionForItem(entity, item){
  return savePartitionDay(entity, localDateKey(item[PARTITIONED_TS_FIELD[entity]]));
}
// Saves every distinct day currently present in S[entity] — for bulk
// operations that may have touched several different days at once.
function savePartitionAllDays(entity){
  const tsField = PARTITIONED_TS_FIELD[entity];
  const days = new Set(S[entity].map(item=>localDateKey(item[tsField])));
  return Promise.all([...days].map(d=>savePartitionDay(entity, d)));
}

// Real login: the server verifies the password itself (against the same
// salted hash format hashPassword() already produces here) and mints a
// real session token, instead of the app deciding "this password matches"
// purely by comparing against a locally-held hash and then just trusting
// itself forever after. See action:"login" in order-ops-backend.gs.
async function apiLogin(username, password){

// Best-effort — the token is discarded client-side regardless of whether
// this reaches the server, so a failed/slow logout call never blocks the

// Actually revokes another user's session server-side (Force logout, and
// resetting someone else's password) — before this fix, both only ever
// flipped a client-visible flag (activeSessions) that the affected device
// would merely NOTICE on its next sync; its writes kept working the whole
// time since the backend never checked any token at all. Best-effort by
// design (fire-and-forget at both call sites): the client-visible

// whatever days I've locally seen" sequence with the one atomic,

// ---- Graceful handling for the two new auth failure reasons a write can
// come back with (2026-08-21 audit, findings #3/#4) ----
//   "session_required": the session is missing/stale/expired — re-login
//     (silently, without losing whatever screen the person is on) is the
//     fix, and it's exactly what's needed, so prompt for it right here.
//   "forbidden": the session IS valid, but this account's role doesn't
//     allow the action — re-login won't help, so just say so.
// Anything else (network errors, locked_busy, etc.) is left for the caller
// to keep handling as it already did (returns false so callers can fall
// back to their own generic message).
let authErrorPromptOpen = false;
function handleAuthError(errMsg){
  if(errMsg === 'forbidden'){
    showToast("You don't have permission to do that.", true);
    return true;
  }
  if(errMsg === 'session_required'){
    if(!authErrorPromptOpen && S.currentUser){
      authErrorPromptOpen = true;
      showPrompt(
        `Your session needs to be refreshed to keep saving changes, ${S.currentUser.name}. Enter your password to continue (anything already entered stays safely queued):`,
        '',
        async (pwd)=>{
          authErrorPromptOpen = false;
          if(!pwd) return;
          try{
            const result = await apiLogin(S.currentUser.username, pwd);
            if(result && result.ok && result.sessionToken){
              S.authToken = result.sessionToken;
              persistAuthToken(result.sessionToken);
              showToast('Session refreshed — syncing…');
              flushOfflineQueue(); // retry whatever was queued, now with a valid token
            } else {
              showAlert('That password was not accepted. Please try again from the Team page, or log out and back in.');
            }
          }catch(e){
            showAlert('Could not reach the server to refresh your session — will try again shortly.');
          }
        },
        {password:true},
        ()=>{ authErrorPromptOpen = false; } // cancelled — allow the prompt to reappear on the next failed write instead of being permanently silenced
      );
    }
    return true;
  }
  return false;
}

// o.lrPhotoUrl is Drive's "uc?export=download&id=..." link — reliable when used
// as-is for a real navigation (the <a href> download link), but Drive does not
// reliably serve raw image bytes on that same endpoint when hotlinked as an
// <img src> — it can redirect to an interstitial instead, which shows up as a
// broken-image icon. Drive's "thumbnail" endpoint is the one meant for inline
// embedding, so the preview <img> uses that instead (built from lrFileId if
// present, else parsed back out of lrPhotoUrl for older records).
function lrEmbedUrl(o){
  let fileId = o.lrFileId;

    if(m) fileId = m[1];
  }
  return fileId ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(fileId)}&sz=w1600` : o.lrPhotoUrl;
}

// Retail Sale/Samples originally stored one item directly on the entry
// (key/itemLabel/qty/amount) before it became multi-item (items[]/
// totalAmount). Old entries saved under that earlier format would otherwise
// have no `items` array at all — every place that reads .items (display,
// edit, delete) assumes it exists, so an un-normalized old entry shows up
// blank and silently fails to edit or delete. Converting on load fixes
// both at once, for any entry no matter how old.
function normalizeRetailEntry(e){
  if(e.items) return e; // already current format
  if(e.key){
    e.items = [{ key:e.key, itemLabel:e.itemLabel||e.key, qty:e.qty||0 }];
    e.totalAmount = e.amount||0;
  } else {
    e.items = []; // truly malformed / unrecoverable — at least won't crash anything now
    e.totalAmount = e.totalAmount||0;
  }
  return e;
}
// isFullSync=true means `data` is the ENTIRE dataset (initial load, or a
// periodic safety-net resync) — every S.* field gets set from it exactly
// as before. isFullSync=false means `data` may be a DELTA (only the keys
// that changed since the last sync) — any key simply absent from `data`
// is left completely untouched in S, instead of being wiped to a default.
// This single function safely handles both cases so there's only ever one
// place that needs to know about every field order-ops syncs — a delta
// merge bug here would mean a field silently stops updating, so every
// static key uses the same "only touch it if it's actually present"
// pattern, and every partitioned entity goes through
// mergeAndFilterPartition (which has that exact same guarantee for
// day-partitioned data).
function applyServerData(data, isFullSync){
  const has = k => Object.prototype.hasOwnProperty.call(data, k);
  if(has('users')) S.users = data.users || [];
  S.orders = mergeAndFilterPartition('orders', data, S.orders, o=>o.createdAt >= Date.now()-60*24*60*60*1000, (a,b)=>a.createdAt-b.createdAt);
  if(has('customers')) S.customers = data.customers || [];
  S.attendance = mergeAndFilterPartition('attendance', data, S.attendance, a=>a.timestamp >= Date.now()-60*24*60*60*1000, (a,b)=>a.timestamp-b.timestamp);
  if(has('tasks')) S.tasks = data.tasks || [];
  if(has('rawMaterial')) S.rawMaterial = data.rawMaterial || {};
  if(has('filledStock')) S.filledStock = data.filledStock || {};
  if(has('readyStock')) S.readyStock = data.readyStock || {};
  // expenses/retailSales are financial records — a longer, accounting-scale
  // retention window (1 year / 6 months) rather than the short log windows
  // below. activityLog/loginLog are pure logs, so they get a short 7-day
  // window like chatMessages/trackingViewLogs. Until this change all of
  // these had NO age filter at all (filterFn was null) and NO backend
  // cleanup — they'd grown, unbounded, one row per calendar day, since the
  // app's very first use, and every one of those rows was included in
  // every FULL sync. That was the main reason a fresh/first fetch (a new
  // device, a cleared cache, or the periodic full-resync safety net) kept
  // getting slower over time, hitting older/slower hardware hardest — see
  // cleanupOldFinancialData/cleanupOldMiscLogs below for the matching
  // backend-side cleanup that keeps this bounded going forward, including
  // a one-time sweep of the already-accumulated backlog.
  S.expenses = mergeAndFilterPartition('expenses', data, S.expenses, e=>e.at >= Date.now()-365*24*60*60*1000, (a,b)=>a.at-b.at);
  S.activityLog = mergeAndFilterPartition('activityLog', data, S.activityLog, l=>l.at >= Date.now()-7*24*60*60*1000, (a,b)=>a.at-b.at);
  if(has('lowStock')) S.lowStock = data.lowStock || {raw:{}, filled:{}, ready:{}};
  if(has('watchStock')) S.watchStock = data.watchStock || {raw:{}, filled:{}, ready:{}};
  if(has('stockTasks')) S.stockTasks = data.stockTasks || [];
  // BUGFIX (2026-08-21, explicit user request): Domino print entries must
  // NEVER be auto-deleted, no matter how old — dominoPrints used to share
  // the same 7-day window as activityLog/loginLog (see git history / the
  // comment block above), which was silently wiping older Domino history
  // both from the client's view (this filter) AND from the backend sheet
  // itself (see cleanupOldMiscLogs below, which used to include
  // 'dominoPrints' in its deletion sweep). No age filter here at all now —
  // every Domino day the server sends back is kept, same as e.g. customers.
  S.dominoPrints = mergeAndFilterPartition('dominoPrints', data, S.dominoPrints, null, (a,b)=>a.at-b.at);
  S.loginLog = mergeAndFilterPartition('loginLog', data, S.loginLog, l=>l.at >= Date.now()-7*24*60*60*1000, (a,b)=>a.at-b.at);
  S.chatMessages = mergeAndFilterPartition('chatMessages', data, S.chatMessages, m=>m.at >= Date.now()-7*24*60*60*1000, (a,b)=>a.at-b.at);
  S.retailSales = mergeAndFilterPartition('retailSales', data, S.retailSales, r=>r.at >= Date.now()-180*24*60*60*1000, (a,b)=>a.at-b.at, normalizeRetailEntry);
  if(isFullSync) trackPartitionKeys(data); else trackPartitionKeysDelta(data);
  if(has('customRoles')) S.customRoles = data.customRoles || [];
  if(has('rolePermissions')) S.rolePermissions = data.rolePermissions || {};
  if(has('notificationPrefs')) S.notificationPrefs = data.notificationPrefs || {};
  if(has('expenseBalances')) S.expenseBalances = data.expenseBalances || {};
  if(has('loginLockouts')) S.loginLockouts = data.loginLockouts || {};
  if(has('pendingNotifs')) S.pendingNotifs = data.pendingNotifs || {};
  rebuildRolesRegistry();
  applyRolePermissionsToROLES();
  if(has('catalogItems')) S.catalogItems = (data.catalogItems && data.catalogItems.length) ? data.catalogItems : flattenDefaultCatalog();
  rebuildCatalogFlat();
  if(has('transports')) S.transports = data.transports || [];
  if(has('dailyRecordMarks')) S.dailyRecordMarks = data.dailyRecordMarks || {};
  if(has('batchReferences')) S.batchReferences = data.batchReferences || {};
  if(has('holidays')) S.holidays = data.holidays || {};
  if(has('activeSessions')) S.activeSessions = data.activeSessions || {};
  S.trackingViewLogs = mergeAndFilterPartition('trackingViewLogs', data, S.trackingViewLogs, l=>l.at >= Date.now()-7*24*60*60*1000, (a,b)=>b.at-a.at);
  S.siteVisitLogs = mergeAndFilterPartition('siteVisitLogs', data, S.siteVisitLogs, l=>l.at >= Date.now()-7*24*60*60*1000, (a,b)=>b.at-a.at);
  S.stockMovementLog = mergeAndFilterPartition('stockMovementLog', data, S.stockMovementLog, l=>l.at >= Date.now()-7*24*60*60*1000, (a,b)=>b.at-a.at);
  cleanupOldChatDays();
  cleanupOldLogDays();
  cleanupOldBusinessData();
  cleanupOldMiscLogs();
  cleanupOldFinancialData();
  // Single-device login enforcement (security feature, 2026-08-21): every
  // sync re-checks whether this device's own session token still matches
  // what the backend says is the CURRENT valid token for this user. A
  // mismatch means a newer login (or an admin's force-logout) elsewhere
  // has superseded this device.
  checkSessionStillValid();
}
// Chat messages are only meant to live 7 days — reconcile the backend to
// match (admin-only, mirrors how "Reset all data" already deletes
// partition-day keys). Runs after every full data load.
function cleanupOldChatDays(){
  if(!S.currentUser || S.currentUser.role!=='admin') return;
  const seen = S._partitionKeysSeen.chatMessages;
  if(!seen || !seen.size) return;
  const cutoff = localDateKey(Date.now() - 7*24*60*60*1000);
  const stale = [...seen].filter(dk=>dk < cutoff).map(dk=>'chatMessages_'+dk);
  if(stale.length) apiDeleteKeys(stale).catch(()=>{});
}
function cleanupOldLogDays(){
  if(!S.currentUser || S.currentUser.role!=='admin') return;
  const cutoff = localDateKey(Date.now() - 7*24*60*60*1000);
  const stale = [];
  ['trackingViewLogs','siteVisitLogs','stockMovementLog'].forEach(entity=>{
    const seen = S._partitionKeysSeen[entity];
    if(!seen || !seen.size) return;
    [...seen].filter(dk=>dk < cutoff).forEach(dk=>stale.push(entity+'_'+dk));
  });
  if(stale.length) apiDeleteKeys(stale).catch(()=>{});
}
// Orders and attendance get a longer, 60-day window (they're real business
// records, not just logs) before being cleared from the LIVE app — the
// weekly Drive backup already has everything, so nothing is actually lost,
// it just moves from "in the app" to "in that backup file" after 60 days.
function cleanupOldBusinessData(){
  if(!S.currentUser || S.currentUser.role!=='admin') return;
  const cutoff = localDateKey(Date.now() - 60*24*60*60*1000);
  const stale = [];
  ['orders','attendance'].forEach(entity=>{
    const seen = S._partitionKeysSeen[entity];
    if(!seen || !seen.size) return;
    [...seen].filter(dk=>dk < cutoff).forEach(dk=>stale.push(entity+'_'+dk));
  });
  if(stale.length) apiDeleteKeys(stale).catch(()=>{});
}
// Deletes a (possibly large) list of stale keys in small chunks instead of
// one single call. The backend's deleteKeys handler does one real
// Sheets deleteRow() per key while holding the write lock for the whole
// batch — a single huge call (months/years of never-before-cleaned
// backlog, see cleanupOldMiscLogs/cleanupOldFinancialData below) would hold
// that lock long enough to fail other people's concurrent saves. Chunking
// keeps every individual lock hold short; each chunk is awaited before the
// next fires, so the natural request/response latency also gives other
// pending writers room to get in between chunks. Fire-and-forget at the
// call site — errors are swallowed per-chunk and whatever's left just gets
// retried on the next sync tick, same as the existing cleanup functions.
async function deleteKeysBatched(keys, batchSize){
  batchSize = batchSize || 20;
  for(let i=0; i<keys.length; i+=batchSize){
    try{ await apiDeleteKeys(keys.slice(i, i+batchSize)); }catch(e){ /* rest retried next tick */ }
  }
}
// activityLog/loginLog are pure logs — same 7-day window as
// chatMessages/trackingViewLogs/siteVisitLogs/stockMovementLog. Unlike
// those, these 2 had NO cleanup at all until now, so the first run after
// this ships can have a large backlog to clear — hence the batched delete.
// NOTE (2026-08-21): 'dominoPrints' used to be cleaned up here too (same
// 7-day window), which was actually DELETING Domino print history from the
// backend sheet, permanently, on every admin sync. Per explicit user
// request, Domino entries must never be auto-deleted — removed from this
// list entirely. Domino history is now unbounded, same as customers/orders
// on the "kept forever unless someone explicitly deletes a row" side.
function cleanupOldMiscLogs(){
  if(!S.currentUser || S.currentUser.role!=='admin') return;
  const cutoff = localDateKey(Date.now() - 7*24*60*60*1000);
  const stale = [];
  ['activityLog','loginLog'].forEach(entity=>{
    const seen = S._partitionKeysSeen[entity];
    if(!seen || !seen.size) return;
    [...seen].filter(dk=>dk < cutoff).forEach(dk=>stale.push(entity+'_'+dk));
  });
  if(stale.length) deleteKeysBatched(stale);
}
// expenses/retailSales are real financial/business records, so they get a
// longer, accounting-scale retention window than the plain logs above
// instead of sharing the 7-day cutoff: expenses 1 year, retailSales 6
// months. Same "no cleanup ever existed before" backlog concern as above.
function cleanupOldFinancialData(){
  if(!S.currentUser || S.currentUser.role!=='admin') return;
  const stale = [];
  const windows = { expenses: 365, retailSales: 180 };
  Object.keys(windows).forEach(entity=>{
    const seen = S._partitionKeysSeen[entity];
    if(!seen || !seen.size) return;
    const cutoff = localDateKey(Date.now() - windows[entity]*24*60*60*1000);
    [...seen].filter(dk=>dk < cutoff).forEach(dk=>stale.push(entity+'_'+dk));
  });
  if(stale.length) deleteKeysBatched(stale);
}

async function loadAll(){
  setSyncing(true);
  setSyncLabel('Loading data…');
  const MAX_ATTEMPTS = 3;
  let lastErr = null;
  for(let attempt=1; attempt<=MAX_ATTEMPTS; attempt++){
    try{
      const { data, updatedAt, systemHealth: sh } = await apiFetchAll();
      lastServerUpdatedAt = updatedAt || 0;
      if(sh) systemHealth = sh;
      applyServerData(data || {}, true);
      lastFullResyncAt = Date.now();

      if(S.users.length === 0){
        S.users.push({id:uid(), username:'admin', password:'admin123', name:'Admin', role:'admin'});
        await safeSet('app:users', S.users);
      }
      if(!data || !data.catalogItems || !data.catalogItems.length){
        safeSet('app:catalogItems', S.catalogItems); // first run ever — seed the backend so the order form can read it too
      }
      restoreSession();
      if(S.currentUser){
        // page refresh with an already-active session -- finalizeLogin() won't
        // run again, so this is the only other place a session actually "starts"
        initPushNotifications();
        checkForMissedNotifsOnLogin(); // safety net -- normally nothing to replay here since a still-valid session was never actually logged out/unsubscribed in between
      }
      backfillCatalogCaseSizes(); // resolve any legacy items missing a saved case size
      S.loadFailed = false;
      lastErr = null;
      break; // success
    }catch(e){
      lastErr = e;
      console.error(`initial load failed (attempt ${attempt}/${MAX_ATTEMPTS})`, e);
      if(attempt < MAX_ATTEMPTS){
        setSyncLabel(`Connecting… retry ${attempt}/${MAX_ATTEMPTS-1}`);
        await new Promise(r=>setTimeout(r, 1500)); // brief pause helps a lot with Apps Script cold-start
      }
    }
  }
  if(lastErr){
    // Never show a login screen with an empty/stale user list — that's what
    // was causing correct credentials to be falsely rejected as "invalid".
    // Show a clear, honest retry state instead.
    S.loadFailed = true;
    showToast('Could not connect — check your internet and try again', true);
  }
  S.loaded = true;
  setSyncLabel(null);
  setSyncing(false);
}

// Poll the backend so every device stays in sync in near real time,
// without disturbing whatever the person is doing (typing in a modal etc).
function sendHeartbeat(){
  if(!S.currentUser) return;
  // Preserve the existing session token (see issueNewSessionToken) --
  // the heartbeat only ever updates "last seen", it must never touch which
  // token is currently the valid one for this account.
  const prev = S.activeSessions[S.currentUser.username];
  S.activeSessions[S.currentUser.username] = Object.assign({}, (prev && typeof prev==='object') ? prev : null, { lastSeen: Date.now() });
  safeSet('app:activeSessions', S.activeSessions);
}
function startHeartbeat(){
  sendHeartbeat(); // fire immediately so status is correct right after login, not up to 60s stale
  setInterval(()=>{
    if(!S.currentUser) return;
    const messagesModalOpen = !!document.getElementById('messagesModalBody');
    const modalOpen = !!document.getElementById('modalOverlay') && !messagesModalOpen;
    if(modalOpen) return; // same "don't disturb active form-editing" principle as the main sync poll
    sendHeartbeat();
  }, 60000);
}
// One sync-poll tick, pulled out of the setInterval below so it can be
// tested directly. Whenever the server version has advanced, this fetches
// either a DELTA (only what changed since lastServerUpdatedAt — the normal
// case) or, once every FULL_RESYNC_INTERVAL_MS, a FULL resync — the safety
// net that catches deletions a delta can never report (see
// FULL_RESYNC_INTERVAL_MS's own comment).
async function doSyncTick(){
  if(!S.currentUser) return;
  flushOfflineQueue(); // fire-and-forget; retries any saves that failed while offline
  if(syncing) return;
  const messagesModalOpen = !!document.getElementById('messagesModalBody');
  const modalOpen = !!document.getElementById('modalOverlay') && !messagesModalOpen;
  if(modalOpen) return;
  try{
    const serverUpdatedAt = await apiFetchVersion();
    lastSuccessfulSyncAt = Date.now();
    if(serverUpdatedAt && serverUpdatedAt > lastServerUpdatedAt){
      setSyncLabel('Updating…');
      const needsFullResync = (Date.now() - lastFullResyncAt) > FULL_RESYNC_INTERVAL_MS;
      const { data, updatedAt, systemHealth: sh } = needsFullResync ? await apiFetchAll() : await apiFetchDelta(lastServerUpdatedAt);
      lastServerUpdatedAt = updatedAt || serverUpdatedAt;
      if(sh) systemHealth = sh;
      applyServerData(data || {}, needsFullResync);
      if(needsFullResync) lastFullResyncAt = Date.now();
      autoAdvanceOrders();
      syncStockTasksFromAlerts();
      setSyncLabel(null);
      // SPEED (2026-08-21, "notifications ko zda se zda fast kro" -- as fast
      // as possible, like WhatsApp): checking the bell/ring right HERE, the
      // instant real new data has actually landed, instead of on its own
      // separate 5s timer (see the old setInterval(checkForNewNotifRing,
      // 5000) this replaced) means the badge/sound latency is bounded by
      // ONLY this poll's own interval, not by however far out of phase the
      // two independent timers happened to drift relative to each other.
      checkForNewNotifRing();
      if(messagesModalOpen) refreshMessagesModal(); else render();
    } else if(S.view==='home' && !messagesModalOpen){
      // Nothing changed server-side, but time-sensitive things on Home
      // still need to tick forward on their own: the System Health
      // panel's "last synced Xs ago" text (admin), and the 5-minute
      // self-edit window on "Your recent activity" (everyone else) —
      // an Edit button must actually disappear once the window closes,
      // not just whenever the next real data change happens to arrive.
      // render()'s own diff-check keeps this cheap (skips the actual DOM
      // write on every OTHER tab where none of this is even shown).
      render();
    }
  }catch(e){ /* transient network hiccup — try again next tick */ }
}
function startSyncPolling(intervalMs){
  setInterval(doSyncTick, intervalMs || 4000);
}

/* ============================= AUTH ============================= */
// Session persists across app restarts using localStorage, but auto-expires
// after 48 hours of INACTIVITY (SESSION_MAX_MS) -- not 48 hours since login.
// Every genuine user interaction (click/keypress/touch, see
// watchUserActivityForIdleTimeout below) pushes SESSION_AT_KEY forward, so
// someone actively working stays logged in all day; only a device that's
// truly been left untouched for 48 hours signs itself out. (This was a flat
// 6-hour timer from login regardless of activity, then briefly a 12-hour
// idle timer -- changed to 48 hours idle per explicit user request on
// 2026-08-21.)
// Note: this only works when the app is actually hosted/opened in a real browser
// tab (as this Apps-Script-backed app is meant to be) — a claude.ai artifact
// preview iframe blocks storage APIs, so persistence won't show there.
const SESSION_KEY = 'orderops_session_user_id';
const SESSION_AT_KEY = 'orderops_session_started_at'; // last-activity timestamp (despite the name, kept for compatibility)
const SESSION_MAX_MS = 48 * 60 * 60 * 1000; // 48 hours of inactivity
function persistSession(user){
  try{
    localStorage.setItem(SESSION_KEY, user ? user.id : '');
    localStorage.setItem(SESSION_AT_KEY, user ? String(Date.now()) : '');
  }catch(e){}
}
// SECURITY FIX (2026-08-21 audit, findings #3/#4): the real server session
// token (from action:"login"), stored separately from SESSION_KEY (which is
// just "who was last logged in on this device, for restoring the UI").
// This is what every write now has to send for requireSession_ to accept it.
const AUTH_TOKEN_KEY = 'orderops_auth_token';
function persistAuthToken(token){
  try{
    if(token) localStorage.setItem(AUTH_TOKEN_KEY, token);
    else localStorage.removeItem(AUTH_TOKEN_KEY);
  }catch(e){}
}
function restoreAuthToken(){
  try{ return localStorage.getItem(AUTH_TOKEN_KEY) || null; }catch(e){ return null; }
}
// Called on every genuine user interaction while logged in -- refreshes
// just the activity timestamp (not the whole session) so the 48-hour idle
// clock resets. Throttled to at most once every 30s so a flurry of clicks
// doesn't hammer localStorage.
let lastActivityRefreshAt = 0;
function refreshSessionActivity(){
  if(!S.currentUser) return;
  const now = Date.now();
  if(now - lastActivityRefreshAt < 30000) return;
  lastActivityRefreshAt = now;
  try{ localStorage.setItem(SESSION_AT_KEY, String(now)); }catch(e){}
}
function watchUserActivityForIdleTimeout(){
  ['click','keydown','touchstart'].forEach(evt=>{
    document.addEventListener(evt, refreshSessionActivity, {passive:true});
  });
}
function restoreSession(){
  try{
    const id = localStorage.getItem(SESSION_KEY);
    const startedAt = parseInt(localStorage.getItem(SESSION_AT_KEY))||0;
    if(!id) return;
    if(!startedAt || (Date.now()-startedAt) > SESSION_MAX_MS){
      persistSession(null); // expired — force a fresh login
      return;
    }
    const u = S.users.find(x=>x.id===id);
    if(u){
      S.currentUser = u;
      S.view = ROLES[u.role].tabs[0];
      // The real server session token (if any) survives an app restart too
      // -- if it's stale/expired, requireSession_ will reject the first
      // write that needs it and the app prompts a quick re-login then (see
      // handleAuthError), rather than forcing a full re-login just to
      // restore this READ-ONLY view of already-synced local data.
      S.authToken = restoreAuthToken();
    }
  }catch(e){}
}
function startSessionExpiryWatch(){
  setInterval(()=>{
    if(!S.currentUser) return;
    try{
      const startedAt = parseInt(localStorage.getItem(SESSION_AT_KEY))||0;
      if(startedAt && (Date.now()-startedAt) > SESSION_MAX_MS){
        doLogout();
        showToast('No activity for 48 hours — signed out. Please log in again.');
      }
    }catch(e){}
  }, 60000);
}

// ---- Single-device login: only one active session per user (security
// feature, 2026-08-21, explicit user request) ----
// A random token is (re)generated any time a login should invalidate every
// OTHER device currently signed in as this user: a fresh login itself
// (finalizeLogin), an admin's manual "Force logout" (Team page), and an
// admin resetting that user's password (openUserModal's submit handler).
// The backend just stores whatever token is "current" for each username
// (S.activeSessions[username].token) -- every device compares its own
// remembered token against that on every regular sync (see
// checkSessionStillValid, called at the end of applyServerData) and logs
// itself out the moment it no longer matches.
const DEVICE_SESSION_TOKEN_KEY = 'orderops_device_session_token';
const DEVICE_SESSION_TOKEN_AT_KEY = 'orderops_device_session_token_at';
function makeSessionToken(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// isThisDevice=true means the caller IS the affected user's own current
// device (a fresh login, or an admin editing their own account) -- their
// local copy is updated too so they don't immediately kick themselves out
// on the very next sync.
function issueNewSessionToken(username, isThisDevice){
  const token = makeSessionToken();
  const at = Date.now();
  const prev = S.activeSessions[username];
  S.activeSessions[username] = Object.assign({}, (prev && typeof prev==='object') ? prev : null, { token, at, lastSeen: at });
  safeSet('app:activeSessions', S.activeSessions);
  if(isThisDevice){
    try{
      localStorage.setItem(DEVICE_SESSION_TOKEN_KEY, token);
      localStorage.setItem(DEVICE_SESSION_TOKEN_AT_KEY, String(at));
    }catch(e){}
  }
  return token;
}
function checkSessionStillValid(){
  if(!S.currentUser) return;
  const rec = S.activeSessions[S.currentUser.username];
  const remoteToken = (rec && typeof rec==='object') ? rec.token : null;
  const remoteAt = (rec && typeof rec==='object') ? (rec.at||0) : 0;
  let myToken = '', myTokenAt = 0;
  try{
    myToken = localStorage.getItem(DEVICE_SESSION_TOKEN_KEY) || '';
    myTokenAt = parseInt(localStorage.getItem(DEVICE_SESSION_TOKEN_AT_KEY))||0;
  }catch(e){}
  if(!myToken){
    // No local token yet -- either this device logged in before this
    // feature shipped, or storage was cleared. Silently adopt whatever
    // the backend already has (or claim a fresh one if there's nothing
    // yet) instead of treating "I don't have one" as a mismatch.
    if(remoteToken){
      try{
        localStorage.setItem(DEVICE_SESSION_TOKEN_KEY, remoteToken);
        localStorage.setItem(DEVICE_SESSION_TOKEN_AT_KEY, String(remoteAt||Date.now()));
      }catch(e){}
    } else {
      issueNewSessionToken(S.currentUser.username, true);
    }
    return;
  }
  // Only trust a mismatch when the backend's record is strictly NEWER than
  // the token THIS device issued -- this is what makes the check safe
  // against the save-hasn't-landed-yet race right after a fresh login: a
  // sync that arrives before our own login write has been persisted still
  // shows the OLD (or no) token with an OLDER timestamp, so remoteAt >
  // myTokenAt is false and nothing happens; once our write lands, the
  // token itself matches too. A genuinely newer login (or a force-logout)
  // elsewhere is the only way remoteAt ends up newer with a different token.
  if(remoteToken && remoteToken!==myToken && remoteAt>myTokenAt){
    doLogout();
    showAlert('This account was just logged in on another device or browser, so you have been signed out here automatically.');
  }
}
// ---- Password hashing (Web Crypto API — built into every browser) ----
// Passwords are never stored in plaintext going forward. Existing
// plaintext passwords transparently upgrade to a salted hash the next
// time that user logs in — no manual migration step needed.
async function hashPassword(password, salt){
  const enc = new TextEncoder();
  const data = enc.encode(salt + '::' + password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function setUserPassword(user, plainPassword){
  const salt = randomSalt();
  user.passwordHash = await hashPassword(plainPassword, salt);
  user.passwordSalt = salt;
  delete user.password; // plaintext never lingers once a hash exists
}
async function verifyPassword(user, enteredPassword){
  if(user.passwordHash && user.passwordSalt){
    return (await hashPassword(enteredPassword, user.passwordSalt)) === user.passwordHash;
  }
  // Legacy plaintext account, not yet migrated — compare directly this once.
  return user.password === enteredPassword;
}
async function findMatchingUser(username, password){
  const u = S.users.find(x => x.username.toLowerCase() === username.trim().toLowerCase());
  if(!u) return null;
  const valid = await verifyPassword(u, password);
  if(!valid) return null;
  if(!u.passwordHash){
    // Transparent one-time upgrade: this successful login proves they know
    // the real password, so it's safe to hash it now and drop the plaintext.
    await setUserPassword(u, password);
    safeSet('app:users', S.users);
  }
  return u;
}
function finalizeLogin(u){
  S.currentUser = u;
  S.view = ROLES[u.role].tabs[0];
  persistSession(u);
  // Single-device login: this fresh login becomes the ONE valid session for
  // this account -- any other device still signed in as u will detect the
  // mismatch on its next sync (checkSessionStillValid) and log itself out.
  issueNewSessionToken(u.username, true);
  primeDevicePermissions();
  S.loginLog.push({id:uid(), username:u.username, name:u.name, role:u.role, at:Date.now()});
  if(S.loginLog.length>2000) S.loginLog = S.loginLog.slice(-2000); // day-partitioned now, but keep an overall sanity cap
  savePartitionForItem('loginLog', S.loginLog[S.loginLog.length-1]);
  S.postLoginPhase = null; S.pendingUser = null;
  render();
  backfillCatalogCaseSizes();
  sendHeartbeat();
  initPushNotifications();
  checkForMissedNotifsOnLogin();
}
function doLogout(){
  apiLogout(); // best-effort real server-side session revoke (2026-08-21 fix) -- never awaited, never blocks the local logout below
  unsubscribePushNotifications(); // "login mandatory for notifications" -- see its own comment
  S.currentUser = null; S.notifOpen=false; S.moreOpen=false; S.profileOpen=false; S.alertPanelOpen=null;
  S.authToken = null; persistAuthToken(null);
  persistSession(null);
  try{ localStorage.removeItem(DEVICE_SESSION_TOKEN_KEY); localStorage.removeItem(DEVICE_SESSION_TOKEN_AT_KEY); }catch(e){}
  render();
}
// Manual, on-demand backup — fetches everything fresh from the backend
// (not just what's currently in memory) and downloads it as one JSON file.
async function downloadBackupNow(){
  showToast('Preparing backup…');
  try{
    const { data } = await apiFetchAll();
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url;
    a.download = `OrderOps-Backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Backup downloaded ✅');
  }catch(e){
    console.error(e);
    showToast('Could not download backup — try again', true);
  }
}

/* ============================= STOCK ALERTS (cascading) =============================
   If ready stock is short: check filled stock can cover it -> if not, check raw oil
   can cover the remaining shortfall -> if raw also can't cover it, raise all 3 alerts. */
function getStockAlerts(){
  const raw = Object.entries(S.rawMaterial).filter(([c,v])=>v<0).map(([c,v])=>({id:c, label:c, text:fmtMl(v), team:'Owner / Manager — purchase more raw oil', level:'critical'}));
  const filledDirect = Object.entries(S.filledStock).filter(([k,v])=>v<0).map(([k,v])=>{const it=findItem(k); return {id:k, label: it?`${it.name} ${it.size}`:k, text:`${v} pc — need ${-v} pc`, needQty:-v, level:'critical', team:'Filling team — fill more'};});
  const ready = [];
  const filledCascade = [];
  const rawCascade = [];
  const recRaw = [], recFilled = [], recReady = [];
  Object.entries(S.readyStock).filter(([k,v])=>v<0).forEach(([k,v])=>{
    const it = findItem(k); if(!it) return;
    const shortfall = -v; // pieces short in ready
    const filledAvail = S.filledStock[k]||0;
    ready.push({id:k, label:`${it.name} ${it.size}`, text:`${v} pc — need ${shortfall} pc`, needQty:shortfall, team:'Packaging team — package more', level:'critical'});
    if(filledAvail < shortfall){
      const stillShort = shortfall - Math.max(filledAvail,0);
      filledCascade.push({id:k, label:`${it.name} ${it.size}`, text:`need ${stillShort} more pc`, needQty:stillShort, team:'Filling team — fill more', level:'critical'});
      const rawAvail = S.rawMaterial[it.rawCat]||0;
      const mlNeeded = stillShort * it.ml;
      if(rawAvail < mlNeeded){
        rawCascade.push({id:it.rawCat, label:it.rawCat, text:`short ~${fmtMl(mlNeeded-rawAvail)}`, team:'Owner / Manager — purchase more raw oil', level:'critical'});
      }
    }
  });
  // Low-stock (owner-set threshold), only when not already negative
  RAW_CATEGORIES.forEach(cat=>{
    const v = S.rawMaterial[cat]||0; const th = S.lowStock.raw[cat];
    if(th && v>=0 && v<=th) raw.push({id:cat, label:cat, text:`${fmtMl(v)} (low, alert at ${fmtMl(th)})`, team:'Owner / Manager — running low, plan a purchase', level:'low'});
  });
  CATALOG_FLAT.forEach(it=>{
    const vf = S.filledStock[it.key]||0; const thf = S.lowStock.filled[it.key];
    if(thf && vf>=0 && vf<=thf) filledDirect.push({id:it.key, label:`${it.name} ${it.size}`, text:`${vf} pc — low (alert at ${thf} pc)`, needQty:Math.max(thf-vf,1), team:'Filling team — running low', level:'low'});
    const vr = S.readyStock[it.key]||0; const thr = S.lowStock.ready[it.key];
    if(thr && vr>=0 && vr<=thr){
      const needQty = Math.max(thr-vr,1);
      ready.push({id:it.key, label:`${it.name} ${it.size}`, text:`${vr} pc — low (alert at ${thr} pc)`, needQty, team:'Packaging team — running low', level:'low'});
      // A low (not yet critical) ready shortage still needs enough FILLED
      // stock to actually pack from — if there isn't enough, give filling
      // team a heads-up too, just at "recommended" (not urgent) severity,
      // matching the softer severity of the ready-side alert itself.
      const filledAvail = S.filledStock[it.key]||0;
      if(filledAvail < needQty && !filledDirect.some(a=>a.id===it.key)){
        recFilled.push({id:it.key, label:`${it.name} ${it.size}`, text:`${filledAvail} pc (recommend filling — packaging is running low)`, needQty:needQty-Math.max(filledAvail,0), team:'Filling team — plan ahead', level:'recommended'});
      }
    }
  });
  // merge direct + cascaded, de-duped by id (keep most severe)
  const dedupe = (list)=>{ const seen=new Map(); list.forEach(a=>{ const ex=seen.get(a.id); if(!ex || (ex.level!=='critical'&&a.level==='critical')) seen.set(a.id,a); }); return [...seen.values()]; };
  const filled = dedupe([...filledDirect, ...filledCascade]);
  const rawAll = dedupe([...raw, ...rawCascade]);
  // Recommended (preemptive heads-up) — only for items that aren't already
  // flagged critical/low, based on a separate, higher "watch" threshold the
  // admin can set. This is a softer, forward-looking suggestion, not an alert.
  RAW_CATEGORIES.forEach(cat=>{
    if(rawAll.some(a=>a.id===cat)) return;
    const v = S.rawMaterial[cat]||0; const th = S.watchStock.raw[cat];
    if(th && v>=0 && v<=th) recRaw.push({id:cat, label:cat, text:`${fmtMl(v)} (recommend purchasing soon)`, team:'Owner / Manager — plan ahead', level:'recommended'});
  });
  CATALOG_FLAT.forEach(it=>{
    if(!filled.some(a=>a.id===it.key)){
      const vf = S.filledStock[it.key]||0; const thf = S.watchStock.filled[it.key];
      if(thf && vf>=0 && vf<=thf && !recFilled.some(a=>a.id===it.key)) recFilled.push({id:it.key, label:`${it.name} ${it.size}`, text:`${vf} pc (recommend filling soon)`, needQty:Math.max(thf-vf,1), team:'Filling team — plan ahead', level:'recommended'});
    }
    if(!ready.some(a=>a.id===it.key)){
      const vr = S.readyStock[it.key]||0; const thr = S.watchStock.ready[it.key];
      if(thr && vr>=0 && vr<=thr) recReady.push({id:it.key, label:`${it.name} ${it.size}`, text:`${vr} pc (recommend packing soon)`, needQty:Math.max(thr-vr,1), team:'Packaging team — plan ahead', level:'recommended'});
    }
  });
  return {raw:rawAll, filled, ready, recommended:{raw:recRaw, filled:recFilled, ready:recReady}, total: rawAll.length+filled.length+ready.length};
}

/* Search + "non-zero on top" sort helper for inventory lists */
function filterSortInventory(list, searchKey, valueFn, labelFn){
  const q = (S.search[searchKey]||'').trim().toLowerCase();
  let out = list.filter(it => !q || labelFn(it).toLowerCase().includes(q));
  out = out.slice().sort((a,b)=>{
    const va = valueFn(a), vb = valueFn(b);
    const tierOf = v => v<0 ? 0 : v>0 ? 1 : 2; // 0: short (negative), 1: in stock, 2: empty
    const ta = tierOf(va), tb = tierOf(vb);
    if(ta!==tb) return ta-tb;
    return labelFn(a).localeCompare(labelFn(b)); // alphabetical within every tier
  });
  return out;
}
function searchBarHtml(searchKey, placeholder){
  return `<div class="search-wrap"><input type="text" id="search_${searchKey}" placeholder="${esc(placeholder)}" value="${esc(S.search[searchKey]||'')}" /></div>`;
