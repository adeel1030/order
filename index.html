}
function openExpenseModal(existing, type, forUsername){
  const isAdmin = S.currentUser.role==='admin';
  const managers = S.users.filter(u=>u.role==='manager');
  const isSettlement = type==='settlement';
  showModal(`
    <h3>${existing?'Edit entry':isSettlement?(isAdmin?'Add settlement (cash paid to manager)':'💵 Cash Settlement (received from Admin)'):'Add expense'}</h3>
    <form id="expForm">
      ${isAdmin?`<div class="field"><label>Manager</label><select id="expManager">${managers.map(u=>`<option value="${esc(u.username)}" ${(existing?existing.byUsername:forUsername)===u.username?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>`:''}
      <div class="field"><label>Description</label><input id="expDesc" value="${existing?esc(existing.description||''):''}" required /></div>
      <div class="field"><label>Category (optional)</label><input id="expCat" value="${existing?esc(existing.category||''):''}" placeholder="Fuel, transport, food…" /></div>
      <div class="field"><label>Amount (₹)</label><input id="expAmt" type="number" min="1" step="0.01" value="${existing?existing.amount:''}" required /></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelModal">Cancel</button>
        <button type="submit" class="btn btn-primary">${existing?'Save changes':'Save'}</button>
      </div>
    </form>
  `);
  document.getElementById('expForm').addEventListener('submit', withSubmitGuard((e)=>{
    e.preventDefault();
    if(!existing && blockIfOutsideEntryWindow()) return; // only gates NEW entries -- editing an existing one isn't a "new" entry
    const amount = parseFloat(document.getElementById('expAmt').value)||0;
    if(amount<=0){ showAlert('Enter a valid amount.'); return; }
    const managerSel = document.getElementById('expManager');
    const byUsername = isAdmin && managerSel ? managerSel.value : S.currentUser.username;
    const byUser = S.users.find(u=>u.username===byUsername);
    let touched;
    if(existing){
      // Capture the entry's balance-relevant fields BEFORE this edit
      // overwrites them, so applyExpenseBalanceDelta can reverse exactly
      // what this entry used to contribute (to its OLD manager, at its OLD
      // amount) before applying the new contribution below -- handles an
      // admin re-assigning the entry to a different manager or changing
      // its amount mid-edit without corrupting either balance.
      const before = { byUsername: existing.byUsername, amount: existing.amount, type: existing.type };
      Object.assign(existing, {
        description: document.getElementById('expDesc').value.trim(),
        category: document.getElementById('expCat').value.trim(), amount,
        byUsername, byName: byUser?byUser.name:byUsername
      });
      touched = existing;
      applyExpenseBalanceDelta(before, -1);
      applyExpenseBalanceDelta(touched, +1);
    } else {
      touched = {
        // BUGFIX (2026-08-21): this used to force type to 'expense' for
        // any non-admin submitter, regardless of what `type` was actually
        // passed in -- which silently broke the new manager-side "Cash
        // Settlement (from Admin)" self-report button (it opens this modal
        // with type='settlement', but the entry would've saved as a plain
        // expense). byUsername above is already always forced to the
        // submitter's own account for non-admins, so trusting `type`
        // itself here is safe -- it only ever arrives as 'expense' or
        // 'settlement' from the two buttons that open this modal, never
        // free-form user input.
        id:uid(), type: type || 'expense',
        description:document.getElementById('expDesc').value.trim(),
        category:document.getElementById('expCat').value.trim(), amount,
        byUsername, byName: byUser?byUser.name:S.currentUser.name,
        enteredByUsername: S.currentUser.username, enteredByName: S.currentUser.name,
        at:Date.now()
      };
      S.expenses.push(touched);
      applyExpenseBalanceDelta(touched, +1);
    }
    if(isAdmin) S.expenseAdminSel = byUsername;
    savePartitionForItem('expenses', touched);
    closeModal(); render(); showToast(existing?'Entry updated':'Saved');
  }));
}

function fmtAgo(ts){
  if(!ts) return null;
  const diffMs = Date.now() - ts;
  if(diffMs < 60000) return 'just now';
  if(diffMs < 3600000) return `${Math.floor(diffMs/60000)}m ago`;
  if(diffMs < 86400000) return `${Math.floor(diffMs/3600000)}h ago`;
  return `${Math.floor(diffMs/86400000)}d ago`;
}
function renderSystemHealthPanel(){
  const pending = pendingSaveCount();
  const backupAt = systemHealth.lastBackupAt ? parseInt(systemHealth.lastBackupAt) : null;
  const backupStale = !backupAt || (Date.now()-backupAt) > 36*60*60*1000; // backup runs daily -- 36h gives some trigger-delay tolerance before flagging it
  const backupHasError = systemHealth.lastBackupError && (!backupAt || parseInt(systemHealth.lastBackupError.split('@')[1]) > backupAt);
  const syncAgo = fmtAgo(lastSuccessfulSyncAt);
  const syncOk = lastSuccessfulSyncAt && (Date.now()-lastSuccessfulSyncAt) < 30000; // should tick every ~4s — 30s without one means something's actually stuck
  const items = [
    { label:'Backup', ok: !backupStale && !backupHasError, text: backupHasError ? 'failed — check Apps Script logs' : (backupAt ? fmtAgo(backupAt) : 'never run yet') },
    { label:'Sync', ok: syncOk, text: syncAgo || 'not yet synced' },
    { label:'Pending saves', ok: pending===0, text: pending===0 ? 'all saved' : `${pending} waiting` },
  ];
  return `<div class="card" style="padding:12px 14px;margin-bottom:12px;">
    <div style="font-size:11px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;">⚙️ System Health</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;">

    </div>
  </div>`;
}

function isLastWorkingDayOfMonth(d){
  d = d || new Date();
  const lastDate = new Date(d.getFullYear(), d.getMonth()+1, 0); // last calendar day of month
  let probe = new Date(lastDate);
  while(probe.getDay()===0){ probe.setDate(probe.getDate()-1); } // Sunday off, roll back to Saturday
  return probe.getFullYear()===d.getFullYear() && probe.getMonth()===d.getMonth() && probe.getDate()===d.getDate();
}

function loadImageAsDataURL(url){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{
      try{
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img,0,0);
        resolve(canvas.toDataURL('image/png'));
      }catch(e){ reject(e); }
    };
    img.onerror = reject;
    img.src = url;
  });
}
async function exportMonthPdf(year, month0){
  if(!window.jspdf || !window.jspdf.jsPDF){ showToast('PDF library failed to load', true); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const monthStart = new Date(year, month0, 1).getTime();
  const monthEnd = new Date(year, month0+1, 1).getTime();
  const inMonth = ts => ts>=monthStart && ts<monthEnd;
  const monthLabel = new Date(year, month0, 1).toLocaleDateString(undefined,{month:'long', year:'numeric'});

  // Brand palette pulled from the app's own theme, so the export actually
  // looks like it belongs to the same product instead of a plain text dump.
  const PRIMARY = [30,107,68], PRIMARY_DARK = [18,74,46], GOLD = [201,162,39];
  const INK = [18,32,25], INK_SOFT = [84,99,88], BORDER = [220,232,223], PAPER = [241,247,243];

  const marginX = 40, pageW = 595, pageH = 800, contentW = pageW - marginX*2;
  const footerY = pageH - 26;
  let y = 0;
  const ensure = (need)=>{ if(y+need>footerY-10){ doc.addPage(); y = 54; } };
  const h1 = (t)=>{
    ensure(30);
    doc.setFillColor(...PRIMARY); doc.rect(marginX, y-15, contentW, 24, 'F');
    doc.setFontSize(12); doc.setFont(undefined,'bold'); doc.setTextColor(255,255,255);
    doc.text(t.toUpperCase(), marginX+10, y+1);
    y += 28;
    doc.setTextColor(...INK); doc.setFont(undefined,'normal');
  };
  const h2 = (t)=>{
    ensure(20);
    doc.setFontSize(10.5); doc.setFont(undefined,'bold'); doc.setTextColor(...PRIMARY_DARK);
    doc.text(t, marginX, y);
    doc.setDrawColor(...BORDER); doc.setLineWidth(0.6);
    doc.line(marginX, y+4, pageW-marginX, y+4);
    y += 17;
    doc.setTextColor(...INK); doc.setFont(undefined,'normal');
  };
  const h3 = (t)=>{
    ensure(16);
    doc.setFontSize(9.5); doc.setFont(undefined,'bold'); doc.setTextColor(...INK);
    doc.text(t, marginX+4, y);
    y += 13;
    doc.setFont(undefined,'normal');
  };
  const line = (t)=>{
    ensure(12);
    doc.setFontSize(9); doc.setTextColor(...INK_SOFT);
    doc.text(t, marginX+16, y);
    y += 12;
    doc.setTextColor(...INK);
  };
  const emptyNote = (t)=>{ ensure(14); doc.setFontSize(9); doc.setFont(undefined,'italic'); doc.setTextColor(...INK_SOFT); doc.text(t, marginX+4, y); y+=16; doc.setFont(undefined,'normal'); doc.setTextColor(...INK); };

  // ---- Header block: colored band, logo + company name/address/GSTIN, report title ----
  doc.setFillColor(...PAPER); doc.rect(0, 0, pageW, 92, 'F');
  doc.setFillColor(...GOLD); doc.rect(0, 90, pageW, 2, 'F');
  let textX = marginX;
  try{
    const logoData = await loadImageAsDataURL(COMPANY_LOGO);
    doc.addImage(logoData, 'PNG', marginX, 18, 46, 46);
    textX = marginX + 58;
  }catch(e){ /* logo couldn't load (e.g. CORS/offline) — skip it, export continues without it */ }
  doc.setFontSize(17); doc.setFont(undefined,'bold'); doc.setTextColor(...PRIMARY_DARK);
  doc.text(COMPANY_NAME, textX, 34);
  doc.setFontSize(9); doc.setFont(undefined,'normal'); doc.setTextColor(...INK_SOFT);
  doc.text(COMPANY_ADDRESS, textX, 48);
  doc.text(`GSTIN: ${COMPANY_GSTIN}`, textX, 60);
  doc.setFontSize(10.5); doc.setFont(undefined,'bold'); doc.setTextColor(...PRIMARY);
  doc.text(`Monthly Report — ${monthLabel}`, textX, 78);
  doc.setTextColor(...INK);
  y = 116;

  // Orders
  h1('Orders');
  // 2026-08-22 (explicit user request): the Monthly Report now groups/sorts/
  // displays a dispatched order under the date it was actually DISPATCHED,
  // not the date it was originally placed. o.processedAt is set the moment
  // an order's status becomes 'processed' (both the full dispatch flow in
  // finalizeDispatch and the simpler setOrderStatus path always set it),
  // making it the one reliable "actually dispatched" timestamp -- more so
  // than o.dispatchedAt, which only the full LR/transport dispatch modal
  // sets. An order that hasn't been dispatched yet has no dispatch date to
  // use, so it still falls back to its placed date (o.createdAt) — nothing
  // about when an order actually came in is ever discarded from the data,
  // only THIS report's own date/grouping choice. When the two dates land on
  // different calendar days, the original placed date is still shown right
  // alongside the dispatch date, so nothing is hidden. Note: since this
  // groups by dispatch date, an order placed in one month but dispatched in
  // the next will appear in the LATER month's report, not the one it was
  // placed in — and a still-pending order counted in this month's report
  // (under its placed date) will move to a later month's report once it's
  // actually dispatched, if this report is ever regenerated after that.
  const orderReportDate = o => o.processedAt || o.createdAt;
  const orders = S.orders.filter(o=>inMonth(orderReportDate(o))).sort((a,b)=>orderReportDate(a)-orderReportDate(b));
  if(!orders.length) emptyNote('No orders this month.');
  groupByDate(orders.slice().sort((a,b)=>orderReportDate(b)-orderReportDate(a)), orderReportDate).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(o=>{
      const placedDiffers = o.processedAt && localDateKey(o.processedAt) !== localDateKey(o.createdAt);
      h3(`${o.customerName} — ${ORDER_STAGE_LABEL[o.status]||o.status} — by ${o.createdBy} — ${fmtTime(orderReportDate(o))}${placedDiffers?` (placed ${fmtDateOnly(o.createdAt)})`:''}`);
      o.items.forEach(i=> line(`${i.name} ${i.size} × ${i.qty}`));
    });
  });
  y += 6;

  // Activity log (purchases / filling / packaging)
  h1('Stock entries (purchase / filling / packaging)');
  const logs = S.activityLog.filter(e=>inMonth(e.at));
  if(!logs.length) emptyNote('No stock entries this month.');
  groupByDate(logs.slice().sort((a,b)=>b.at-a.at), e=>e.at).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(e=> line(`${activityLabel(e)} — ${activityAmount(e).replace(/<[^>]+>/g,'')} — by ${e.by} — ${fmtTime(e.at)}`));
  });
  y += 6;

  // Retail sale & samples
  h1('Retail Sale & Samples');
  const retail = S.retailSales.filter(x=>inMonth(x.at));
  if(!retail.length) emptyNote('No retail sales or samples this month.');
  groupByDate(retail.slice().sort((a,b)=>b.at-a.at), x=>x.at).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(x=>{
      const itemsText = (x.items||[]).map(i=>`${i.itemLabel} ×${i.qty}`).join(', ');
      h3(`${x.type==='sale'?'Sale':'Sample'}${x.type==='sale'?' — ₹'+(x.totalAmount||0).toLocaleString('en-IN'):''} — by ${x.by} — ${fmtTime(x.at)}`);
      line(itemsText);
    });
  });
  y += 6;

  // Domino printing
  h1('Domino printing');
  const dom = S.dominoPrints.filter(x=>inMonth(x.at));
  if(!dom.length) emptyNote('No entries this month.');
  groupByDate(dom.slice().sort((a,b)=>b.at-a.at), x=>x.at).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(x=> line(`${x.impressions} impressions${x.note?' — '+x.note:''} — by ${x.by} — ${fmtTime(x.at)}`));
  });
  y += 6;

  // Expenses & settlements
  h1('Expenses & settlements');
  const exps = S.expenses.filter(x=>inMonth(x.at));
  if(!exps.length) emptyNote('No entries this month.');
  groupByDate(exps.slice().sort((a,b)=>b.at-a.at), x=>x.at).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(x=> line(`${x.type==='settlement'?'Settled':'Expense'}: ₹${x.amount} — ${x.description||''} — ${x.byName} — ${fmtTime(x.at)}`));
  });
  y += 6;

  // Attendance
  h1('Attendance');
  const att = S.attendance.filter(a=>inMonth(a.timestamp));
  if(!att.length) emptyNote('No check-ins this month.');
  groupByDate(att.slice().sort((a,b)=>b.timestamp-a.timestamp), a=>a.timestamp).forEach(sec=>{
    h2(sec.heading);
    sec.items.forEach(a=>{ const geoLatP=safeGeoCoord(a.lat), geoLngP=safeGeoCoord(a.lng); line(`${a.name} — ${a.type} — ${fmtTime(a.timestamp)}${(geoLatP!=null&&geoLngP!=null)?` — ${geoLatP.toFixed(4)}, ${geoLngP.toFixed(4)}`:''}`); });
  });

  // ---- Footer on every page: thin rule, company name, generated date, page numbers ----
  const totalPages = doc.internal.getNumberOfPages();
  for(let p=1; p<=totalPages; p++){
    doc.setPage(p);
    doc.setDrawColor(...BORDER); doc.setLineWidth(0.6);
    doc.line(marginX, footerY-8, pageW-marginX, footerY-8);
    doc.setFontSize(7.5); doc.setFont(undefined,'normal'); doc.setTextColor(...INK_SOFT);
    doc.text(`${COMPANY_NAME} — Order Ops export — generated ${fmtDate(Date.now())}`, marginX, footerY);
    doc.text(`Page ${p} of ${totalPages}`, pageW-marginX, footerY, {align:'right'});
  }

  const stamp = `${year}-${String(month0+1).padStart(2,'0')}`;
  doc.save(`MA-Products-OrderOps-${stamp}.pdf`);
  showToast('PDF downloaded');
}

function countPresentToday(){
  const today = localDateKey(Date.now());
  const seen = new Set();
  S.attendance.forEach(a=>{ if(localDateKey(a.timestamp)===today) seen.add(a.username); });
  return seen.size;
}

const ORDER_STAGE_LABEL = {pending:'New', processing:'Processing', ready:'Ready', packed:'Packed', processed:'Processed & Dispatched', rejected:'Rejected'};
function orderDisplayLabel(o){
  const role = S.currentUser.role;
  if(role==='admin' || role==='manager') return o.customerName;
  const cust = liveCustomerFor(o);
  const city = (cust && cust.city) || o.customerCity;
  const transport = (cust && cust.transport) || o.transportName;
  const parts = [];
  parts.push(city ? `📍 ${city}` : '📍 City not set');
  if(transport) parts.push(`🚚 ${transport}`);
  return parts.join(' · ');
}
function orderMrpValue(o){
  return o.items.reduce((sum,i)=>{
    if(i.cancelled) return sum;
    const it = findItem(i.key);
    return sum + (it ? it.mrp*i.qty : 0);
  }, 0);
}
function renderOrderTile(o, showUndoDispatch){
  const isAdmin = S.currentUser.role==='admin';

  return `<div class="order-tile${tileCls}">
    <div class="ot-top"><span class="ot-name">${esc(orderDisplayLabel(o))}${o.source==='website'?' <span class="mono" style="font-weight:400;">🌐 Website</span>':''}</span><span class="badge badge-${o.status}">${esc(ORDER_STAGE_LABEL[o.status]||o.status)}</span></div>
    ${isLRUploader ? (()=>{ const lc=liveCustomerFor(o); const city=(lc&&lc.city)||o.customerCity; const transport=(lc&&lc.transport)||o.transportName; const bits=[]; if(city) bits.push(`📍 ${esc(city)}`); if(transport) bits.push(`🚚 ${esc(transport)}`); return bits.length?`<div class="ot-meta" style="margin-top:-2px;">${bits.join(' · ')}</div>`:''; })() : ''}
    <div class="ot-items">${o.items.map((i,idx)=>{
      const it = findItem(i.key);
      const caseSize = it ? it.caseSize : null;
      const qtyLabel = `${esc(i.name)} ${esc(i.size)} <span class="mono">×${fmtQtyPreferCase(i.qty, caseSize)}</span>`;
      if(i.cancelled){
        return `<span style="color:var(--ink-soft);text-decoration:line-through;">✖ ${qtyLabel} <i>(cancelled)</i></span>`;
      }
      const stockNow = S.readyStock[i.key]||0;
      let avail, shortQty;
      if(!o.stockDeducted){
        avail = stockNow >= i.qty;
        shortQty = avail ? 0 : (i.qty - Math.max(stockNow,0));
      } else {
        avail = stockNow >= 0;
        shortQty = avail ? 0 : -stockNow;
      }
      const mark = avail ? '<span class="success-pop" style="color:var(--success);">✔</span>' : `<span style="color:var(--danger);">✘ (short by ${fmtQtyPreferCase(shortQty, caseSize)})</span>`;
      return `${mark} ${qtyLabel}`;
    }).join('<br/>')}</div>
    ${o.transportName?`<div class="ot-meta"><b>🚚 ${esc(o.transportName)}</b>${o.totalCases?` · ${o.totalCases} cases`:''}${o.dispatchedAt?` · ${fmtDate(o.dispatchedAt)}`:''}</div>`:''}
    ${(()=>{ const geoLat=safeGeoCoord(o.orderLat), geoLng=safeGeoCoord(o.orderLng); const hasGeo = isAdmin && geoLat!=null && geoLng!=null; return `<div class="ot-meta">${o.orderNumber?`#${esc(o.orderNumber)} · `:''}by ${esc(o.createdBy)} · ${fmtTime(o.createdAt)}${hasGeo ? ` · <a href="https://www.google.com/maps?q=${encodeURIComponent(geoLat)},${encodeURIComponent(geoLng)}" target="_blank" rel="noopener" style="color:var(--primary);">📍 Order location</a>` : ''}${isAdmin ? ` · <button type="button" class="mono" data-view-tracking-logs="${o.id}" style="background:none;border:none;color:var(--primary);cursor:pointer;padding:0;font-size:inherit;">📜 Logs</button>` : ''}</div>`; })()}
    ${isAdmin ? (()=>{ const liveCust = liveCustomerFor(o); const disc = liveCust ? (liveCust.discountPercent||0) : 0; return `<div class="ot-meta"><b>MRP Value: ₹${orderMrpValue(o).toLocaleString('en-IN')}${disc>0?` (${disc}% off)`:''}</b></div>`; })() : ''}
    <div class="row-actions">
      ${(isAdmin || (S.currentUser.role==='sales' && o.createdByUsername===S.currentUser.username)) ? `<button class="btn btn-sm btn-outline" data-track-link="${o.id}">🔗 Track link</button>` : ''}

      ${o.status==='processing'?`<button class="btn btn-sm btn-outline" data-mark-ready-now="${o.id}">Mark Ready</button>`:''}
      ${o.status==='ready' && o.items.some(it=>it.autoCancelledByReady)?`<button class="btn btn-sm btn-outline" data-undo-ready="${o.id}">↩ Undo Ready</button>`:''}
      `:''}
      ${(isAdmin || S.currentUser.role==='manager')?`
      ${o.status==='ready'?`<button class="btn btn-sm btn-success" data-mark-packed="${o.id}">📦 Mark Packed &amp; Ready to Dispatch</button>`:''}
      ${o.status==='packed'?`<button class="btn btn-sm btn-outline" data-undo-packed="${o.id}">↩ Undo Packed</button>`:''}
      ${o.status==='packed'?`<button class="btn btn-sm btn-success" data-dispatch-order="${o.id}">Processed &amp; Dispatched</button>`:''}

      ${isAdmin?`<button class="btn btn-sm btn-outline" data-del-order="${o.id}">Delete</button>`:''}
    </div>
  </div>`;
}
// Home page's quick view — only orders still "in motion" (excludes
// Processed, which has its own dedicated button on the Orders tab),
// segregated by stage so admin sees each bucket clearly instead of one
// mixed date-sorted list.
// Segregates active (non-Processed — that's button-only now) orders by
// stage, in New -> Ready -> Processing order. `limit` caps each section
// (used on Home for a compact view); pass 0/undefined to show everything
// (used on the full Orders tab).
function renderOrdersSegregated(limit){
  const relevant = S.orders.filter(o=>o.status!=='processed');
  const byStage = (status)=>{
    const list = relevant.filter(o=>o.status===status).sort((a,b)=>b.createdAt-a.createdAt);
    return limit ? list.slice(0,limit) : list;
  };
  const pending = byStage('pending'), ready = byStage('ready'), packed = byStage('packed'), processing = byStage('processing');
  const section = (title, icon, list)=> list.length ? `<div style="margin-bottom:14px;">
    <div style="font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:8px;color:var(--ink-soft);">${icon} ${esc(title)} (${list.length})</div>
    <div class="order-tile-grid">${list.map(renderOrderTile).join('')}</div>
  </div>` : '';
  const html = section('New', '🛍️', pending) + section('Ready to dispatch', '🚚', ready) + section('Packed', '📦', packed) + section('Processing', '🔧', processing);
  return html || `<div class="empty"><div class="big">📦</div>No active orders right now.</div>`;
}
function renderOrderTilesGrouped(list, showUndoDispatch){
  if(list.length===0) return `<div class="empty"><div class="big">📦</div>No orders yet.</div>`;
  const sections = groupByDate(list, o=>o.createdAt);
  return sections.map(s=>dateGroupHeaderHtml(s.heading) + `<div class="order-tile-grid">${s.items.map(o=>renderOrderTile(o, showUndoDispatch)).join('')}</div>`).join('');
}

  } else {

function bindOrderRowActions(closeAfter){

    const o = S.orders.find(x=>x.id===b.dataset.trackLink); if(!o) return;
    const link = trackingLinkFor(o);
    const liveCust = liveCustomerFor(o);
    const partyName = (liveCust && liveCust.name) || o.customerName || 'there';
    const message = `Hello 👋 ${partyName}

Your order has been received and recorded! ✅

📦 Track your order anytime here:
${link}

Thanking You,
Regards
*M A Products INDIA*`;
    try{
      await navigator.clipboard.writeText(message);
      showToast('Tracking message copied — share it with the party');

  document.querySelectorAll('[data-undo-packed]').forEach(b=>b.addEventListener('click', ()=>{ undoMarkOrderPacked(b.dataset.undoPacked); }));

        o.items.forEach(d=>{
          if(d.cancelled) return; // already credited back separately (e.g. by Mark Ready) — crediting again would double-count
          S.readyStock[d.key]=(S.readyStock[d.key]||0)+d.qty;
          logStockMovement(d.key, `${d.name} ${d.size}`, 'order', d.qty, `Order deleted — ${orderDisplayLabel(o)}`);

let orderDraft = [];
let editingOrderId = null;
function findRecentDuplicateOrder(customerName, draftItems){
  const cutoff = Date.now() - 10*60*1000; // 10-minute window
  const normName = customerName.trim().toLowerCase();
  return S.orders.find(o=>{
    if(o.createdAt < cutoff) return false;
    if(o.status==='rejected') return false;
    if((o.customerName||'').trim().toLowerCase() !== normName) return false;
    return o.items.some(existingItem => draftItems.some(d => d.key===existingItem.key && d.qty===existingItem.qty));
  }) || null;
}

    if(existing) existing.qty += qty; else orderDraft.push({key, name:it.name, size:it.size, qty});
    renderDraftList();
    ordItemSel.value=''; document.getElementById('ordItemCases').value='0'; document.getElementById('ordItemQty').value='0';
    ordCaseRow.style.display='none';
  });
  document.getElementById('submitOrderBtn').addEventListener('click', ()=>{
    // SECURITY FIX (2026-08-21 audit, finding #9): disable the button the
    // instant a click is accepted, not just via withSubmitGuard -- this
    // flow can pause on a showConfirm/showPrompt chain (new-customer
    // prompt) that returns control to the browser between steps, so a
    // promise-based guard would release again before the flow is actually
    // done. Direct element disabling stays correct across that whole
    // chain (the overlay covers the button anyway once one appears), and
    // gets explicitly re-enabled on every early-return validation failure
    // below so a genuine retry after fixing the input still works.
    const submitBtnEl = document.getElementById('submitOrderBtn');
    if(submitBtnEl.disabled) return;
    if(orderDraft.length===0){ showAlert('Add at least one item.'); return; }
    const nameInput = document.getElementById('ordCustomer');
    const typedName = nameInput.value.trim();
    if(!typedName){ showAlert('Enter the party name.'); return; }
    submitBtnEl.disabled = true; // committed to submitting from here on -- every path below either finishes (and removes this button via closeModal) or explicitly re-enables it
    const proceedWithSubmit = ()=>{
    const existingCust = S.customers.find(c=>c.name.trim().toLowerCase()===typedName.toLowerCase());
    let custId = existingCust ? existingCust.id : null;
    let custName = existingCust ? existingCust.name : typedName;
    let custCity = existingCust ? (existingCust.city||'') : '';
    let custPhone = existingCust ? (existingCust.phone||'') : '';
    let custAddress = existingCust ? (existingCust.address||'') : '';
    let custGstin = existingCust ? (existingCust.gstin||'') : '';
    const finish = ()=>{
      const shortItems = [];
      if(existingOrder){
        if(existingOrder.stockDeducted){
          // Already accepted — it holds reserved stock, so editing quantities
          // has to release the old amount and reserve the new amount.
          // Cancelled items were already credited back separately (e.g. by
          // Mark Ready) — skip them here too, or they'd be double-credited.
          existingOrder.items.forEach(d=>{ if(!d.cancelled){ S.readyStock[d.key] = (S.readyStock[d.key]||0) + d.qty; logStockMovement(d.key, `${d.name} ${d.size}`, 'order', d.qty, `Order edited — ${orderDisplayLabel(existingOrder)} (released old qty)`); } });
          orderDraft.forEach(d=>{
            S.readyStock[d.key] = (S.readyStock[d.key]||0) - d.qty;
            if(S.readyStock[d.key] < 0) shortItems.push(`${d.name} ${d.size}`);
            logStockMovement(d.key, `${d.name} ${d.size}`, 'order', -d.qty, `Order edited — ${orderDisplayLabel(existingOrder)} (new qty)`);
          });
          safeSet('app:readyStock', S.readyStock);
        }
        // Still pending (not yet accepted) — nothing was ever deducted, so
        // editing quantities is just an item-list change, no stock math needed.
        existingOrder.customerId = custId; existingOrder.customerName = custName; existingOrder.customerCity = custCity;
        existingOrder.customerPhone = custPhone; existingOrder.customerAddress = custAddress; existingOrder.customerGstin = custGstin;
        existingOrder.items = orderDraft.slice();
        savePartitionForItem('orders', existingOrder);
        autoAdvanceOrders();
        syncStockTasksFromAlerts();
        closeModal(); render();
        showToast(shortItems.length? `Order updated — ⚠ short on ${shortItems.join(', ')}` : 'Order updated');
      } else {
        // New orders are just a request until the owner accepts them —
        // stock is only reserved at accept time (see setOrderStatus).
        const nowTs = Date.now();
        const order = {
          id: uid(), orderNumber: generateOrderNumber(nowTs), customerId: custId, customerName: custName, customerCity: custCity, customerPhone: custPhone, customerAddress: custAddress, customerGstin: custGstin,
          items: orderDraft.slice(),
          status:'pending', fillingStatus:'pending', packagingStatus:'pending', stockDeducted:false, processedAt:null,
          createdBy: S.currentUser.name, createdByUsername: S.currentUser.username, createdByRole: S.currentUser.role, createdAt: nowTs
        };
        S.orders.push(order);
        savePartitionForItem('orders', order);
        closeModal(); render();
        showToast('Order submitted — waiting on owner to accept');
      }
    };
    if(!existingCust){
      showConfirm(`"${typedName}" is a new party — save it to the customer directory for next time?`, ()=>{
        showPrompt('City (used to show orders to non-admin staff without revealing the full party name):', '', (city)=>{
          showPrompt('Discount % for this party (enter 0 if none):', '0', (discountStr)=>{
            const discountPercent = Math.max(0, Math.min(100, parseFloat(discountStr)||0));
            const c = { id: uid(), name: typedName, phone:'', city, address:'', gstin:'', discountPercent, addedBy: S.currentUser.name, addedByUsername:S.currentUser.username, addedAt: Date.now() };
            S.customers.push(c);
            safeSet('app:customers', S.customers);
            custId = c.id; custName = c.name; custCity = city;
            finish();
          });
        });
      }, {danger:false, confirmLabel:'Save'}, finish); // declining still submits the order, just without saving a new customer record
    } else {
      finish();
    }
    }; // closes proceedWithSubmit
    if(!existingOrder){
      const dup = findRecentDuplicateOrder(typedName, orderDraft);
      if(dup){
        const itemsSummary = dup.items.map(i=>`${i.name} ${i.size} ×${i.qty}`).join(', ');
        showConfirm(`A very similar order for "${typedName}" was just created ${fmtAgo(dup.createdAt)} (${itemsSummary}). Submit this one too?`, proceedWithSubmit, {danger:false, confirmLabel:'Yes, submit anyway'}, ()=>{ submitBtnEl.disabled = false; }); // declined -- re-enable so they can actually retry
        return;
      }
    }
    proceedWithSubmit();
  });
}

      <span>${esc(d.name)} ${esc(d.size)} <span class="mono">×${fmtQtyPreferCase(d.qty, caseSize)}</span></span>
      <div class="row-actions">
        <button type="button" class="btn btn-sm btn-outline" data-edit-draft="${i}">Edit</button>
        <button type="button" class="btn btn-sm btn-outline" data-rm-draft="${i}">✕</button>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-rm-draft]').forEach(b=>b.addEventListener('click', ()=>{

    editingDraftIndex = parseInt(b.dataset.editDraft); renderDraftList();
  }));
  el.querySelectorAll('[data-cancel-draft-edit]').forEach(b=>b.addEventListener('click', ()=>{
    editingDraftIndex = null; renderDraftList();
  }));
  el.querySelectorAll('[data-save-draft-edit]').forEach(b=>b.addEventListener('click', ()=>{
    const i = parseInt(b.dataset.saveDraftEdit);
    const d = orderDraft[i];
    const it = findItem(d.key);
    const caseSize = it ? it.caseSize : null;
    const casesInput = document.getElementById('editDraftCases');
    const pcsInput = document.getElementById('editDraftPcs');
    const cases = casesInput ? (parseInt(casesInput.value)||0) : 0;
    const pcs = parseInt(pcsInput.value)||0;
    const qty = (caseSize ? cases*caseSize : 0) + pcs;
    if(qty<=0){ showAlert('Enter a quantity.'); return; }
    if(qty>MAX_PC_ENTRY){ showAlert(`Max ${MAX_PC_ENTRY} pc per line item.`); return; }
    d.qty = qty;
    editingDraftIndex = null;
    renderDraftList();
  }));
}

/* ============================= CHAT-STYLE ORDER ENTRY (voice / paste / free text -> draft) ============================= */
function guessNewPartyName(text){
  // Matches the app's own example convention: "Party Name - item x5, item2 x3".
  // Only used when no existing customer already matched the text.
  const dashMatch = text.match(/^\s*([^\n,;]+?)\s+[-–—]\s+/);
  if(!dashMatch) return null;
  const candidate = dashMatch[1].trim();
  if(!candidate || candidate.length<3 || candidate.length>60) return null;
  if(/^\d+$/.test(candidate)) return null;
  const cLower = candidate.toLowerCase();
  if(CATALOG_FLAT.some(it=>cLower.includes(it.name.toLowerCase()))) return null; // looks like a product line, not a name
  return candidate;
}
function parseOrderText(text){
  const result = { customerId:null, customerName:null, items:[], unmatched:[] };
  const lower = text.toLowerCase();
  let bestCust = null, bestLen = 0;
  S.customers.forEach(c=>{
    const n = c.name.toLowerCase();
    if(n.length>=3 && lower.includes(n) && n.length>bestLen){ bestCust = c; bestLen = n.length; }
  });
  if(bestCust){ result.customerId = bestCust.id; result.customerName = bestCust.name; }
  else { result.customerName = guessNewPartyName(text); }
  const segments = text.split(/\n|,|;|\band\b/i).map(s=>s.trim()).filter(Boolean);
  segments.forEach(seg=>{
    const segLower = seg.toLowerCase();
    if(bestCust && segLower.includes(bestCust.name.toLowerCase()) && seg.replace(bestCust.name,'').trim().length<3) return;
    let bestItem = null, bestScore = 0;
    CATALOG_FLAT.forEach(it=>{
      const nameOnly = it.name.toLowerCase();
      const sizeNorm = normSize(it.size);
      const segNorm = segLower.replace(/\s+/g,'');
      let score = 0;
      if(segLower.includes(nameOnly) && segNorm.includes(sizeNorm)) score = nameOnly.length + sizeNorm.length + 10;
      else if(segLower.includes(nameOnly)) score = nameOnly.length;
      if(score>bestScore){ bestScore=score; bestItem=it; }
    });
    if(bestItem){
      const nums = seg.match(/\d+/g);
      let qty = 1;
      if(nums && nums.length){
        const sizeNum = (bestItem.size.match(/\d+/)||[])[0];
        const candidate = nums.find(n=>n!==sizeNum) || (nums.length>1?nums[nums.length-1]:null);
        if(candidate) qty = parseInt(candidate)||1;
      }
      const existing = result.items.find(d=>d.key===bestItem.key);
      if(existing) existing.qty += qty; else result.items.push({key:bestItem.key, name:bestItem.name, size:bestItem.size, qty});
    } else if(seg.length>2){
      result.unmatched.push(seg);
    }
  });
  return result;
}

function renameTransportEverywhere(oldName, newName){
  // Editing a transporter is only ever meant to fix a spelling mistake, so
  // (unlike catalog renames, which involve real inventory-key migration)
  // this simply retro-updates every place the old spelling was recorded —
  // customers' preferred transport and every order's transportName.
  S.transports = S.transports.map(t=>t===oldName?newName:t);
  safeSet('app:transports', S.transports);
  let customersChanged = false;
  S.customers.forEach(c=>{
    if(c.transport===oldName){ c.transport = newName; customersChanged = true; }
  });
  if(customersChanged) safeSet('app:customers', S.customers);
  S.orders.forEach(o=>{
    if(o.transportName===oldName){ o.transportName = newName; savePartitionForItem('orders', o); }
  });
}

      <div class="field"><label>City</label><input id="custCity" value="${existingCust?esc(existingCust.city||''):''}" placeholder="e.g. Jaipur" required /></div>
      <div class="field"><label>Address</label><textarea id="custAddr" rows="2">${existingCust?esc(existingCust.address||''):''}</textarea></div>
      <div class="field"><label>GSTIN (optional)</label><input id="custGstin" value="${existingCust?esc(existingCust.gstin||''):''}" placeholder="22AAAAA0000A1Z5" style="text-transform:uppercase;" /></div>
      <div class="field"><label>Preferred Transport (optional)</label>
        <input id="custTransport" list="custTransportList" value="${existingCust?esc(existingCust.transport||''):''}" placeholder="e.g. XYZ Roadways" />
        <datalist id="custTransportList">${S.transports.map(t=>`<option value="${esc(t)}"></option>`).join('')}</datalist>
      </div>
      ${S.currentUser.role==='admin'?`<div class="field"><label>Discount % (admin only — shown next to MRP Value on this party's orders)</label><input id="custDiscount" type="number" min="0" max="100" step="0.1" value="${existingCust&&existingCust.discountPercent?existingCust.discountPercent:''}" placeholder="e.g. 10" /></div>`:''}
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelModal">Cancel</button>
        <button type="submit" class="btn btn-primary">${existingCust?'Save changes':'Add customer'}</button>
      </div>
    </form>
  `);
  document.getElementById('custForm').addEventListener('submit', withSubmitGuard((e)=>{
    e.preventDefault();
    const phone = document.getElementById('custPhone').value.trim();
    if(phone && !/^\d{10}$/.test(phone)){ showAlert('Enter a valid 10-digit WhatsApp number, or leave it blank.'); return; }
    const fields = {
      name: document.getElementById('custName').value.trim(),
      phone,
      city: document.getElementById('custCity').value.trim(),
      address: document.getElementById('custAddr').value.trim(),
      gstin: document.getElementById('custGstin').value.trim().toUpperCase(),
      transport: document.getElementById('custTransport').value.trim(),
    };
    if(S.currentUser.role==='admin'){
      const discountInput = document.getElementById('custDiscount');
      fields.discountPercent = discountInput ? Math.max(0, Math.min(100, parseFloat(discountInput.value)||0)) : 0;
    }
    rememberTransport(fields.transport);
    // Re-find by id rather than trusting the closure-captured reference —
    // if a background sync reassigned S.customers while this modal was
    // open, that old reference would be orphaned and editing it silently
    // wouldn't touch the array actually used for saving/rendering.
    const liveExisting = existingCust ? S.customers.find(c=>c.id===existingCust.id) : null;
    if(liveExisting){
      Object.assign(liveExisting, fields);
    } else if(existingCust){
      // Extremely rare: the customer vanished from S.customers entirely
      // (e.g. deleted elsewhere) while this edit was open — re-add it
      // rather than silently losing the edit.
      S.customers.push({ ...existingCust, ...fields });
    } else {
      S.customers.push({
        id: uid(), ...fields,
        addedBy: S.currentUser.name, addedByUsername: S.currentUser.username, addedAt: Date.now()
      });
    }
    safeSet('app:customers', S.customers);
    closeModal(); render(); showToast(existingCust?'Customer updated':'Customer added');
  }));
}

function resetAllDataExceptUsers(){
  showPrompt('Enter your admin password to confirm — this wipes everything except Users:', '', async (pwd)=>{
    if(!pwd) return;
    if(!(await verifyPassword(S.currentUser, pwd))){ showAlert('Incorrect password.'); return; }
    showConfirm('This will permanently erase ALL orders, customers, stock levels, expenses, logs, tasks, attendance, login history, and domino records. Users stay. This cannot be undone. Continue?', ()=>{
      performResetAllDataExceptUsers();
    }, {confirmLabel:'Yes, erase everything'});
  }, {password:true});
}
async function performResetAllDataExceptUsers(){
  // SECURITY FIX (2026-08-21 audit, finding #1's literal "wipe all data"
  // example): this used to separately save ~8 STATIC_KEYS to empty values
  // and call apiDeleteKeys with whatever day-partitions THIS DEVICE
  // happened to have seen locally -- fragile (a dropped connection
  // mid-sequence could leave things half-wiped) and, before the backend
  // fix, gated on nothing but the shared staff SECRET. Now it's one atomic,
  // admin-session-gated, server-comprehensive call (performResetAllData_ in
  // order-ops-backend.gs, which scans the ACTUAL sheet for every
  // day-partition row rather than trusting local bookkeeping) -- the
  // client's own local wipe below is now purely an optimistic UI update
  // that runs AFTER the server confirms success, not the source of truth.
  showToast('Erasing all data…');
  let result;
  try{
    result = await apiResetAllData();
  }catch(e){
    console.error('resetAllData failed', e);
    showAlert('Could not reset data: ' + e.message + '. Nothing was changed.');
    return;
  }

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height){ if(width > maxDim){ height = Math.round(height * maxDim/width); width = maxDim; } }
        else { if(height > maxDim){ width = Math.round(width * maxDim/height); height = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
// All user profiles are stored together as one JSON blob in a single Google
// Sheet cell (~50,000 char limit), so every photo has to stay genuinely
// small. Shrinks progressively until it fits, rather than silently failing
// to save later.
async function resizeImageFileSafe(file){
  const steps = [ [128,0.65], [100,0.55], [80,0.45], [64,0.4] ];
  let last = null;
  for(const [dim, q] of steps){
    last = await resizeImageFile(file, dim, q);
    if(last.length <= 8000) return last;
  }
  return last;
}

        // whoever had the OLD session keeps working right up to the
        // 48-hour idle timeout regardless. isThisDevice=true only when the
        // admin is resetting their OWN password, so they don't immediately
        // kick themselves out on the next sync.
        const isOwnAccount = existing.username===S.currentUser.username;

        // REAL server session (see apiInvalidateSession's own comment) --
        // but only when resetting someone ELSE's password. Revoking our

        // know the new password).
        if(!isOwnAccount) apiInvalidateSession(existing.username);

      showAlert('Password is required for a new user.'); reenable(); return;

    if(photo && JSON.stringify(draftUsers).length > 45000){
      showConfirm("Saving everyone's data together is getting too large to store reliably (mostly from photos). Save this person WITHOUT a photo instead?", ()=>{

        showAlert('Not saved. Remove a photo from another team member first, or skip the photo for this one.');
        reenable();
      });
      return;
    }
    finishSaveUser();
  });
}

// Sales can only message admin/manager, and only admin/manager can message
// sales — everyone else (filling, packaging, manager, admin) can message
// each other freely.
// Deterministic pseudo-random color per person (same idea as WhatsApp's
// default contact avatars) so the same user always gets the same color
// across renders, without needing to store a color on the user record.
const CHAT_AVATAR_COLORS = ['#1E6B44','#C9A227','#8E44AD','#2980B9','#C0392B','#16A085','#D35400','#5D6D7E'];
function avatarColorFor(name){
  name = name || '?';
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = (hash*31 + name.charCodeAt(i)) >>> 0;
  return CHAT_AVATAR_COLORS[hash % CHAT_AVATAR_COLORS.length];
}

// Grows a <textarea> to fit multiline content (WhatsApp-style composer)
// instead of staying a fixed one-line box -- caps at maxPx so a very long
// paste scrolls internally rather than pushing the send button off-screen.
function autoGrowTextarea(el, maxPx){
  if(!el) return;
  maxPx = maxPx || 120;
  el.style.height = 'auto';
  const next = Math.min(el.scrollHeight, maxPx);

}

function renderThreadView(otherUsername){
  const other = S.users.find(u=>u.username===otherUsername);
  const myUsername = S.currentUser.username;
  const msgs = S.chatMessages.filter(m=>m.type==='personal' && ((m.fromUsername===myUsername && m.toUsername===otherUsername) || (m.fromUsername===otherUsername && m.toUsername===myUsername))).sort((a,b)=>a.at-b.at);
  const sections = groupByDate(msgs, m=>m.at);
  let bubblesHtml = '';
  sections.forEach(sec=>{
    bubblesHtml += `<div style="text-align:center;margin:10px 0 8px;"><span style="background:var(--bg);color:var(--ink-soft);font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;">${esc(sec.heading)}</span></div>`;
    sec.items.forEach((m,i)=>{
      const mine = m.fromUsername===myUsername;
      // Consecutive messages from the same sender sit closer together, and
      // only the LAST bubble in that run gets the sharp "tail" corner —
      // matching WhatsApp's grouped-bubble look instead of every line
      // looking like a standalone message.
      const next = sec.items[i+1];
      const isLastInGroup = !next || next.fromUsername!==m.fromUsername;
      const tick = mine ? (m.read ? `<span style="color:#4FC3F7;">✓✓</span>` : `<span>✓</span>`) : '';
      const cornerStyle = isLastInGroup ? (mine ? 'border-bottom-right-radius:4px;' : 'border-bottom-left-radius:4px;') : '';
      bubblesHtml += `<div class="bubble-row ${mine?'mine':'theirs'} ${isLastInGroup?'group-end':''}">
        <div class="chat-bubble ${mine?'mine':'theirs'}" style="${cornerStyle}"><div class="bubble-text">${esc(m.text)}</div><div class="bubble-meta">${fmtTime(m.at)} ${tick}</div></div>
      </div>`;
    });
  });
  return `
    <div class="thread-header">
      <button type="button" class="thread-back-btn" id="backToThreadsBtn" title="Back" aria-label="Back">‹</button>
      ${chatAvatarHtml(other, 38)}
      <div style="min-width:0;">
        <div style="font-weight:800;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(other?other.name:otherUsername)}</div>
        <div style="font-size:11px;color:var(--ink-soft);">${esc(other&&ROLES[other.role]?ROLES[other.role].label:'')}</div>
      </div>
    </div>
    <div id="threadMsgList" class="chat-scroll">
      ${msgs.length===0?`<div class="empty">Say hello 👋</div>`:bubblesHtml}
    </div>
    <div class="chat-composer">
      <textarea id="threadReplyInput" class="chat-input" placeholder="Type a message…" rows="1"></textarea>
      <button type="button" class="chat-send-btn" id="sendThreadReplyBtn" disabled title="Send">➤</button>
    </div>
  `;
}
function scrollThreadToBottom(){
  const list = document.getElementById('threadMsgList');
  if(list) list.scrollTop = list.scrollHeight;
}
function markAllAnnouncementsRead(){
  S.chatMessages.forEach(m=>{
    if(m.type==='announcement' && !(m.readBy||[]).includes(S.currentUser.username)){
      m.readBy = m.readBy || []; m.readBy.push(S.currentUser.username);
      savePartitionForItem('chatMessages', m);
    }

}
function bindMessagesModal(skipScroll){
  document.querySelectorAll('[data-chat-tab]').forEach(b=>b.addEventListener('click', ()=>{
    if(S.chatView==='announcements') markAllAnnouncementsRead(); // leaving the tab — they've seen the dots by now
    S.chatView = b.dataset.chatTab; S.chatActiveThread = null; refreshMessagesModal();
  }));
  const postBtn = document.getElementById('postAnnouncementBtn');
  const announcementInput = document.getElementById('newAnnouncementText');
  if(postBtn) postBtn.addEventListener('click', ()=>{
    if(!announcementInput || !announcementInput.value.trim()) return;
    sendAnnouncement(announcementInput.value);
    refreshMessagesModal();
    showToast('Announcement posted');
  });
  if(announcementInput){
    announcementInput.addEventListener('input', ()=>{
      autoGrowTextarea(announcementInput);
      if(postBtn) postBtn.disabled = !announcementInput.value.trim();
    });
  }
  document.querySelectorAll('[data-open-thread]').forEach(el=>el.addEventListener('click', ()=>{
    S.chatActiveThread = el.dataset.openThread;
    S.chatSearch = ''; // fresh search box next time the list is shown
    markThreadRead(S.chatActiveThread);
    refreshMessagesModal();
  }));
  document.querySelectorAll('[data-start-chat]').forEach(el=>el.addEventListener('click', ()=>{
    S.chatActiveThread = el.dataset.startChat;
    S.chatSearch = '';
    refreshMessagesModal();
  }));
  const newChatBtn = document.getElementById('newChatBtn');
  if(newChatBtn) newChatBtn.addEventListener('click', ()=>{
    const picker = document.getElementById('newChatPicker');
    if(picker) picker.style.display = picker.style.display==='none' ? 'block' : 'none';
  });
  // Live filter of the conversation list as the person types — filters the
  // already-rendered rows directly (no re-render) so the search box never
  // loses focus mid-keystroke, WhatsApp-style instant search.
  const searchInput = document.getElementById('chatSearchInput');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      S.chatSearch = searchInput.value;
      const q = searchInput.value.trim().toLowerCase();
      let anyVisible = false;
      document.querySelectorAll('[data-open-thread]').forEach(row=>{
        const match = !q || (row.dataset.threadName||'').includes(q);
        row.style.display = match ? '' : 'none';
        if(match) anyVisible = true;
      });
      const emptyMsg = document.getElementById('chatSearchEmpty');
      if(emptyMsg){
        emptyMsg.textContent = `No matches for "${searchInput.value}".`;
        emptyMsg.style.display = anyVisible ? 'none' : 'block';
      }
    });
  }
  const backBtn = document.getElementById('backToThreadsBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ S.chatActiveThread = null; refreshMessagesModal(); });
  const sendReply = ()=>{
    const input = document.getElementById('threadReplyInput');
    if(!input || !input.value.trim()) return;
    sendPersonalMessage(S.chatActiveThread, input.value);
    input.value = '';
    refreshMessagesModal();
    scrollThreadToBottom();
  };
  const sendReplyBtn = document.getElementById('sendThreadReplyBtn');
  if(sendReplyBtn) sendReplyBtn.addEventListener('click', sendReply);
  const replyInput = document.getElementById('threadReplyInput');
  if(replyInput){
    // Enter always makes a new line here — like WhatsApp's mobile keyboard,
    // where Enter never sends; only the Send button does. (No special
    // keydown handling needed — a textarea's default Enter behavior IS a
    // newline; we just don't intercept it anymore.) The box also grows to
    // fit multiline text (up to a cap) instead of staying a single line.
    replyInput.addEventListener('input', ()=>{
      autoGrowTextarea(replyInput);
      if(sendReplyBtn) sendReplyBtn.disabled = !replyInput.value.trim();
    });
  }
  if(!skipScroll) scrollThreadToBottom(); // land at the newest message when a thread first opens (unless the person was reading older messages during a background refresh)
}
function refreshMessagesModal(){
  const body = document.getElementById('messagesModalBody');
  if(!body) return;
  const oldInput = document.getElementById('threadReplyInput');
  const draftText = oldInput ? oldInput.value : null;
  const wasFocused = oldInput && document.activeElement===oldInput;
  const selStart = oldInput ? oldInput.selectionStart : null;
  const selEnd = oldInput ? oldInput.selectionEnd : null;
  const oldList = document.getElementById('threadMsgList');
  // "Near the bottom" = within ~60px of the true bottom — if they've
  // scrolled up to read older messages, a background refresh shouldn't
  // yank them back down (same as WhatsApp).
  const wasNearBottom = !oldList || (oldList.scrollHeight - oldList.scrollTop - oldList.clientHeight < 60);
  body.innerHTML = renderMessagesModalContent();
  enhanceFormControls(body);
  bindMessagesModal(!wasNearBottom);
  if(draftText){
    const newInput = document.getElementById('threadReplyInput');
    if(newInput){
      newInput.value = draftText;
      newInput.dispatchEvent(new Event('input', {bubbles:true})); // keeps the Send button's enabled/disabled state in sync
      if(wasFocused){ newInput.focus(); if(selStart!=null) newInput.setSelectionRange(selStart, selEnd); }
    }
  }
}

// An order's fillingStatus/packagingStatus flags are whole-ORDER, but an
// order can have several items where only one is genuinely still short —
// the rest may already be fully stocked. This checks the REAL per-item
// need (same cascade-aware alert data the demand table already uses)
// instead of just the crude status flag, so filling/packaging don't get
// notified about orders that have nothing left for them to actually do.
function orderNeedsRoleWork(o, role, stockAlerts){
  if(role==='filling'){
    const needIds = new Set(stockAlerts.filled.map(a=>a.id));
    return o.items.some(i=>!i.cancelled && needIds.has(i.key));
  }
  if(role==='packaging'){
    const needIds = new Set(stockAlerts.ready.map(a=>a.id));
    return o.items.some(i=>!i.cancelled && needIds.has(i.key));
  }
  return true;
}
function renderTasks(){
  const role = S.currentUser.role;
  const isAdmin = role==='admin';
  const stockAlertsForFilter = getStockAlerts();

  let orderRelevant = [];
  if(role==='manager'){ orderRelevant = S.orders.filter(o=>o.status==='processing'); }
  else if(role==='filling'){ orderRelevant = S.orders.filter(o=>o.status==='processing' && o.fillingStatus!=='done' && orderNeedsRoleWork(o,'filling',stockAlertsForFilter)); }
  else if(role==='packaging'){ orderRelevant = S.orders.filter(o=>o.status==='processing' && o.fillingStatus==='done' && o.packagingStatus!=='done' && orderNeedsRoleWork(o,'packaging',stockAlertsForFilter)); }

  const myGeneralTasks = S.tasks.filter(t=>t.assignedTo===S.currentUser.username || t.assignedTo==='role:'+role).sort((a,b)=>b.createdAt-a.createdAt);
  const allGeneralTasks = S.tasks.slice().sort((a,b)=>b.createdAt-a.createdAt);

  let orderTasksBlock = '';
  if(role==='filling' || role==='packaging'){
    // Unified worker view: order demand + relevant stock alerts, merged into
    // one "what needs doing" list. No separate cards to check.
    const demand = {};
    const alertsNow = getStockAlerts();
    const alertListNow = role==='filling' ? alertsNow.filled : alertsNow.ready;
    const stillNeeded = new Set(alertListNow.map(a=>a.id));
    orderRelevant.forEach(o=>o.items.forEach(i=>{
      if(i.cancelled) return; // cancelled items need no work
      if(!stillNeeded.has(i.key)) return; // stock already covers this item's aggregate need — nothing pending
      if(!demand[i.key]) demand[i.key] = {qty:0, fromOrder:false, fromAlert:false, alertText:''};
      demand[i.key].qty += i.qty;
      demand[i.key].fromOrder = true;
    }));
    const myStockTasks = S.stockTasks.filter(t=>t.status==='open' && t.targetRole===role);
    myStockTasks.forEach(t=>{
      if(!demand[t.itemId]) demand[t.itemId] = {qty:0, fromOrder:false, fromAlert:false, alertText:'', tier:null};
      demand[t.itemId].fromAlert = true;
      demand[t.itemId].alertText = t.qtyText || '';
      demand[t.itemId].tier = t.tier || null;
      const am = alertListNow.find(a=>a.id===t.itemId);
      if(am && am.needQty) demand[t.itemId].suggestedQty = am.needQty;
    });
    const rows = Object.entries(demand).sort((a,b)=>{
      // Recommended-only items (no real order/urgent demand) sink to the bottom.
      const aRec = (a[1].tier==='recommended' && !a[1].fromOrder) ? 1 : 0;
      const bRec = (b[1].tier==='recommended' && !b[1].fromOrder) ? 1 : 0;
      return aRec - bRec;
    });
    orderTasksBlock = `
    <div class="card">
      <h2>${role==='filling'?'What needs to be filled':'What needs to be packed'}</h2>
      <p class="desc">Orders + stock alerts, in one place.</p>
      ${rows.length===0?`<div class="empty"><div class="big">✅</div>Nothing pending right now.</div>`:`
      <table><thead><tr><th>Item</th><th>Qty / reason</th><th></th></tr></thead><tbody>
      ${rows.map(([key,d])=>{
        const it=findItem(key);
        const alertBadge = d.tier==='recommended' ? '<span class="badge badge-processing">Recommended</span>' : '<span class="badge badge-rejected">Stock alert</span>';
        const tags = `${d.fromOrder?'<span class="badge badge-pending">Order</span> ':''}${d.fromAlert?alertBadge:''}`;
        const qtyText = d.qty>0 ? `<b>${d.qty} pc</b>` : (d.alertText||'');
        const suggestedQty = d.qty>0 ? d.qty : (d.suggestedQty||0);
        return `<tr><td>${esc(it?it.name:key)} <span class="mono">${esc(it?it.size:'')}</span><div style="margin-top:3px;">${tags}</div></td><td class="mono">${qtyText}</td><td>${role==='filling'?`<button class="btn btn-sm btn-accent" data-quick-fill="${key}|${suggestedQty}">Record</button>`:`<button class="btn btn-sm btn-accent" data-quick-pack="${key}|${suggestedQty}">Record</button>`}</td></tr>`;
      }).join('')}
      </tbody></table>`}
    </div>`;
    if(role==='packaging' && orderRelevant.length){
      orderTasksBlock += `
      <div class="card">
        <h2>Orders in Processing</h2>
        <p class="desc">City + preferred transport for each order currently being worked on.</p>
        <table><thead><tr><th>City</th><th>Transport</th><th>Items</th></tr></thead><tbody>
        ${orderRelevant.map(o=>{
          const cust = liveCustomerFor(o);
          const city = (cust && cust.city) || o.customerCity || '—';
          const transport = (cust && cust.transport) || o.transportName || '—';
          return `<tr><td><b>📍 ${esc(city)}</b></td><td>🚚 ${esc(transport)}</td><td>${o.items.map(i=>`${esc(i.name)} ${esc(i.size)} ×${i.qty}`).join('<br/>')}</td></tr>`;
        }).join('')}
        </tbody></table>
      </div>`;
    }
  } else if(orderRelevant.length){
    orderTasksBlock = `
    <div class="card">
      <h2>Processing orders — update progress</h2>
      <p class="desc">Accepted orders in progress.</p>
      <table><thead><tr><th>Customer</th><th>Items</th><th>Filling</th><th>Packaging</th></tr></thead><tbody>
      ${orderRelevant.map(o=>`
        <tr>
          <td><b>${esc(o.customerName)}</b></td>
          <td>${o.items.map(i=>`${esc(i.name)} ${esc(i.size)} ×${i.qty}`).join('<br/>')}</td>
          <td><span class="badge badge-${o.fillingStatus==='done'?'done':'pending'}">${o.fillingStatus||'pending'}</span></td>
          <td><span class="badge badge-${o.packagingStatus==='done'?'done':'pending'}">${o.packagingStatus||'pending'}</span></td>
        </tr>`).join('')}
      </tbody></table>
    </div>`;
  }

  const generalTaskRow = (t, showAssignee)=>`
    <tr>
      <td><b>${esc(t.title)}</b>${t.description?`<div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">${esc(t.description)}</div>`:''}</td>
      ${showAssignee?`<td class="mono">${t.assignedTo?esc(t.assignedToName):'— unassigned —'}</td>`:''}
      <td class="mono">${t.dueDate?esc(t.dueDate):'—'}</td>
      <td><span class="badge badge-${t.status==='done'?'done':'pending'}">${t.status}</span></td>
      <td class="row-actions">
        ${t.status!=='done' && !isAdmin ? `<button class="btn btn-sm btn-success" data-complete-task="${t.id}">Mark done</button>` : ''}
        ${isAdmin ? `<button class="btn btn-sm btn-outline" data-edit-task="${t.id}">Edit</button>${t.assignedTo?`<button class="btn btn-sm btn-outline" data-unassign-task="${t.id}">Unassign</button>`:''}<button class="btn btn-sm btn-danger" data-del-task="${t.id}">Delete</button>` : ''}
      </td>
    </tr>`;

  const generalTasksBlock = isAdmin ? `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div><h2>Assigned tasks</h2><p class="desc">Assign a task to anyone.</p></div>
        <button class="btn btn-primary btn-sm" id="newTaskBtn">+ New task</button>
      </div>
      ${allGeneralTasks.length===0?`<div class="empty"><div class="big">🗒️</div>No tasks created yet.</div>`:`
      <table><thead><tr><th>Task</th><th>Assigned to</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>
        ${allGeneralTasks.map(t=>generalTaskRow(t,true)).join('')}
      </tbody></table>`}
    </div>` : `
    <div class="card">
      <h2>My assigned tasks</h2>
      <p class="desc">From the admin.</p>
      ${myGeneralTasks.length===0?`<div class="empty"><div class="big">🗒️</div>Nothing assigned to you right now.</div>`:`
      <table><thead><tr><th>Task</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>
        ${myGeneralTasks.map(t=>generalTaskRow(t,false)).join('')}
      </tbody></table>`}
    </div>`;

  const myEntries = getMyEntries(S.currentUser.username);
  const activityBlock = `
    <div class="card">
      <h2>Your recent entries</h2>
      <p class="desc">Everything you've added.</p>
      ${myEntries.length===0?`<div class="empty">Nothing logged by you yet.</div>`:`
      <table><thead><tr><th>Entry</th><th>Detail</th><th>When</th></tr></thead><tbody>
      ${myEntries.map(e=>`<tr><td>${esc(e.label)}<div class="mono" style="margin-top:2px;">${esc(e.tag)}</div></td><td class="mono">${esc(e.detail)}</td><td class="mono">${fmtDate(e.at)}</td></tr>`).join('')}
      </tbody></table>`}
    </div>`;

  return quickActionIcons(role) + generalTasksBlock + orderTasksBlock + activityBlock;
}

    } else {
      const u = S.users.find(x=>x.username===value);
      assignedToName = u ? u.name : value;
    }
    if(existingTask){
      Object.assign(existingTask, {
        title: document.getElementById('taskTitle').value.trim(),
        description: document.getElementById('taskDesc').value.trim(),

  const entries = S.stockMovementLog.filter(m=>m.key===key && inferPool(m)===pool).sort((a,b)=>b.at-a.at);
  const kindLabel = {purchase:'🛢️ Purchase', filling:'🧴 Filling', packaging:'📦 Packaging', order:'🛍️ Order', retail:'💵 Retail/Sample', adjust:'✏️ Admin adjust'};
  // Older log entries (from before "unit"/"totalAfter" were tracked) fall
  // back to the old purchase-only mL guess, and show "—" for the total

/* ============================= BATCH NUMBER ============================= */
// Batch numbers are per item CATEGORY (product group) — every size of the
// same product shares one batch number, per the business requirement.
// The admin sets a January-2026 starting reference once per item; every
// month after that adds 1 automatically. No lookup table is stored for
// each month — it's derived fresh every time from (reference + months
// elapsed since Jan 2026), so there's nothing to keep in sync.
function monthsSinceJan2026(ts){
  const d = new Date(ts||Date.now());
  return (d.getFullYear()-2026)*12 + d.getMonth(); // getMonth() is 0-based -> Jan=0
}
function currentMonthLabel(ts){
  const d = new Date(ts||Date.now());
  return d.toLocaleDateString('en-US',{month:'short',year:'numeric'});
}
function batchNumberFor(cat, ts){
  const ref = S.batchReferences[cat];
  if(ref==null || ref==='') return null;
  const num = Number(ref) + monthsSinceJan2026(ts);
  const digits = num>=1000 ? 4 : 3; // grows past 3 digits naturally if it ever crosses 999
  return String(Math.max(num,0)).padStart(digits,'0');
}
function openBatchModal(){
  // Batch numbers are per PRODUCT (category), shared across all its sizes —
  // so the picker lists each product name once, not once per size.
  const allCats = [...new Map(CATALOG_FLAT.map(it=>[it.cat, it])).values()].sort((a,b)=>a.cat.localeCompare(b.cat));
  showModal(`
    <h3>🏷️ Batch Number</h3>
    <p class="desc" style="margin-top:-6px;">Every size of the same product shares one batch number.</p>
    <div class="field"><label>Item</label>
      <select id="batchItemSel">
        ${allCats.length===0?'<option value="">No items in catalog</option>':`<option value="">Select an item…</option>${allCats.map(it=>`<option value="${esc(it.cat)}">${esc(it.name)}</option>`).join('')}`}
      </select>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="cancelModal">Close</button>
    </div>
  `);
  const sel = document.getElementById('batchItemSel');
  sel.addEventListener('change', renderBatchResult);
  renderBatchResult();
}
function renderBatchResult(){
  const sel = document.getElementById('batchItemSel');
  const box = document.getElementById('batchResultBox');
  if(!sel || !box) return;
  const cat = sel.value;
  if(!cat){ box.innerHTML=''; return; }
  const isAdmin = S.currentUser.role==='admin';
  const batchNo = batchNumberFor(cat);
  if(batchNo){
    const sizesForCat = CATALOG_FLAT.filter(it=>it.cat===cat);
    box.innerHTML = `<div style="background:var(--bg);border-radius:12px;padding:16px;text-align:center;">
      <div style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">${esc(cat)}</div>
      <div style="font-size:26px;font-weight:900;color:var(--primary);">${batchNo}/${currentMonthLabel()}</div>
    </div>
    ${sizesForCat.length>0?`<div class="field" style="margin-top:10px;"><label>Size</label>
      <select id="batchSizeSel"><option value="">Select a size…</option>${sizesForCat.map(it=>`<option value="${it.key}">${esc(it.size)}</option>`).join('')}</select>
    </div>
    <div id="batchStampBox"></div>`:''}
    ${isAdmin?`<button type="button" class="btn btn-outline btn-sm" id="editBatchRefBtn" style="width:100%;margin-top:10px;">✏️ Edit Jan 2026 reference (currently ${esc(String(S.batchReferences[cat]))})</button><div id="batchRefEditBox"></div>`:''}`;
    enhanceFormControls(box);
    const sizeSel = document.getElementById('batchSizeSel');
    if(sizeSel) sizeSel.addEventListener('change', ()=>{
      const stampBox = document.getElementById('batchStampBox');
      const it = findItem(sizeSel.value);
      if(!it){ stampBox.innerHTML=''; return; }
      const usp = it.ml ? (it.mrp/it.ml) : null;
      stampBox.innerHTML = `<div style="background:var(--primary);color:#fff;border-radius:12px;padding:16px;margin-top:10px;font-family:var(--font-mono);text-align:left;line-height:1.9;">
        <div><b>MRP</b> — ${it.mrp}/-</div>
        <div><b>USP</b> — ${usp!=null?usp.toFixed(3):'—'}/mL</div>
        <div><b>Batch No</b> — ${batchNo}</div>
        <div><b>Date of Pkg</b> — ${currentMonthLabel()}</div>
      </div>`;
    });
  } else {
    box.innerHTML = `<div class="empty">No January 2026 reference set for this item yet.</div>
    ${isAdmin?`<div class="field"><label>January 2026 reference number</label><input id="batchRefInput" type="number" min="0" placeholder="e.g. 36" /></div>
    <button type="button" class="btn btn-primary btn-sm" id="saveBatchRefBtn" style="width:100%;">Save reference</button>`
    :`<p class="desc">Ask an admin to set the starting reference for this item.</p>`}`;
  }
  const saveBtn = document.getElementById('saveBatchRefBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const val = parseInt(document.getElementById('batchRefInput').value);
    if(isNaN(val) || val<0){ showAlert('Enter a valid reference number.'); return; }
    S.batchReferences[cat] = val;
    safeSet('app:batchReferences', S.batchReferences);
    showToast('Reference saved');
    renderBatchResult();
  });
  const editBtn = document.getElementById('editBatchRefBtn');
  if(editBtn) editBtn.addEventListener('click', ()=>{
    const editBox = document.getElementById('batchRefEditBox');
    editBox.innerHTML = `<div class="field" style="margin-top:10px;"><label>New January 2026 reference</label><input id="batchRefInput2" type="number" min="0" value="${esc(String(S.batchReferences[cat]))}" /></div>

      const val = parseInt(document.getElementById('batchRefInput2').value);
      if(isNaN(val) || val<0){ showAlert('Enter a valid reference number.'); return; }
      S.batchReferences[cat] = val;
      safeSet('app:batchReferences', S.batchReferences);
      showToast('Reference updated');
      renderBatchResult();
    });
  });
}

  // type: 'sale' (counter/cash sale, one combined total) | 'sample' (free, no amount)
  // existingEntry: pass an existing retailSales record to EDIT it instead of creating a new one
  const isSale = type==='sale';
  retailDraft = existingEntry ? (existingEntry.items||[]).map(x=>({key:x.key, name:findItem(x.key)?findItem(x.key).name:x.itemLabel, size:findItem(x.key)?findItem(x.key).size:'', qty:x.qty})) : [];
  showModal(`
    <h3>${existingEntry?'Edit ':''}${isSale?'💵 Retail / Cash Sale':'🎁 Give Sample'}</h3>
    <p class="desc" style="margin-top:-6px;">${isSale?'Sold directly from ready stock — deducted immediately.':'Given free from ready stock — deducted immediately.'}</p>
    <div class="field"><label>Add item (type to search)</label>${itemPickerHtml('retailItemSel', null)}</div>
    <div class="field"><label>Quantity (pieces)</label>
      <div style="display:flex;gap:6px;">
        <input id="retailItemQty" type="number" min="0" max="${MAX_PC_ENTRY}" placeholder="Qty" style="flex:2;" />
        <button type="button" class="btn btn-accent btn-sm" id="addRetailItemBtn" style="flex:1;">Add</button>
      </div>
    </div>
    <div id="retailDraftList" style="margin:10px 0;"></div>
    ${isSale?`<div class="field"><label>Total Amount Received (₹)</label><input id="retailTotalAmount" type="number" min="0.01" step="0.01" placeholder="Amount" required ${existingEntry?`value="${existingEntry.totalAmount}"`:''} /></div>`:''}
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="cancelModal">Cancel</button>
      <button type="button" class="btn btn-primary" id="submitRetailBtn">${existingEntry?'Save changes':'Record'}</button>
    </div>
  `);
  renderRetailDraftList();
  const itemSel = document.getElementById('retailItemSel');
  document.getElementById('addRetailItemBtn').addEventListener('click', ()=>{
    const it = resolveItemFromText(itemSel.value);
    if(!it){ showAlert('Pick a valid item from the list.'); return; }
    const qty = parseInt(document.getElementById('retailItemQty').value)||0;
    if(qty<=0){ showAlert('Enter a quantity.'); return; }
    if(qty>MAX_PC_ENTRY){ showAlert(`Max ${MAX_PC_ENTRY} pc per line item.`); return; }
    const existing = retailDraft.find(d=>d.key===it.key);
    if(existing) existing.qty += qty; else retailDraft.push({key:it.key, name:it.name, size:it.size, qty});
    renderRetailDraftList();
    itemSel.value=''; document.getElementById('retailItemQty').value='0';
  });
  document.getElementById('submitRetailBtn').addEventListener('click', ()=>{
    if(existingEntry && (!withinSelfEditWindow(existingEntry) || (S.currentUser.role!=='admin' && existingEntry.byUsername!==S.currentUser.username))){
      showAlert('This entry can no longer be edited (past the 5-minute window).');
      closeModal(); render(); return;
    }
    if(!existingEntry && blockIfOutsideEntryWindow()) return; // only gates a NEW sale/sample -- editing an existing one is handled above
    if(retailDraft.length===0){ showAlert('Add at least one item.'); return; }
    // When editing, this entry's OWN current quantities are already
    // deducted from readyStock — add them back in before checking
    // availability, since they'll be released and re-deducted below.
    const ownQty = key => existingEntry ? ((existingEntry.items||[]).find(x=>x.key===key)?.qty||0) : 0;
    for(const d of retailDraft){
      const currentAvail = (S.readyStock[d.key]||0) + ownQty(d.key);
      if(currentAvail < d.qty){
        showAlert(`${d.name} ${d.size} — only ${currentAvail} pc available, not enough for ${d.qty} pc.`);
        return;
      }
    }
    const totalAmount = isSale ? (parseFloat(document.getElementById('retailTotalAmount').value)||0) : 0;
    if(isSale && totalAmount<=0){ showAlert('Enter the amount received.'); return; }
    if(existingEntry) (existingEntry.items||[]).forEach(d=>{ S.readyStock[d.key] = (S.readyStock[d.key]||0) + d.qty; logStockMovement(d.key, d.itemLabel, 'retail', d.qty, 'Retail entry edited — released for re-recording'); }); // release old
    retailDraft.forEach(d=>{ S.readyStock[d.key] = (S.readyStock[d.key]||0) - d.qty; logStockMovement(d.key, `${d.name} ${d.size}`, 'retail', -d.qty, `${isSale?'Retail sale':'Sample given'}${existingEntry?' (edited)':''}`); }); // deduct new
    const entry = existingEntry || { id:uid(), type, by:S.currentUser.name, byUsername:S.currentUser.username, at:Date.now() };
    entry.items = retailDraft.map(d=>({ key:d.key, itemLabel:`${d.name} ${d.size}`, qty:d.qty }));
    entry.totalAmount = totalAmount;
    if(!existingEntry) S.retailSales.push(entry);
    safeSet('app:readyStock', S.readyStock);
    savePartitionForItem('retailSales', entry);
    syncStockTasksFromAlerts(); // this deduction can itself create/worsen a shortage
    closeModal(); render();
    showToast(existingEntry ? 'Updated' : (isSale?'Sale recorded':'Sample recorded'));
  });
}
function renderRetailDraftList(){
  const el = document.getElementById('retailDraftList');

/* ============================= BULK STOCK EDIT (admin — update qty + low alert for many items at once) ============================= */

      const store = kind==='raw'?S.rawMaterial:kind==='filled'?S.filledStock:S.readyStock;

      const store = kind==='raw'?S.lowStock.raw:kind==='filled'?S.lowStock.filled:S.lowStock.ready;

/* ============================= GENERIC STOCK ADJUST (admin) ============================= */
function openAdjustModal(kind, id, currentVal, label){
  const isRaw = kind==='raw';
  const displayVal = isRaw ? +(currentVal/1000).toFixed(2) : currentVal;
  showModal(`
    <h3>Adjust — ${esc(label)}</h3>
    <div class="field"><label>New quantity ${isRaw?'(Liters)':'(pieces)'}</label><input id="adjVal" type="number" ${isRaw?`step="0.01" max="${MAX_STOCK_ADJUST_L}" min="-${MAX_STOCK_ADJUST_L}"`:`max="${MAX_STOCK_ADJUST_PC}" min="-${MAX_STOCK_ADJUST_PC}"`} value="${displayVal}" /></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="cancelModal">Cancel</button>
      <button type="button" class="btn btn-primary" id="adjSave">Save</button>
    </div>
  `);
  document.getElementById('adjSave').addEventListener('click', async ()=>{
    const raw = parseFloat(document.getElementById('adjVal').value)||0;
    // MEDIUM FIX (2026-08-21 audit, finding #22): this Save button is
    // type="button", not a real <form> submit, so the min/max attributes
    // just added above are never enforced by the browser -- this explicit
    // JS check is what actually catches a fat-fingered extra zero.
    // Deliberately a magnitude check (Math.abs), not a min=0 floor:
    // negative stock is a real, intentionally-displayed state elsewhere
    // in this app (see the stockneg styling on the inventory tables, used
    // for tracking a genuine deficit/overselling situation), so blocking
    // negative values here would prevent a legitimate correction.
    const adjCap = isRaw ? MAX_STOCK_ADJUST_L : MAX_STOCK_ADJUST_PC;
    if(Math.abs(raw) > adjCap){ showAlert(`That's more than ${adjCap.toLocaleString()} ${isRaw?'L':'pc'} — please double-check for a typo (extra zero?) before saving.`); return; }
    const val = isRaw ? raw*1000 : raw; // Liters -> mL for raw material
    let key;
    const oldVal = kind==='raw' ? (S.rawMaterial[id]||0) : kind==='filled' ? (S.filledStock[id]||0) : (S.readyStock[id]||0);
    if(kind==='raw'){ S.rawMaterial[id]=val; key='app:rawMaterial'; }
    if(kind==='filled'){ S.filledStock[id]=val; key='app:filledStock'; }
    if(kind==='ready'){ S.readyStock[id]=val; key='app:readyStock'; }
    safeSet(key, kind==='raw'?S.rawMaterial:kind==='filled'?S.filledStock:S.readyStock);
    if(val !== oldVal) logStockMovement(id, label, 'adjust', val-oldVal, 'Manually adjusted by admin', kind);
    if(kind==='ready') autoAdvanceOrders();
    if(kind==='filled' || kind==='ready') syncStockTasksFromAlerts();
    closeModal(); render(); showToast('Updated');
  });
}

      const timeCell = (a.type==='present' && !a.markedByAdmin) ? fmtTime(a.timestamp) : '—';

  const attemptGetPosition = (opts)=> new Promise((resolve,reject)=>{
    navigator.geolocation.getCurrentPosition(resolve, reject, opts);
  });
  const requestLocation = async (msg, fieldLocation)=>{
    // Try a precise GPS fix first; if that fails or times out, retry once
    // with a coarser network/wifi-based fix — this alone recovers location
    // for a lot of indoor/cold-GPS cases that would otherwise fail outright.
    try{
      if(msg) msg.textContent = 'Getting a precise GPS fix…';
      const pos = await attemptGetPosition({enableHighAccuracy:true, timeout:18000, maximumAge:0});
      recordPresent(pos.coords.latitude, pos.coords.longitude, '', fieldLocation);
      return;
    }catch(err1){
      if(err1 && err1.code===1){ // permission denied — no point retrying
        if(msg) msg.textContent = 'Location permission denied. Marked present without location.';
        recordPresent(0, 0, 'geo-error-1', fieldLocation);
        return;
      }
      if(msg) msg.textContent = 'Retrying with a faster, lower-accuracy fix…';
      try{
        const pos = await attemptGetPosition({enableHighAccuracy:false, timeout:12000, maximumAge:30000});
        recordPresent(pos.coords.latitude, pos.coords.longitude, '', fieldLocation);
        return;
      }catch(err2){
        const reason = err2 && err2.code===1 ? 'Location permission denied.' : err2 && err2.code===2 ? "GPS/location seems off — check phone Location settings." : 'Location timed out.';
        if(msg) msg.textContent = `${reason} Marked present without location.`;
        recordPresent(0, 0, 'geo-error-'+(err2&&err2.code), fieldLocation);
      }
    }
  };
  btn.addEventListener('click', ()=>{
    const msg = document.getElementById('geoMsg');
    let fieldLocation = '';
    if(S.currentUser.role==='sales'){
      const flInput = document.getElementById('fieldLocationInput');
      fieldLocation = flInput ? flInput.value.trim() : '';
      if(!fieldLocation){ showAlert('Field Location is required — where are you going for marketing today?'); return; }
    }
    if(location.protocol === 'file:'){
      if(msg) msg.textContent = 'This file:// page can never get location — open the hosted https:// link instead.';
      return;
    }
    if(!window.isSecureContext){
      if(msg) msg.textContent = 'Needs https:// for location — marked without it.';
      recordPresent(0, 0, 'insecure-context', fieldLocation); return;
    }
    if(!navigator.geolocation){
      if(msg) msg.textContent='Location not supported on this device — marking without it.';
      recordPresent(0, 0, 'no-geo-support', fieldLocation); return;
    }
    // Pre-check permission state where supported, so we can tell the person
    // exactly what's going on instead of guessing from a generic error.
    if(navigator.permissions && navigator.permissions.query){
      navigator.permissions.query({name:'geolocation'}).then(status=>{
        if(status.state==='denied'){
          if(msg) msg.textContent = 'Location blocked for this site — open your browser\'s site settings to allow it, then try again.';
          recordPresent(0, 0, 'permission-denied-cached', fieldLocation);
          return;
        }
        if(msg) msg.textContent = status.state==='prompt' ? 'Waiting for you to allow location…' : 'Getting your location…';
        requestLocation(msg, fieldLocation);
      }).catch(()=>{
        if(msg) msg.textContent = 'Waiting for location…';
        requestLocation(msg, fieldLocation);
      });
    } else {
      if(msg) msg.textContent = 'Waiting for location…';
      requestLocation(msg, fieldLocation);
    }
  });
}
