function dateKeyToTs(dateKey){
  const [y,m,d] = dateKey.split('-').map(Number);
  return new Date(y, m-1, d, 12).getTime();
}
// Day-wise list of every employee, marked Present if they have any
// attendance record that day (works with both new 'present' entries and
// any legacy 'checkin'/'checkout' records).
function isWorkingDay(dk){
  return !isSundayDateKey(dk) && !S.holidays[dk];
}
function attendanceStatusFor(username, dk){
  if(isSundayDateKey(dk)) return {status:'sunday'};
  if(S.holidays[dk]) return {status:'holiday', label:S.holidays[dk].label};
  const dayRecords = S.attendance.filter(a=>a.username===username && localDateKey(a.timestamp)===dk).sort((a,b)=>b.timestamp-a.timestamp);
  if(!dayRecords.length) return {status:'unmarked'};
  return {status: dayRecords[0].type, record: dayRecords[0]};
}
function computePresenceByDate(){
  const relevantUsers = S.users.filter(u=>u.role!=='admin');
  const allDateKeys = new Set();
  S.attendance.forEach(a=>allDateKeys.add(localDateKey(a.timestamp)));
  Object.keys(S.holidays).forEach(dk=>allDateKeys.add(dk));
  allDateKeys.add(localDateKey(Date.now())); // always show today, even with zero records, so admin can act on it
  return [...allDateKeys].sort().reverse().slice(0,30).map(dk=>({
    dateKey: dk,
    dateTs: dateKeyToTs(dk),
    isSunday: isSundayDateKey(dk),
    holidayLabel: holidayLabelFor(dk),
    entries: relevantUsers.map(u=>{
      const st = attendanceStatusFor(u.username, dk);
      return { username:u.username, name:u.name, status:st.status, record:st.record, holidayLabel:st.label };
    })
  }));
}

        return { name:u.name, role: ROLES[u.role]?ROLES[u.role].label:u.role, isActive, lastSeen, statusHtml };
      }).sort((a,b)=> (b.isActive?1:0)-(a.isActive?1:0) || (b.lastSeen||0)-(a.lastSeen||0));
      return `<table><thead><tr><th>Name</th><th>Role</th><th>Status</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="mono">${esc(r.role)}</td><td>${r.statusHtml}</td></tr>`).join('')}
      </tbody></table>`;

    ${(() => {

        .sort((a,b)=>(b[1].lastFailAt||0)-(a[1].lastFailAt||0));
      if(!entries.length) return `<div class="empty">No failed login attempts recorded.</div>`;
      return `<table><thead><tr><th>Username</th><th>Failed attempts</th><th>Last attempt</th><th>Status</th><th></th></tr></thead><tbody>
        ${entries.map(([uname, r])=>{
          const locked = r.lockedUntil && r.lockedUntil>Date.now();
          const statusHtml = locked
            ? `<span style="color:var(--danger);">🔒 Locked — ${Math.max(1,Math.ceil((r.lockedUntil-Date.now())/1000))}s left</span>`
            : `<span class="mono" style="color:var(--ink-soft);">Not locked</span>`;
          return `<tr><td class="mono">${esc(uname)}</td><td class="mono">${r.failCount}</td><td class="mono">${fmtAgo(r.lastFailAt)}</td><td>${statusHtml}</td><td><button type="button" class="btn btn-sm btn-outline" data-clear-lockout="${esc(uname)}">Clear</button></td></tr>`;
        }).join('')}
      </tbody></table>`;
    })()}
  </div>`;
}

function openMarkForOthersModal(){
  const employees = S.users.filter(u=>u.role!=='admin');
  const today = localDateKey(Date.now());
  showModal(`
    <h3>📍 Mark attendance for someone</h3>
    <p class="desc" style="margin-top:-6px;">Recorded as marked by you, not GPS-verified.</p>
    <div class="field"><label>Employee</label>
      <select id="markForUserSel">${employees.map(u=>`<option value="${esc(u.username)}">${esc(u.name)} (${esc(ROLES[u.role]?ROLES[u.role].label:u.role)})</option>`).join('')}</select>

    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="cancelModal">Cancel</button>
      <button type="button" class="btn btn-primary" id="confirmMarkForBtn">Mark</button>
    </div>
  `);
  document.getElementById('confirmMarkForBtn').addEventListener('click', ()=>{
    const username = document.getElementById('markForUserSel').value;
    const dateStr = document.getElementById('markForDateInput').value;
    const status = document.getElementById('markForStatusSel').value;
    const u = S.users.find(x=>x.username===username);
    if(!u || !dateStr){ showAlert('Pick an employee and date.'); return; }
    if(!isWorkingDay(dateStr)){ showAlert('This date is a week-off/holiday — attendance doesn\'t apply.'); return; }
    // Midday avoids any date-boundary ambiguity, and — since the most
    // recent record per user+day wins (see attendanceStatusFor) — this
    // correctly overrides an earlier record for the same day if the admin
    // is correcting a mistake, while a genuine later self-mark (which
    // would carry a real, later timestamp) still wins over this instead.
    // For TODAY, use the real current time so "most recent wins" compares
    // fairly against a genuine self-mark from earlier or later today —
    // a fixed noon timestamp could otherwise incorrectly outrank (or lose
    // to) a real same-day self-mark depending purely on what time of day
    // it happened. For a PAST date there's no "real time" to compare
    // against, so noon remains a reasonable stand-in there.
    const ts = dateStr===today ? Date.now() : dateKeyToTs(dateStr);
    const entry = { id:uid(), username, name:u.name, type:status, lat:0, lng:0, timestamp:ts, note:'', fieldLocation:'', markedByAdmin:true, markedByName:S.currentUser.name };
    S.attendance.push(entry);
    savePartitionForItem('attendance', entry);
    closeModal(); render(); showToast(`${u.name} marked ${status} for ${dateStr}`);
  });
}

  `);
  const input = document.getElementById('summaryMonthInput');

    const [y, m] = input.value.split('-').map(Number);
    renderMonthlySummary(y, m);
  };

function renderMonthlySummary(year, month1based){
  const box = document.getElementById('summaryResultBox');
  if(!box) return;
  const daysInMonth = new Date(year, month1based, 0).getDate();
  const employees = S.users.filter(u=>u.role!=='admin');
  const today = localDateKey(Date.now());
  let workingDaysCount = 0;
  const dayKeys = [];
  for(let d=1; d<=daysInMonth; d++){
    const dk = `${year}-${String(month1based).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(dk > today) break; // don't count days that haven't happened yet
    dayKeys.push(dk);
    if(isWorkingDay(dk)) workingDaysCount++;
  }
  const rows = employees.map(u=>{
    let presentCount = 0;
    const absentDates = [];
    dayKeys.forEach(dk=>{
      if(!isWorkingDay(dk)) return;
      const st = attendanceStatusFor(u.username, dk);
      if(st.status==='present') presentCount++;
      else absentDates.push(dk);
    });
    return { name:u.name, present:presentCount, absent:absentDates.length, absentDates };
  });
  box.innerHTML = workingDaysCount===0 ? `<div class="empty">No working days yet this month.</div>` : `
    <table><thead><tr><th>Employee</th><th>Working days</th><th>Present</th><th>Absent</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="mono">${workingDaysCount}</td><td class="mono" style="color:var(--success);font-weight:700;">${r.present}</td><td class="mono" style="color:var(--danger);font-weight:700;">${r.absent}</td></tr>
    ${r.absentDates.length?`<tr><td colspan="4" style="font-size:12px;color:var(--ink-soft);padding-top:0;padding-bottom:10px;">Absent: ${r.absentDates.map(dk=>fmtDateOnly(dateKeyToTs(dk))).join(', ')}</td></tr>`:''}`).join('')}
    </tbody></table>`;
}

// Centered red alert dialog — replaces the native browser showAlert() everywhere,
// since a browser-native popup looks jarring and inconsistent with the app.
// Styled replacement for prompt() used purely to show text for manual
// copying (clipboard API fallback) — a textarea instead of showPrompt's
// single-line input, since the text can be multi-line.
function showCopyableText(message, text){
  const existing = document.getElementById('appAlertOverlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'app-alert-overlay';
  overlay.id = 'appAlertOverlay';

    <div class="app-alert-box">
      <div class="app-alert-icon">📋</div>
      <div class="app-alert-message">${esc(message)}</div>
      <textarea readonly style="width:100%;box-sizing:border-box;padding:11px 12px;border-radius:11px;border:1.5px solid var(--border);font-size:13px;margin-bottom:12px;min-height:120px;font-family:inherit;">${esc(text)}</textarea>
      <button type="button" class="app-alert-ok-btn" id="appAlertOkBtn">Close</button>
    </div>`;
  const host = document.querySelector('.device-screen') || document.body;

}
function showAlert(message){
  const existing = document.getElementById('appAlertOverlay');

}
// Styled replacement for the native confirm() — since a DOM dialog can't
// block execution the way confirm() does, the code that used to run after
// "if(!confirm(...)) return;" now runs inside onConfirm instead. Cancel
// (or tapping outside) just closes the dialog and does nothing further,
// matching confirm()'s "false" behavior.
function showConfirm(message, onConfirm, opts, onCancel){
  const existing = document.getElementById('appAlertOverlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'app-alert-overlay';
  overlay.id = 'appAlertOverlay';
  const confirmLabel = (opts && opts.confirmLabel) || 'Yes';
  const cancelLabel = (opts && opts.cancelLabel) || 'Cancel';
  const danger = !opts || opts.danger !== false; // red confirm button by default (most confirms guard a destructive action)
  overlay.innerHTML = `
    <div class="app-alert-box">
      <div class="app-alert-icon">${danger?'⚠️':'❓'}</div>
      <div class="app-alert-message">${esc(message)}</div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="app-alert-ok-btn" id="appConfirmCancelBtn" style="background:var(--bg);color:var(--ink);border:1.5px solid var(--border);">${esc(cancelLabel)}</button>
        <button type="button" class="app-alert-ok-btn" id="appConfirmOkBtn" style="background:${danger?'var(--danger)':'var(--primary)'};">${esc(confirmLabel)}</button>
      </div>
    </div>`;
  const host = document.querySelector('.device-screen') || document.body;
  host.appendChild(overlay);
  const close = ()=>{ overlay.remove(); };
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ close(); if(onCancel) onCancel(); } });
  overlay.querySelector('#appConfirmCancelBtn').addEventListener('click', ()=>{ close(); if(onCancel) onCancel(); });
  overlay.querySelector('#appConfirmOkBtn').addEventListener('click', ()=>{ close(); onConfirm(); });
}
// Styled replacement for the native prompt() — same async-via-callback
// approach as showConfirm. onSubmit receives the trimmed input value, or
// is never called at all if the person cancels.

      <div style="display:flex;gap:8px;">

        <button type="button" class="app-alert-ok-btn" id="appPromptOkBtn" style="background:var(--primary);">OK</button>

  const close = ()=>{ overlay.remove(); };
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ close(); if(onCancel) onCancel(); } });
  overlay.querySelector('#appPromptCancelBtn').addEventListener('click', ()=>{ close(); if(onCancel) onCancel(); });
  const submit = ()=>{ const val = input.value.trim(); close(); onSubmit(val); };
  overlay.querySelector('#appPromptOkBtn').addEventListener('click', submit);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
}
function showModal(innerHtml, extraClass){
  closeModal(); // never stack modals — opening a new one while one is already showing used to leave two overlays behind, needing two closes to get rid of both
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `<div class="modal${extraClass?' '+extraClass:''}"><div class="sheet-handle"></div>${innerHtml}</div>`;
  const host = document.querySelector('.device-screen') || document.body;
  host.appendChild(overlay);
  enhanceFormControls(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  const cancelBtn = overlay.querySelector('#cancelModal');
  if(cancelBtn) cancelBtn.addEventListener('click', closeModal);
}
function closeModal(){ const o = document.getElementById('modalOverlay'); if(o) o.remove(); }

/* ============================= INIT ============================= */
/* ============================= DEVICE PERMISSIONS (ask once, up front) ============================= */
function primeDevicePermissions(){
  try{
    if('Notification' in window && Notification.permission==='default'){
      Notification.requestPermission().catch(()=>{});
    }
  }catch(e){}
  try{
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(()=>{}, ()=>{}, {timeout:8000, maximumAge:600000});
    }
  }catch(e){}
  primeAudioUnlock();
}
// Browsers block audio (our notification "ring") until the page has had a
// real user gesture — unlock it on the very first tap/click anywhere.
let audioUnlocked = false;
function primeAudioUnlock(){
  if(audioUnlocked) return;
  const unlock = ()=>{
    if(audioUnlocked) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      audioUnlocked = true;
    }catch(e){}
    document.removeEventListener('click', unlock);
    document.removeEventListener('touchstart', unlock);
  };
  document.addEventListener('click', unlock, {once:true});
  document.addEventListener('touchstart', unlock, {once:true});
}

/* ============================= NOTIFICATION "RING" ============================= */
let lastKnownNotifCount = 0;
let audioCtx = null;
function playNotifRing(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [0, 0.18].forEach(off=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now+off);
      gain.gain.exponentialRampToValueAtTime(0.18, now+off+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+off+0.16);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now+off); osc.stop(now+off+0.18);
    });
  }catch(e){}
}
function checkForNewNotifRing(){
  if(!S.currentUser) return;
  const count = myNotifCount(getStockAlerts());
  if(count > lastKnownNotifCount) playNotifRing();
  lastKnownNotifCount = count;
}

/* ============================= INIT ============================= */
let loadAllPromise = null;
(async function init(){
  loadOfflineQueue();
  render();
  primeDevicePermissions();
  loadAllPromise = loadAll();
  await loadAllPromise;
  render();
  if(S.currentUser){ primeDevicePermissions(); lastKnownNotifCount = myNotifCount(getStockAlerts()); }
  flushOfflineQueue(); // in case saves were queued from a previous session
  window.addEventListener('online', ()=>{ showToast('Back online — syncing…'); flushOfflineQueue(); });
  window.addEventListener('offline', ()=>{ showToast('No connection — changes will be saved and synced automatically', true); });
  // Re-render (debounced) when the window crosses the desktop-sidebar
  // breakpoint, so resizing a browser window updates the nav split
  // (bottom-bar "More" overflow <-> full sidebar list) without waiting
  // for an unrelated state change to trigger the next render.
  (function watchDesktopSidebarBreakpoint(){
    let wasDesktop = window.innerWidth >= DESKTOP_SIDEBAR_MIN_WIDTH;
    let resizeTimer = null;
    window.addEventListener('resize', ()=>{
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(()=>{
        const isDesktop = window.innerWidth >= DESKTOP_SIDEBAR_MIN_WIDTH;
        if(isDesktop !== wasDesktop){ wasDesktop = isDesktop; if(S.currentUser) render(); }
      }, 150);
    });
  })();
  // SPEED (2026-08-21, "notifications ko zda se zda fast kro"): was 4000ms.
  // action=version (what every tick pays for on the no-change path, by far
  // the common case) is deliberately built to never open the spreadsheet
  // (see doGet's own comment), so it's cheap enough to poll twice as often
  // -- this halves the worst-case delay between something real happening
  // and every online device noticing it (new order, status change, chat
  // message, bell badge/ring -- see checkForNewNotifRing inside
  // doSyncTick), closer to a real push's feel without needing every single
  // event type to go through OneSignal.
  startSyncPolling(2000);
  startHeartbeat();
  startSessionExpiryWatch();
  watchUserActivityForIdleTimeout();
  // Backstop only now (2026-08-21) -- the real, fast check runs inside
  // doSyncTick itself the instant new data actually arrives (every 2s at
  // most). This just catches the rare case where doSyncTick keeps
  // skipping ticks for a while (e.g. a modal left open a long time), so
  // the bell/ring can never fall silent for more than 5s no matter what.
  // checkForNewNotifRing is idempotent (compares against the last count it
  // saw), so this running redundantly alongside doSyncTick's own call is
  // harmless -- never a double ring for the same new item.
  setInterval(checkForNewNotifRing, 5000);
})();
</script>
